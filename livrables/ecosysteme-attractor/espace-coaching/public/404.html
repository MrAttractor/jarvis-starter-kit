<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page introuvable · Mr Attractor</title>
<style>
:root{--ink:#16181C;--ink-2:#4A4F57;--muted:#8A8F97;--creme:#FAF7F2;--sable:#E4DED4;--accent:#B85C2A;--accent-bg:#FBF1EA;--accent-d:#98481F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--creme);line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
.boite{max-width:460px;text-align:center}
.rond{width:64px;height:64px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.rond svg{width:30px;height:30px;stroke:var(--accent-d);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:24px;line-height:1.25;margin-bottom:12px}
p{color:var(--ink-2);font-size:15.5px;margin-bottom:16px}
.pied{font-size:12px;color:var(--muted);margin-top:28px}
.logo{font-weight:800;font-size:16px}
.logo span{color:var(--accent)}
</style>
</head>
<body>
<div class="boite">
  <div class="rond"><svg viewBox="0 0 24 24"><path d="M12 8v5"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
  <h1>Cette page n'existe pas.</h1>
  <p>Si vous suiviez un lien reçu par message, il a peut-être été coupé en route. Les liens d'accompagnement sont longs et se cassent facilement.</p>
  <p>Le plus simple est de demander qu'on vous le renvoie.</p>
  <div class="pied"><span class="logo">Mr <span>Attractor</span></span></div>
</div>
</body>
</html>
