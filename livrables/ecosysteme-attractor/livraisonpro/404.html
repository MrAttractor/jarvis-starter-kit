<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Livraison Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#0E1420;color:#F2F4F8;line-height:1.55;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden;
}
.boite{max-width:440px;text-align:center}
.rond{
  width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
}
.rond svg{width:30px;height:30px;stroke:#F2A65A;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:24px;line-height:1.25;margin-bottom:12px}
p{color:#A9B2C3;font-size:15.5px;margin-bottom:16px}
a.btn{
  display:inline-block;margin-top:8px;padding:14px 26px;min-height:44px;
  border-radius:10px;background:#F2A65A;color:#0E1420;font-weight:800;text-decoration:none;
}
.pied{font-size:12px;color:#6D7789;margin-top:28px}
</style>
</head>
<body>
<div class="boite">
  <div class="rond"><svg viewBox="0 0 24 24"><path d="M12 8v5"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
  <h1>Cette page n'existe pas.</h1>
  <p>Si vous suiviez un lien reçu par message, il a peut-être été coupé en route.</p>
  <a class="btn" href="/">Revenir à l'accueil</a>
  <div class="pied">Livraison Pro</div>
</div>
</body>
</html>
