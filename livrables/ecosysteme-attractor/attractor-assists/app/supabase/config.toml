# ── Fonctions publiques (appelees par le navigateur SANS cle) ──
# Sans ces entrees, `supabase functions deploy <nom>` remet verify_jwt=true
# et casse silencieusement la page cote prospect (401 -> ecran "introuvable").
# Regression constatee le 21/07/2026 sur generate-proposition.
[functions.generate-proposition]
verify_jwt = false

[functions.diagnostic]
verify_jwt = false

[functions.devis-accept]
verify_jwt = false

# ── Signature Attractor ──
# sign-load / sign-otp / sign-verify sont ouvertes : c'est le jeton du lien
# personnel qui authentifie le signataire, pas une cle Supabase.
# sign-create reste ouverte au sens JWT mais est protegee par SIGN_ADMIN_SECRET.
[functions.sign-create]
verify_jwt = false

[functions.sign-load]
verify_jwt = false

[functions.sign-otp]
verify_jwt = false

[functions.sign-verify]
verify_jwt = false

# ── VSD by Attractor ──
# Inscriptions a la liste d'attente depuis le site public : appelee par
# un visiteur anonyme, elle doit rester ouverte au sens JWT. L'insertion
# se fait en service role cote fonction, aucune ecriture directe possible.
[functions.vsd-inscription]
verify_jwt = false
