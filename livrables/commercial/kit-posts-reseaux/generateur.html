<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur de posts · Mr Attractor</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --orange:#F25C05; --orange-d:#B84403; --charbon:#1A1714; --black:#0A0A0A;
    --sable:#FAF6F0; --g200:#E7E1D8; --g400:#9A938B; --g700:#4A443E; --green:#3DDC84;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Sora',sans-serif; background:#141210; color:var(--sable);
    display:grid; grid-template-columns:380px 1fr; min-height:100vh;}
  /* ----- Panneau de contrôle ----- */
  .panel{background:#1d1a17; border-right:1px solid #2a2621; padding:26px 24px; overflow-y:auto; height:100vh;}
  .panel h1{font-size:19px; font-weight:800; letter-spacing:-.01em;}
  .panel h1 span{color:var(--orange);}
  .panel .lead{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--g400); margin:4px 0 22px;}
  .fld{margin-bottom:16px;}
  .fld label{display:block; font-family:'Space Mono',monospace; font-size:10.5px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--g400); margin-bottom:7px;}
  .fld input[type=text], .fld textarea, .fld select{
    width:100%; background:#141210; border:1px solid #33302b; border-radius:9px;
    color:var(--sable); font-family:'Sora',sans-serif; font-size:14px; padding:10px 12px; outline:none;}
  .fld textarea{resize:vertical; min-height:64px; line-height:1.4;}
  .fld input:focus, .fld textarea:focus, .fld select:focus{border-color:var(--orange);}
  .seg{display:flex; gap:6px; flex-wrap:wrap;}
  .seg button{flex:1; min-width:64px; background:#141210; border:1px solid #33302b; color:var(--g200);
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.04em; padding:9px 6px;
    border-radius:8px; cursor:pointer;}
  .seg button.on{background:var(--orange); border-color:var(--orange); color:#fff; font-weight:700;}
  .btn-dl{width:100%; margin-top:10px; background:var(--orange); color:#fff; border:none;
    font-family:'Sora',sans-serif; font-weight:800; font-size:15px; padding:14px; border-radius:11px; cursor:pointer;}
  .btn-dl:hover{background:var(--orange-d);}
  .hint{font-family:'Space Mono',monospace; font-size:10px; color:var(--g700); margin-top:8px; line-height:1.5;}
  .grp-title{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--orange); margin:22px 0 12px; padding-top:16px; border-top:1px solid #2a2621;}
  [data-only]{display:none;}
  /* ----- Zone d'aperçu ----- */
  .stageWrap{display:flex; align-items:center; justify-content:center; padding:30px; overflow:auto; height:100vh;}
  .stageScale{transform-origin:center center;}
  body.shot{grid-template-columns:1fr;}
  body.shot .panel{display:none;}
  body.shot .stageWrap{padding:0; height:auto; display:block; overflow:visible;}
  /* ----- Le POST (dimensions réelles, mises à l'échelle pour l'aperçu) ----- */
  .stage{position:relative; overflow:hidden; background:var(--charbon); font-family:'Sora',sans-serif; --g2:#3DDC84;}
  .stage .bg{position:absolute; inset:0; background-size:cover; background-position:center;}
  .stage .grad{position:absolute; inset:0;}
  .stage .wrap{position:absolute; inset:0; display:flex; flex-direction:column;}
  .stage .kicker{font-family:'Space Mono',monospace; font-weight:700; letter-spacing:.22em;
    text-transform:uppercase; color:var(--orange); display:flex; align-items:center; gap:14px;}
  .stage .kicker::before{content:""; height:2px; background:var(--g2); display:inline-block;}
  .stage .grpmain{margin-top:auto;}
  .stage .title{font-weight:800; line-height:1.02; letter-spacing:-.02em; color:var(--sable);}
  .stage .title .acc{color:var(--orange);}
  .stage .rule{background:linear-gradient(90deg, var(--orange) 0 58%, transparent 58% 64%, var(--g2) 64% 100%); border-radius:2px;}
  .stage .sub{font-family:'Space Mono',monospace; font-weight:400; color:var(--g200);}
  .stage .price{font-weight:900; color:var(--sable); line-height:1; letter-spacing:-.02em;}
  .stage .price .cur{color:var(--orange);}
  .stage .feats{list-style:none; margin-top:6px;}
  .stage .feats li{font-family:'Space Mono',monospace; color:var(--g200); display:flex; gap:12px; align-items:flex-start;}
  .stage .feats li::before{content:""; background:var(--g2); border-radius:50%; flex-shrink:0;}
  .stage .cta{display:inline-block; background:var(--orange); color:#fff; font-weight:800;
    font-family:'Sora',sans-serif; border-radius:999px;}
  .stage .quote{font-weight:700; line-height:1.12; letter-spacing:-.01em; color:var(--sable);}
  .stage .quote .qmark{color:var(--orange);}
  .stage .author{font-family:'Space Mono',monospace; color:var(--g200); text-transform:uppercase; letter-spacing:.08em;}
  .stage .footer{display:flex; align-items:center; gap:14px; font-family:'Space Mono',monospace;
    font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--sable);}
  .stage .footer .dot{border-radius:50%; background:var(--g2); box-shadow:0 0 12px rgba(61,220,132,.6);}
  .stage .footer .sep{color:var(--g400); font-weight:400;}
  .stage .footer .site{color:var(--g400); letter-spacing:.1em;}
  /* Modèle téléphone */
  .stage .ptext{flex:1; min-width:0;}
  .stage .ppane{flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .stage .phone{position:relative; background:#0c0b0a; border:3px solid #34302b;
    box-shadow:0 40px 90px rgba(0,0,0,.55); overflow:hidden;}
  .stage .pscreen{position:absolute; inset:10px; border-radius:34px; background-size:cover;
    background-position:top center; background-color:#141210;}
  .stage .pnotch{position:absolute; top:16px; left:50%; transform:translateX(-50%);
    width:30%; height:16px; background:#0c0b0a; border-radius:0 0 14px 14px; z-index:3;}
  /* Thème clair */
  .stage.clair{background:var(--sable); --g2:#1E5631;}
  .stage.clair .title, .stage.clair .price, .stage.clair .quote{color:var(--charbon);}
  .stage.clair .sub, .stage.clair .feats li, .stage.clair .author{color:var(--g700);}
  .stage.clair .footer{color:var(--charbon);}
  .stage.clair .footer .sep, .stage.clair .footer .site{color:var(--g400);}
</style>
</head>
<body>
  <div class="panel">
    <h1>Générateur de posts <span>·</span> Mr Attractor</h1>
    <div class="lead">Charte du site · FB + IG</div>

    <div class="fld"><label>Format</label>
      <div class="seg" id="seg-format">
        <button data-v="feed" class="on">Feed 4:5</button>
        <button data-v="carre">Carré 1:1</button>
        <button data-v="story">Story 9:16</button>
        <button data-v="banner">Bannière</button>
      </div>
    </div>
    <div class="fld"><label>Thème</label>
      <div class="seg" id="seg-theme">
        <button data-v="sombre" class="on">Sombre</button>
        <button data-v="clair">Clair</button>
      </div>
    </div>
    <div class="fld"><label>Modèle</label>
      <div class="seg" id="seg-model">
        <button data-v="accroche" class="on">Accroche</button>
        <button data-v="offre">Offre</button>
        <button data-v="preuve">Preuve</button>
        <button data-v="telephone">Téléphone</button>
      </div>
    </div>

    <div class="grp-title">Contenu</div>
    <div class="fld"><label>Kicker (petit label du haut)</label><input type="text" id="f-kicker" value="Méthode Attractor"></div>

    <div data-only="accroche offre telephone">
      <div class="fld"><label id="lab-title">Titre / accroche</label><textarea id="f-title">Trouvez votre couloir. Devenez numéro 1.</textarea></div>
      <div class="fld"><label>Mot(s) en orange (dans le titre)</label><input type="text" id="f-acc" value="numéro 1"></div>
    </div>
    <div class="fld" data-only="accroche telephone"><label>Sous-titre</label><textarea id="f-sub">Business et développement humain pour les entrepreneurs de Côte d'Ivoire et de la diaspora.</textarea></div>

    <div data-only="offre">
      <div class="fld"><label>Prix</label><input type="text" id="f-price" value="250 000 F"></div>
      <div class="fld"><label>Points inclus (une ligne = un point)</label><textarea id="f-feats">Vitrine de commande + admin autonome
Conseiller IA sur votre catalogue
Hébergement 1 an offert</textarea></div>
      <div class="fld"><label>Bouton (CTA)</label><input type="text" id="f-cta" value="Je réserve ma place"></div>
    </div>

    <div data-only="preuve">
      <div class="fld"><label>Citation / résultat</label><textarea id="f-quote">Depuis mon app, je ne perds plus une seule commande sur WhatsApp.</textarea></div>
      <div class="fld"><label>Auteur (nom · activité)</label><input type="text" id="f-author" value="Kezey · C'Real, farines infantiles"></div>
    </div>

    <div class="grp-title" id="grp-img">Image de fond</div>
    <div class="fld"><label id="lab-img">Ton illustration / photo</label><input type="file" id="f-img" accept="image/*"></div>
    <div class="hint" id="hint-img">Astuce : mets un sujet à droite et laisse l'espace à gauche pour le texte. Sans image, un dégradé de marque est utilisé.</div>

    <div class="grp-title">Signature</div>
    <div class="fld"><label>Marque</label><input type="text" id="f-brand" value="Mr Attractor"></div>
    <div class="fld"><label>Site</label><input type="text" id="f-site" value="agenceattractor.com"></div>

    <button class="btn-dl" id="btn-dl">Télécharger le PNG</button>
    <div class="hint">Le PNG se télécharge en pleine résolution. Ensuite : Meta Business Suite → Planifier.</div>
  </div>

  <div class="stageWrap">
    <div class="stageScale" id="scale">
      <div class="stage" id="stage"></div>
    </div>
  </div>

<script>
const FORMATS = { feed:[1080,1350], carre:[1080,1080], story:[1080,1920], banner:[1640,624] };
const state = { format:'feed', theme:'sombre', model:'accroche', imgUrl:'' };

function seg(id, key){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    b.onclick=()=>{ document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); state[key]=b.dataset.v; syncFields(); render(); };
  });
}
seg('seg-format','format'); seg('seg-theme','theme'); seg('seg-model','model');

function syncFields(){
  document.querySelectorAll('[data-only]').forEach(el=>{
    el.style.display = el.dataset.only.split(' ').includes(state.model) ? 'block' : 'none';
  });
  document.getElementById('lab-title').textContent =
    state.model==='offre' ? 'Titre (service)' : (state.model==='telephone' ? 'Accroche' : 'Titre / accroche');
  const phone = state.model==='telephone';
  document.getElementById('grp-img').textContent = phone ? 'Écran du téléphone' : 'Image de fond';
  document.getElementById('lab-img').textContent = phone ? 'Capture du site client' : 'Ton illustration / photo';
  document.getElementById('hint-img').textContent = phone
    ? "Mets une capture verticale du site d'un client : elle s'affiche dans le téléphone."
    : "Astuce : sujet à droite, espace à gauche pour le texte. Sans image, un dégradé de marque est utilisé.";
}
['f-kicker','f-title','f-acc','f-sub','f-price','f-feats','f-cta','f-quote','f-author','f-brand','f-site']
  .forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', render); });

document.getElementById('f-img').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  if(state.imgUrl) URL.revokeObjectURL(state.imgUrl);
  state.imgUrl=URL.createObjectURL(file); render();
});

const val = id => (document.getElementById(id)?.value || '');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function accentize(title, acc){
  title = esc(title); acc = (acc||'').trim();
  if(acc){ const e=esc(acc); title = title.split(e).join('<span class="acc">'+e+'</span>'); }
  return title.replace(/\n/g,'<br>');
}

const CFG = {
  feed:  {pad:88,  padT:96,  title:84, offT:64, price:80, quote:58, sub:22, kick:22, foot:18, maxT:640, maxS:540, mode:'bottom', ph:0.60},
  carre: {pad:80,  padT:80,  title:68, offT:56, price:74, quote:50, sub:21, kick:21, foot:18, maxT:620, maxS:520, mode:'bottom', ph:0.58},
  story: {pad:110, padT:120, title:96, offT:76, price:92, quote:70, sub:26, kick:26, foot:20, maxT:900, maxS:720, mode:'bottom', ph:0.55},
  banner:{pad:76,  padT:60,  title:56, offT:46, price:60, quote:40, sub:20, kick:19, foot:16, maxT:760, maxS:620, mode:'center', ph:0.90},
};
const GRAD_DARK = 'linear-gradient(90deg, rgba(10,10,10,.94) 0%, rgba(10,10,10,.72) 38%, rgba(10,10,10,.12) 66%, rgba(10,10,10,0) 82%), linear-gradient(0deg, rgba(10,10,10,.9) 0%, rgba(10,10,10,.25) 34%, rgba(10,10,10,0) 58%)';
const GRAD_LIGHT = 'linear-gradient(90deg, rgba(250,246,240,.96) 0%, rgba(250,246,240,.78) 40%, rgba(250,246,240,.15) 68%, rgba(250,246,240,0) 84%), linear-gradient(0deg, rgba(250,246,240,.92) 0%, rgba(250,246,240,.2) 34%, rgba(250,246,240,0) 58%)';
const brandBg = th => '<div class="bg" style="background:radial-gradient(120% 90% at 82% 18%, rgba(242,92,5,.30), transparent 55%),'+(th==='clair'?'#efe7db':'#141210')+'"></div>';
const footerHtml = (c,mt) => `<div class="footer" style="font-size:${c.foot}px;margin-top:${mt}px"><span class="dot" style="width:11px;height:11px"></span> ${esc(val('f-brand'))} <span class="sep">/</span> <span class="site">${esc(val('f-site'))}</span></div>`;

function render(){
  const [W,H] = FORMATS[state.format];
  const c = CFG[state.format];
  const stage = document.getElementById('stage');
  stage.style.width=W+'px'; stage.style.height=H+'px';
  stage.className = 'stage'+(state.theme==='clair'?' clair':'');
  const grad = '<div class="grad" style="background:'+(state.theme==='clair'?GRAD_LIGHT:GRAD_DARK)+'"></div>';

  // ----- Modèle téléphone (image = écran du site client) -----
  if(state.model==='telephone'){
    const col = state.format==='story';
    const phoneH = col ? Math.round(W*0.70) : Math.round(H*c.ph);
    const phoneW = Math.round(phoneH/2.04);
    const rad = Math.round(phoneW*0.12);
    const screen = state.imgUrl ? 'background-image:url('+state.imgUrl+')' : '';
    const tSize = state.format==='banner'?46 : (col?84:62);
    const phone = `<div class="ppane"><div class="phone" style="width:${phoneW}px;height:${phoneH}px;border-radius:${rad}px"><div class="pnotch"></div><div class="pscreen" style="${screen}"></div></div></div>`;
    const text = `<div class="ptext" style="${col?'width:100%;':''}">
        <div class="kicker" style="font-size:${c.kick}px">${esc(val('f-kicker'))}</div>
        <div class="title" style="font-size:${tSize}px;margin-top:${col?26:18}px;max-width:${col?900:'none'}">${accentize(val('f-title'), val('f-acc'))}</div>
        <div class="rule" style="width:60px;height:4px;margin:26px 0 22px"></div>
        <div class="sub" style="font-size:${c.sub}px;line-height:1.55;max-width:${col?720:480}px">${esc(val('f-sub')).replace(/\n/g,'<br>')}</div>
        ${footerHtml(c,40)}
      </div>`;
    stage.innerHTML = brandBg(state.theme) + grad + `
      <div class="wrap" style="padding:${c.pad}px; flex-direction:${col?'column':'row'}; align-items:center; justify-content:center; gap:${state.format==='banner'?54:64}px">
        ${text}${phone}
      </div>`;
    fitScale(W,H); return;
  }

  // ----- Modèles texte (image = fond plein cadre) -----
  const bg = state.imgUrl
    ? '<div class="bg" style="background-image:url('+state.imgUrl+')"></div>'
    : brandBg(state.theme);

  let main='';
  if(state.model==='accroche'){
    main = `
      <div class="title" style="font-size:${c.title}px;max-width:${c.maxT}px">${accentize(val('f-title'), val('f-acc'))}</div>
      <div class="rule" style="width:66px;height:4px;margin:34px 0 30px"></div>
      <div class="sub" style="font-size:${c.sub}px;line-height:1.55;max-width:${c.maxS}px">${esc(val('f-sub')).replace(/\n/g,'<br>')}</div>`;
  } else if(state.model==='offre'){
    const feats = val('f-feats').split('\n').filter(x=>x.trim()).map(f=>
      `<li style="font-size:${Math.round(c.sub*.9)}px;margin-bottom:11px;line-height:1.4"><span style="width:12px;height:12px;margin-top:9px"></span>${esc(f)}</li>`).join('');
    main = `
      <div class="title" style="font-size:${c.offT}px;max-width:${c.maxT}px">${accentize(val('f-title'), val('f-acc'))}</div>
      <div class="price" style="font-size:${c.price}px;margin:22px 0 18px">${esc(val('f-price'))}</div>
      <ul class="feats">${feats}</ul>
      <div class="cta" style="font-size:${Math.round(c.sub*.95)}px;padding:15px 32px;margin-top:28px">${esc(val('f-cta'))}</div>`;
  } else {
    main = `
      <div class="quote" style="font-size:${c.quote}px;max-width:${c.maxT+40}px"><span class="qmark">«</span> ${accentize(val('f-quote'), val('f-acc'))} <span class="qmark">»</span></div>
      <div class="rule" style="width:66px;height:4px;margin:34px 0 22px"></div>
      <div class="author" style="font-size:${Math.round(c.sub*.9)}px">${esc(val('f-author'))}</div>`;
  }

  const grpStyle = c.mode==='center' ? 'margin:auto 0' : 'margin-top:auto';
  stage.innerHTML = bg + grad + `
    <div class="wrap" style="padding:${c.padT}px ${c.pad}px ${Math.round(c.pad*.9)}px">
      <div class="kicker" style="font-size:${c.kick}px">${esc(val('f-kicker'))}</div>
      <div class="grpmain" style="${grpStyle}">
        ${main}
        ${footerHtml(c, c.mode==='center'?40:56)}
      </div>
    </div>`;
  fitScale(W,H);
}
// le trait avant le kicker
const styleKicker = document.createElement('style');
styleKicker.textContent = '.stage .kicker::before{width:38px}';
document.head.appendChild(styleKicker);

function fitScale(W,H){
  if(document.body.classList.contains('shot')){
    const sc=document.getElementById('scale');
    sc.style.transform='scale(1)'; sc.style.width=W+'px'; sc.style.height=H+'px'; return;
  }
  const wrap=document.querySelector('.stageWrap');
  const availW=wrap.clientWidth-60, availH=wrap.clientHeight-60;
  const s=Math.min(availW/W, availH/H, 1);
  document.getElementById('scale').style.transform='scale('+s+')';
  document.getElementById('scale').style.width=W+'px';
  document.getElementById('scale').style.height=H+'px';
}
window.addEventListener('resize', ()=>{ const [W,H]=FORMATS[state.format]; fitScale(W,H); });

async function captureCanvas(){
  await document.fonts.ready;
  const [W,H]=FORMATS[state.format];
  const scaleEl=document.getElementById('scale');
  const prevT=scaleEl.style.transform, prevW=scaleEl.style.width, prevH=scaleEl.style.height;
  // capture à taille réelle : on retire l'échelle d'aperçu
  scaleEl.style.transform='none'; scaleEl.style.width=W+'px'; scaleEl.style.height=H+'px';
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  let canvas;
  try{
    canvas=await html2canvas(document.getElementById('stage'),{
      width:W, height:H, windowWidth:W, windowHeight:H, scale:1,
      backgroundColor:null, useCORS:true, scrollX:0, scrollY:0, logging:false });
  } finally {
    scaleEl.style.transform=prevT; scaleEl.style.width=prevW; scaleEl.style.height=prevH;
  }
  return canvas;
}

document.getElementById('btn-dl').addEventListener('click', async ()=>{
  const btn=document.getElementById('btn-dl'); const old=btn.textContent;
  btn.textContent='Génération…'; btn.disabled=true;
  try{
    const canvas=await captureCanvas();
    const a=document.createElement('a');
    a.download='post-attractor-'+state.model+'-'+state.format+'.png';
    a.href=canvas.toDataURL('image/png'); a.click();
  }catch(e){ alert('Erreur de génération : '+e.message); }
  btn.textContent=old; btn.disabled=false;
});

// presets par URL : ?format=story&theme=clair&model=offre
(function(){
  const p=new URLSearchParams(location.search);
  [['format','seg-format'],['theme','seg-theme'],['model','seg-model']].forEach(([k,id])=>{
    const v=p.get(k); if(!v) return;
    const b=document.querySelector('#'+id+' button[data-v="'+v+'"]');
    if(b){ document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); state[k]=v; }
  });
  const img=p.get('img'); if(img) state.imgUrl=decodeURIComponent(img);
  if(p.get('shot')) document.body.classList.add('shot');
})();

syncFields(); render();

// sonde de vérification : ?probe=1 affiche le PNG réellement produit par html2canvas
if(new URLSearchParams(location.search).get('probe')){
  setTimeout(async ()=>{
    try{
      const canvas=await captureCanvas();
      const [W,H]=FORMATS[state.format];
      document.body.style.cssText='margin:0;background:#000;display:block';
      document.body.innerHTML='<img src="'+canvas.toDataURL('image/png')+'" style="display:block;width:'+W+'px;height:'+H+'px">';
    }catch(e){ document.body.innerHTML='<pre style="color:#fff">PROBE ERR: '+e.message+'</pre>'; }
  }, 700);
}
</script>
</body>
</html>
