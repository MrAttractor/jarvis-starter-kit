/* ── UTILS ─────────────────────────────────────────────── */
const TODAY = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmt = (n) => n == null ? '—' : n.toLocaleString('fr-FR') + ' €';

/* ── EDITABLE FIELD (contentEditable, pas de layout shift) */
function EditField({ value, onSave, style }) {
  const ref = useRef();
  useEffect(() => {
    if (ref.current && ref.current !== document.activeElement) {
      ref.current.innerText = value || '';
    }
  }, [value]);

  const save = () => {
    const txt = (ref.current?.innerText || '').trim();
    if (txt && txt !== value) onSave(txt);
    else if (ref.current) ref.current.innerText = value || '';
  };

  return (
    <span
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      data-ph="Cliquer pour modifier…"
      onBlur={save}
      onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); ref.current?.blur(); } if (e.key === 'Escape') { if (ref.current) ref.current.innerText = value || ''; ref.current?.blur(); } }}
      style={{ ...style, cursor:'text', borderBottom:'1px dashed rgba(255,255,255,.15)', paddingBottom:1, display:'block', minWidth:20 }}
    />
  );
}

/* ── CAP CARD ─────────────────────────────────────────── */
function CapCard({ cap, onChange }) {
  if (!cap) return null;
  const pct_conf = Math.min(100, (cap.confirme / cap.objectif) * 100);
  const pct_pipe = Math.min(100 - pct_conf, (cap.pipeline_val / cap.objectif) * 100);
  const moisRestants = Math.ceil((new Date('2026-08-31') - new Date()) / (1000*60*60*24*30));

  const saveConfirme = async (raw) => {
    const n = parseInt((raw||'').replace(/[^\d]/g,''), 10);
    if (isNaN(n)) return;
    onChange({ ...cap, confirme: n });
    await SB.from('pilotage_cap').update({ confirme: n }).eq('id', cap.id);
  };
  const savePipeline = async (raw) => {
    const n = parseInt((raw||'').replace(/[^\d]/g,''), 10);
    if (isNaN(n)) return;
    onChange({ ...cap, pipeline_val: n });
    await SB.from('pilotage_cap').update({ pipeline_val: n }).eq('id', cap.id);
  };

  return (
    <div className="card" style={{ padding:'18px 18px 16px', background:'linear-gradient(135deg,#1A1208 0%,#201508 100%)', borderColor:'rgba(238,124,31,.18)' }}>
      <div className="row between" style={{ marginBottom:14 }}>

            <span className="t-xs mut">/mois · {cap.date_objectif}</span>
          </div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div className="t-xs mut" style={{ marginBottom:2 }}>Dans</div>
          <div className="xb" style={{ fontSize:20, color:'var(--ink)', letterSpacing:'-.5px' }}>{moisRestants}<span className="t-xs mut xb"> mois</span></div>
        </div>
      </div>

      <div style={{ height:8, borderRadius:100, background:'rgba(255,255,255,.07)', overflow:'hidden', marginBottom:12 }}>
        <div style={{ height:'100%', display:'flex', borderRadius:100, overflow:'hidden' }}>
          {pct_conf > 0 && <div style={{ width:pct_conf+'%', background:'var(--grn)', transition:'.6s' }} />}
          <div style={{ width:pct_pipe+'%', background:'var(--acc)', opacity:.85, transition:'.6s' }} />
        </div>
      </div>

      <div className="row g12">
        <div className="col g4 grow">
          <div className="row g5" style={{ alignItems:'center' }}>
            <span style={{ width:7,height:7,borderRadius:2,background:'var(--grn)',flexShrink:0 }} />
            <span className="t-xs mut">Confirmé</span>
          </div>
          <EditField
            value={cap.confirme > 0 ? String(cap.confirme) : '0'}
            onSave={saveConfirme}
            style={{ fontSize:14, fontWeight:700, color: cap.confirme > 0 ? 'var(--grn)' : 'var(--faint)' }}
          />
        </div>
        <div style={{ width:1, background:'var(--bdr)' }} />
        <div className="col g4 grow">
          <div className="row g5" style={{ alignItems:'center' }}>
            <span style={{ width:7,height:7,borderRadius:2,background:'var(--acc)',flexShrink:0 }} />
            <span className="t-xs mut">Pipeline qualifié</span>
          </div>
          <EditField
            value={String(cap.pipeline_val)}
            onSave={savePipeline}
            style={{ fontSize:14, fontWeight:700, color:'var(--acc)' }}
          />
        </div>
        <div style={{ width:1, background:'var(--bdr)' }} />
        <div className="col g4 grow">
          <div className="row g5" style={{ alignItems:'center' }}>
            <span style={{ width:7,height:7,borderRadius:2,background:'var(--faint)',flexShrink:0 }} />
            <span className="t-xs mut">Reste à trouver</span>
          </div>
          <span className="b num" style={{ fontSize:14, color:'var(--mut)' }}>{fmt(cap.objectif - cap.confirme - cap.pipeline_val)}</span>
        </div>
      </div>

      {cap.note && (
        <div style={{ marginTop:12, padding:'8px 11px', borderRadius:8, background:'rgba(238,124,31,.08)', borderLeft:'2.5px solid var(--acc)' }}>
          <span className="t-xs" style={{ color:'rgba(240,237,232,.65)' }}>{cap.note}</span>
        </div>
      )}
    </div>
  );
}

/* ── FOCUS ITEM ───────────────────────────────────────── */
function FocusItem({ item, i, onToggle, onEdit }) {
  const tagColor = item.tag === 'Pipeline' ? 'var(--acc)' : 'var(--blu)';
  return (
    <div className="anim row g12" style={{ padding:'13px 0', borderBottom:'1px solid var(--bdr)', animationDelay:(i*60)+'ms', alignItems:'flex-start', opacity: item.done ? .45 : 1 }}>
      <div
        onClick={() => onToggle(item)}
        style={{ width:22, height:22, borderRadius:8, flexShrink:0, marginTop:2, cursor:'pointer',
          background: item.done ? 'var(--grn-s)' : item.urgent ? 'var(--red-s)' : 'rgba(255,255,255,.06)',
          display:'flex', alignItems:'center', justifyContent:'center' }}>
        {item.done
          ? <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="var(--grn)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          : <span style={{ width:6,height:6,borderRadius:50,background: item.urgent ? 'var(--red)' : 'var(--faint)' }} />
        }
      </div>
      <div className="col grow g4" style={{ minWidth:0 }}>
        <EditField
          value={item.description}
          onSave={v => onEdit(item, v)}
          style={{ fontSize:13, fontWeight:600, lineHeight:1.4, textDecoration: item.done ? 'line-through' : 'none', wordBreak:'break-word' }}
        />
        <span style={{ fontSize:10.5, fontWeight:700, color:tagColor }}>{item.tag}{item.urgent ? ' · URGENT' : ''}</span>
      </div>
    </div>
  );
}

            <span className="b" style={{ fontSize:13, color: d.urgent ? 'var(--red)' : 'var(--acc)' }}>{d.date_action}</span>

        <div style={{ padding:'10px 12px', borderRadius:10, background:'rgba(255,255,255,.04)', borderLeft:'2px solid rgba(255,255,255,.1)' }}>
          <div className="t-xs mut b" style={{ marginBottom:4 }}>→ PROCHAINE ACTION</div>

        <span className="t-xs mut">Contact · </span><span className="t-xs sb">{d.contact}</span>
      </div>
    </div>
  );
}

function TabPipeline({ pipeline, onEditProchaine }) {
  const totalSetup = pipeline.reduce((s,d) => s + (d.setup||0), 0);

              <span className="b num" style={{ fontSize:15 }}>{fmt(totalSetup)} setup</span>

          </div>
          <span className="badge org">{pipeline.filter(d=>d.urgent).length} urgent{pipeline.filter(d=>d.urgent).length>1?'s':''}</span>

/* ── PROJETS ──────────────────────────────────────────── */
function ProjetCard({ p, i, onEditProchaine }) {
  const avcColor = p.avancement >= 60 ? 'var(--grn)' : p.avancement >= 30 ? 'var(--acc)' : 'var(--mut)';
  return (

      <div style={{ padding:'14px 16px 13px' }}>
        <div className="row between" style={{ marginBottom:8 }}>
          <div className="col g4">
            <span style={{ fontSize:10.5, fontWeight:700, color:'var(--blu)' }}>{p.tag}</span>
            <span className="b" style={{ fontSize:15 }}>{p.nom}</span>
          </div>
          <span className={'badge '+(p.avancement>=60?'grn':p.avancement>=30?'org':'neu')}>{p.statut}</span>
        </div>

        <div style={{ marginBottom:12 }}>
          <div className="row between" style={{ marginBottom:6 }}>
            <span className="t-xs mut">Avancement</span>
            <span className="t-xs b num" style={{ color:avcColor }}>{p.avancement}%</span>
          </div>
          <div style={{ height:5, borderRadius:100, background:'rgba(255,255,255,.07)', overflow:'hidden' }}>
            <div style={{ height:'100%', width:p.avancement+'%', background:avcColor, borderRadius:100, transition:'.5s' }} />

        <div style={{ padding:'9px 12px', borderRadius:10, background:'rgba(255,255,255,.04)', borderLeft:'2px solid rgba(255,255,255,.1)', marginBottom: p.etapes ? 10 : 0 }}>
          <div className="t-xs mut" style={{ marginBottom:3, fontWeight:700 }}>PROCHAINE ÉTAPE</div>
          <EditField
            value={p.prochaine_action}
            onSave={v => onEditProchaine(p, v)}
            style={{ fontSize:11.5, fontWeight:600, color:'var(--ink)', lineHeight:1.5 }}
            multiline
          />
        </div>

        {p.etapes && (
          <div className="row" style={{ flexWrap:'wrap', gap:6, marginTop:10 }}>
            {p.etapes.map((e,j) => (
              <span key={j} style={{ fontSize:10.5, fontWeight:600, padding:'3px 9px', borderRadius:7,
                background:'rgba(255,255,255,.05)', color:'var(--ink2)', border:'1px solid var(--bdr)' }}>{e}</span>
            ))}
          </div>
        )}
      </div>

      {p.blocage && (
        <div style={{ padding:'9px 16px', borderTop:'1px solid var(--bdr)', background:'var(--red-s)' }}>
          <span className="t-xs" style={{ color:'var(--red)', fontWeight:700 }}>BLOCAGE · </span>
          <span className="t-xs" style={{ color:'var(--red)' }}>{p.blocage}</span>
        </div>
      )}
    </div>
  );
}

function TabProjets({ projets, onEditProchaine }) {
  return (
    <Fragment>
      <div className="card" style={{ padding:'14px 16px' }}>
        <div className="row between center">

/* ── DEMOS ────────────────────────────────────────────── */

    <Fragment>
      <div className="card" style={{ padding:'14px 16px' }}>

            <span className="b" style={{ fontSize:14 }}>
              <span style={{ color:'var(--blu)' }}>{envoyees} envoyées</span>
              {' · '}{DEMOS.length - envoyees} en vitrine
            </span>
          </div>
          <span className="badge neu">demo.agenceattractor.com</span>
        </div>
      </div>
      <div className="demos-grid">
        {DEMOS.map((d,i) => (
          <a key={d.id} href={'https://demo.agenceattractor.com'+d.url} target="_blank" rel="noreferrer"
            className="card anim col" style={{ padding:'13px 13px 11px', textDecoration:'none', cursor:'pointer', animationDelay:(i*50)+'ms' }}>
            <div style={{ marginBottom:7 }}>
              <span className={'badge '+d.sc} style={{ fontSize:10, padding:'2px 7px' }}><span className="dot" />{d.statut}</span>
            </div>
            <span className="b" style={{ fontSize:13, color:'var(--ink)', lineHeight:1.3, marginBottom:4 }}>{d.nom}</span>
            <span className="t-xs mut">{d.type}</span>
            <div style={{ marginTop:10, fontSize:10, color:'var(--acc)', fontWeight:700, letterSpacing:.3 }}>Ouvrir →</div>
          </a>
        ))}
      </div>
    </Fragment>
  );
}

/* ── APP ──────────────────────────────────────────────── */
const TABS = [
  { id:'today',    label:"Aujourd'hui" },
  { id:'pipeline', label:'Pipeline' },
  { id:'projets',  label:'Projets' },
  { id:'demos',    label:'Démos' },
];

function App() {
  const [tab, setTab]         = useState('today');
  const [cap, setCap]         = useState(null);
  const [focus, setFocus]     = useState([]);
  const [pipeline, setPipeline] = useState([]);
  const [projets, setProjets] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    Promise.all([
      SB.from('pilotage_cap').select('*').single(),
      SB.from('pilotage_focus').select('*').order('ordre'),
      SB.from('pilotage_pipeline').select('*').order('priorite'),
      SB.from('pilotage_projets').select('*').order('priorite'),
    ]).then(([capR, focusR, pipeR, projR]) => {
      if (capR.data)   setCap(capR.data);
      if (focusR.data) setFocus(focusR.data);
      if (pipeR.data)  setPipeline(pipeR.data);
      if (projR.data)  setProjets(projR.data);
      setLoading(false);
      document.getElementById('boot')?.remove();
    });
  }, []);

  /* Focus handlers */
  const handleFocusToggle = async (item) => {
    const updated = !item.done;
    setFocus(prev => prev.map(f => f.id === item.id ? { ...f, done: updated } : f));
    await SB.from('pilotage_focus').update({ done: updated }).eq('id', item.id);
  };
  const handleFocusEdit = async (item, val) => {
    setFocus(prev => prev.map(f => f.id === item.id ? { ...f, description: val } : f));
    await SB.from('pilotage_focus').update({ description: val }).eq('id', item.id);
  };

  /* Pipeline handlers */
  const handlePipeProchaine = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, prochaine: val } : p));
    await SB.from('pilotage_pipeline').update({ prochaine: val }).eq('id', d.id);
  };

  /* Projets handlers */
  const handleProjetProchaine = async (p, val) => {
    setProjets(prev => prev.map(pr => pr.id === p.id ? { ...pr, prochaine_action: val } : pr));
    await SB.from('pilotage_projets').update({ prochaine_action: val }).eq('id', p.id);
  };

  const heure = new Date().getHours();
  const salut = heure < 12 ? 'Bonjour' : heure < 18 ? 'Bon après-midi' : 'Bonsoir';

  if (loading) return null;

  return (
    <div className="app">
      <div className="hdr">
        <div className="hdr-left">
          <div className="label">Mr Attractor · Pilotage</div>
          <div className="title">{salut}, Mac Arthur</div>
        </div>
        <div className="hdr-right">{TODAY}</div>
      </div>

      <div className="tabs">
        {TABS.map(t => (
          <button key={t.id} className={'tab'+(tab===t.id?' on':'')} onClick={() => setTab(t.id)}>{t.label}</button>
        ))}
      </div>

      <div className="content">
        {tab === 'today'    && <TabAujourdHui cap={cap} focus={focus} onCapChange={setCap} onFocusToggle={handleFocusToggle} onFocusEdit={handleFocusEdit} />}
        {tab === 'pipeline' && <TabPipeline pipeline={pipeline} onEditProchaine={handlePipeProchaine} />}
        {tab === 'projets'  && <TabProjets projets={projets} onEditProchaine={handleProjetProchaine} />}
        {tab === 'demos'    && <TabDemos />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
