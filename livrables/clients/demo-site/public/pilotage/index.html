/* ── EDITABLE FIELD (contentEditable, pas de layout shift) */
function EditField({ value, onSave, style }) {
  const ref = useRef();
  useEffect(() => {
    if (ref.current && ref.current !== document.activeElement) {
      ref.current.innerText = value || '';
    }
  }, [value]);

  const save = () => {
    const txt = (ref.current?.innerText || '').trim();
    if (txt && txt !== value) onSave(txt);
    else if (ref.current) ref.current.innerText = value || '';
  };

  return (
    <span
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      data-ph="Cliquer pour modifier…"
      onBlur={save}
      onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); ref.current?.blur(); } if (e.key === 'Escape') { if (ref.current) ref.current.innerText = value || ''; ref.current?.blur(); } }}
      style={{ ...style, cursor:'text', borderBottom:'1px dashed rgba(0,0,0,.15)', paddingBottom:1, display:'block', width:'100%', maxWidth:'100%', minWidth:0, overflowWrap:'break-word', wordBreak:'break-word' }}
    />
  );
}

function StatutBadge({ statut, statut_color, onEdit }) {
  const [open, setOpen] = useState(false);

    if (!open) return;

    setOpen(false);
    const rules = SOP_VALIDATION[opt.label];
    if (!rules) { onEdit(opt.label, opt.color); return; }
    setValidating({ label: opt.label, color: opt.color, titre: rules.titre, checks: rules.checks, done: [] });

    ...v, done: v.done.includes(i) ? v.done.filter(x=>x!==i) : [...v.done, i]
  }));

  const confirm = () => { if (validating) { onEdit(validating.label, validating.color); setValidating(null); } };

  const allDone = validating && validating.done.length === validating.checks.length;

  return (
    <div ref={ref} style={{ position:'relative', flexShrink:0 }}>
      <span className={'badge '+(statut_color||'neu')} style={{ cursor:'pointer', userSelect:'none' }} onClick={() => setOpen(o => !o)}>

              onClick={() => handleSelect(opt)}
              style={{ padding:'7px 10px', borderRadius:8, cursor:'pointer', display:'flex', alignItems:'center', gap:8, fontSize:12, fontWeight:600, color: statut === opt.label ? 'var(--ink)' : 'var(--ink2)', background: statut === opt.label ? 'rgba(0,0,0,.05)' : 'transparent' }}>
              <span className={'badge '+opt.color} style={{ padding:'2px 6px', fontSize:10, pointerEvents:'none' }}><span className="dot" /></span>
              {opt.label}
              {SOP_VALIDATION[opt.label] && <span style={{ marginLeft:'auto', fontSize:9, color:'var(--acc)', fontWeight:800, opacity:.7 }}>SOP</span>}
            </div>
          ))}
        </div>
      )}

      {validating && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.82)', zIndex:300, display:'flex', alignItems:'flex-end', justifyContent:'center' }}
          onClick={e => { if (e.target === e.currentTarget) setValidating(null); }}>
          <div style={{ width:'100%', maxWidth:520, background:'var(--card)', borderRadius:'18px 18px 0 0', padding:'24px 20px 44px' }}>
            <div style={{ width:36, height:4, borderRadius:2, background:'var(--bdr)', margin:'0 auto 22px' }} />
            <div style={{ fontSize:10, fontWeight:800, color:'var(--acc)', letterSpacing:'1.2px', textTransform:'uppercase', marginBottom:5 }}>Validation SOP requise</div>
            <div style={{ fontSize:17, fontWeight:800, color:'var(--ink)', marginBottom:4 }}>{validating.titre}</div>
            <div style={{ fontSize:12, color:'var(--mut)', marginBottom:20 }}>Coche chaque point pour débloquer la confirmation</div>

              <div key={i} onClick={() => toggle(i)}

/* ── CAP CARD ─────────────────────────────────────────── */
function CapCard({ cap, onChange }) {
  if (!cap) return null;
  const pct_conf = Math.min(100, (cap.confirme / cap.objectif) * 100);
  const pct_pipe = Math.min(100 - pct_conf, (cap.pipeline_val / cap.objectif) * 100);
  const moisRestants = Math.ceil((new Date('2026-08-31') - new Date()) / (1000*60*60*24*30));

  const saveConfirme = async (raw) => {
    const n = parseInt((raw||'').replace(/[^\d]/g,''), 10);
    if (isNaN(n)) return;
    onChange({ ...cap, confirme: n });
    await SB.from('pilotage_cap').update({ confirme: n }).eq('id', cap.id);
  };
  const savePipeline = async (raw) => {
    const n = parseInt((raw||'').replace(/[^\d]/g,''), 10);
    if (isNaN(n)) return;
    onChange({ ...cap, pipeline_val: n });
    await SB.from('pilotage_cap').update({ pipeline_val: n }).eq('id', cap.id);
  };

  return (
    <div className="card" style={{ padding:'18px 18px 16px', background:'linear-gradient(135deg,#FFF8F2 0%,#FFF0E0 100%)', borderColor:'rgba(238,124,31,.25)' }}>
      <div className="row between" style={{ marginBottom:14 }}>
        <div>
          <div className="t-xs mut sb" style={{ marginBottom:3 }}>CAP MENSUEL</div>
          <div className="row g8" style={{ alignItems:'baseline' }}>
            <span className="xb num t-xl" style={{ color:'var(--acc)' }}>{fmt(cap.objectif)}</span>
            <span className="t-xs mut">/mois · {cap.date_objectif}</span>
          </div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div className="t-xs mut" style={{ marginBottom:2 }}>Dans</div>
          <div className="xb" style={{ fontSize:20, color:'var(--ink)', letterSpacing:'-.5px' }}>{moisRestants}<span className="t-xs mut xb"> mois</span></div>
        </div>
      </div>

      <div style={{ height:8, borderRadius:100, background:'rgba(0,0,0,.08)', overflow:'hidden', marginBottom:12 }}>
        <div style={{ height:'100%', display:'flex', borderRadius:100, overflow:'hidden' }}>
          {pct_conf > 0 && <div style={{ width:pct_conf+'%', background:'var(--grn)', transition:'.6s' }} />}
          <div style={{ width:pct_pipe+'%', background:'var(--acc)', opacity:.85, transition:'.6s' }} />
        </div>
      </div>

      <div className="row g12">
        <div className="col g4 grow">
          <div className="row g5" style={{ alignItems:'center' }}>
            <span style={{ width:7,height:7,borderRadius:2,background:'var(--grn)',flexShrink:0 }} />
            <span className="t-xs mut">Confirmé</span>
          </div>
          <EditField
            value={cap.confirme > 0 ? String(cap.confirme) : '0'}
            onSave={saveConfirme}
            style={{ fontSize:14, fontWeight:700, color: cap.confirme > 0 ? 'var(--grn)' : 'var(--faint)' }}
          />
        </div>
        <div style={{ width:1, background:'var(--bdr)' }} />
        <div className="col g4 grow">
          <div className="row g5" style={{ alignItems:'center' }}>
            <span style={{ width:7,height:7,borderRadius:2,background:'var(--acc)',flexShrink:0 }} />
            <span className="t-xs mut">Pipeline qualifié</span>
          </div>
          <EditField
            value={String(cap.pipeline_val)}
            onSave={savePipeline}
            style={{ fontSize:14, fontWeight:700, color:'var(--acc)' }}
          />
        </div>
        <div style={{ width:1, background:'var(--bdr)' }} />
        <div className="col g4 grow">
          <div className="row g5" style={{ alignItems:'center' }}>
            <span style={{ width:7,height:7,borderRadius:2,background:'var(--faint)',flexShrink:0 }} />

      </div>

        style={{ width:22, height:22, borderRadius:8, flexShrink:0, marginTop:2, cursor:'pointer',
          background: item.done ? 'var(--grn-s)' : item.urgent ? 'var(--red-s)' : 'rgba(0,0,0,.06)',

      </div>
      <div className="col grow g4" style={{ minWidth:0 }}>
        <EditField
          value={item.description}

          style={{ fontSize:13, fontWeight:600, lineHeight:1.4, textDecoration: item.done ? 'line-through' : 'none', wordBreak:'break-word' }}

        <span style={{ fontSize:10.5, fontWeight:700, color:tagColor }}>{item.tag}{item.urgent ? ' · URGENT' : ''}</span>
      </div>
    </div>
  );
}

/* ── NOUVEAU PROSPECT MODAL ───────────────────────────── */
function NouveauProspectModal({ onConfirm, onCancel }) {
  const [nom, setNom] = useState('');
  const [wa, setWa] = useState('');
  const [activite, setActivite] = useState('');
  const [famille, setFamille] = useState('');
  const [zone, setZone] = useState('');
  const [saving, setSaving] = useState(false);
  const valid = nom.trim() && famille && zone;

  const handleSave = async () => {
    if (!valid || saving) return;
    setSaving(true);
    const { data, error } = await SB.from('pilotage_pipeline').insert({
      nom: nom.trim(),
      contact: wa.trim() || null,
      activite: activite.trim() || null,
      famille,
      zone,
      type: famille === 'A' ? 'App Métier' : famille === 'B' ? 'Consulting' : 'SaaS / Assists',
      statut: 'En contact',
      statut_color: 'neu',
      prochaine: famille === 'A' ? 'Préparer maquette → caler présentation directe' : 'Brief découverte 30 min',
      date_action: new Date().toLocaleDateString('fr-FR'),
      priorite: 99,
      urgent: false,
    }).select().single();
    setSaving(false);
    if (!error && data) onConfirm(data);
  };

  const famOptions = [['A','App Métier'],['B','Consulting'],['C','SaaS / Assists']];
  const zoneOptions = ['CI', 'France', 'International'];

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.85)', zIndex:300, display:'flex', alignItems:'flex-end', justifyContent:'center' }}
      onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div style={{ width:'100%', maxWidth:520, background:'var(--card)', borderRadius:'18px 18px 0 0', padding:'24px 20px 48px' }}>
        <div style={{ width:36, height:4, borderRadius:2, background:'var(--bdr)', margin:'0 auto 22px' }} />
        <div style={{ fontSize:17, fontWeight:800, color:'var(--ink)', marginBottom:18 }}>Nouveau prospect</div>

        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>Nom / Prénom *</div>
          <input value={nom} onChange={e=>setNom(e.target.value)} placeholder="Ex: Andréa Koné, Club Élévia…" style={iStyle} />
        </div>
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>Activité</div>
          <input value={activite} onChange={e=>setActivite(e.target.value)} placeholder="Ex: livraison express, réseau B2B…" style={iStyle} />
        </div>
        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>WhatsApp</div>
          <input value={wa} onChange={e=>setWa(e.target.value)} placeholder="+33 6… ou +225 07…" style={iStyle} />
        </div>

        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:8 }}>Famille *</div>
          <div style={{ display:'flex', gap:8 }}>
            {famOptions.map(([f, label]) => (
              <div key={f} onClick={() => setFamille(f)}
                style={{ flex:1, padding:'10px 6px', borderRadius:10, textAlign:'center', cursor:'pointer',
                  border:`1.5px solid ${famille===f ? 'var(--acc)' : 'var(--bdr)'}`,
                  background: famille===f ? 'var(--acc-s)' : 'transparent', transition:'.15s' }}>
                <div style={{ fontWeight:800, fontSize:15, color: famille===f ? 'var(--acc)' : 'var(--ink)', marginBottom:2 }}>Fam. {f}</div>
                <div style={{ fontSize:10, color:'var(--mut)', fontWeight:600 }}>{label}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ marginBottom:22 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:8 }}>Zone *</div>
          <div style={{ display:'flex', gap:8 }}>
            {zoneOptions.map(z => (
              <div key={z} onClick={() => setZone(z)}
                style={{ flex:1, padding:'10px 6px', borderRadius:10, textAlign:'center', cursor:'pointer', fontSize:12, fontWeight:700,
                  border:`1.5px solid ${zone===z ? 'var(--acc)' : 'var(--bdr)'}`,
                  background: zone===z ? 'var(--acc-s)' : 'transparent',
                  color: zone===z ? 'var(--acc)' : 'var(--mut)', transition:'.15s' }}>
                {z}
              </div>
            ))}
          </div>
        </div>

        <div style={{ display:'flex', gap:10 }}>
          <button onClick={onCancel}
            style={{ flex:1, minHeight:44, padding:'0 13px', borderRadius:12, border:'1.5px solid var(--bdr)', background:'transparent', color:'var(--mut)', fontWeight:700, fontSize:13, cursor:'pointer', fontFamily:'inherit' }}>
            Annuler
          </button>
          <button onClick={handleSave} disabled={!valid || saving}
            style={{ flex:2, minHeight:44, padding:'0 13px', borderRadius:12, border:'none',
              background: valid ? 'var(--acc)' : 'rgba(0,0,0,.06)',
              color: valid ? '#fff' : 'var(--faint)',
              fontWeight:800, fontSize:13, cursor: valid ? 'pointer' : 'not-allowed', fontFamily:'inherit', transition:'.2s' }}>
            {saving ? 'Création…' : 'Créer le dossier →'}
          </button>
        </div>
      </div>
    </div>
  );
}

function TabPipeline({ pipeline, onEditProchaine, onEditStatut, onEditContact, onAddProspect }) {
  const [showNouveau, setShowNouveau] = useState(false);
  const totalSetup = pipeline.reduce((s,d) => s + (d.setup||0), 0);
  const totalMensuel = pipeline.reduce((s,d) => s + (d.mensuel||0), 0);
  const nbUrgents = pipeline.filter(d=>d.urgent).length;

  return (
    <Fragment>
      <SOPCadre />

      <div className="card" style={{ padding:'14px 16px' }}>
        <div className="row between" style={{ alignItems:'flex-start' }}>
          <div>
            <div className="t-xs mut" style={{ marginBottom:3 }}>{pipeline.length} dossiers actifs</div>
            <div className="row g10">
              <span className="b num" style={{ fontSize:15 }}>{fmt(totalSetup)} setup</span>
              <span className="mut">·</span>
              <span className="b num" style={{ fontSize:15, color:'var(--grn)' }}>{fmt(totalMensuel)}/mois</span>
            </div>
          </div>
          <div className="col g6" style={{ alignItems:'flex-end' }}>
            {nbUrgents > 0 && <span className="badge red" style={{ marginBottom:4 }}>{nbUrgents} urgent{nbUrgents>1?'s':''}</span>}
            <button onClick={() => setShowNouveau(true)}
              style={{ display:'flex', alignItems:'center', gap:6, minHeight:44, padding:'0 14px', borderRadius:10, border:'none',
                background:'var(--acc)', color:'#fff', fontWeight:800, fontSize:12, cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap' }}>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
              Prospect
            </button>
          </div>
        </div>
      </div>

      {pipeline.map((d,i) => <DossierCard key={d.id} d={d} i={i} onEditProchaine={onEditProchaine} onEditStatut={onEditStatut} onEditContact={onEditContact} />)}

      {showNouveau && (
        <NouveauProspectModal
          onConfirm={(newDossier) => { onAddProspect(newDossier); setShowNouveau(false); }}
          onCancel={() => setShowNouveau(false)}
        />
      )}
    </Fragment>
  );
}

      <div className="card" style={{ padding:'16px 18px', background:'linear-gradient(135deg,#FFF8F2,#FFF0E0)', borderColor:'rgba(238,124,31,.25)' }}>
        <div className="t-xs mut sb" style={{ marginBottom:4 }}>OBJECTIF CENTRAL</div>
        <div className="row between" style={{ alignItems:'baseline', marginBottom:8 }}>
          <span className="xb" style={{ fontSize:22, color:'var(--acc)' }}>10 000 €/mois</span>
          <span className="t-xs mut b">août 2026</span>
        </div>
        <div style={{ fontSize:12, color:'var(--ink2)', lineHeight:1.6 }}>
          3 flux complémentaires. Chaque client Apps Métier devient un vecteur d'entrée Freemium.
          C'Real est le DMV qui amorce la machine.
        </div>
      </div>

      <div className="sect-label" style={{ marginTop:4 }}>LES 3 FLUX</div>
      {FLUX.map((f,i) => (
        <div key={f.id} className="card anim" style={{ padding:'14px 16px', animationDelay:(i*70)+'ms' }}>
          <div className="row between" style={{ marginBottom:8, alignItems:'flex-start' }}>
            <div>
              <span className="b" style={{ fontSize:14 }}>{f.label}</span>
              <div className="t-xs mut" style={{ marginTop:2 }}>{f.desc}</div>
            </div>
            <div style={{ textAlign:'right', flexShrink:0, marginLeft:8 }}>
              <div className="t-xs b" style={{ color:f.couleur }}>{f.recurrent}</div>
            </div>
          </div>
          <div style={{ padding:'7px 10px', borderRadius:8, background:f.couleurBg, marginBottom:10 }}>
            <span className="t-xs b" style={{ color:f.couleur }}>{f.cible}</span>
          </div>
          {f.actions.map((a,j) => (
            <div key={j} className="row g8" style={{ alignItems:'flex-start', marginBottom:5 }}>
              <span style={{ width:5, height:5, borderRadius:50, background:f.couleur, flexShrink:0, marginTop:5 }} />
              <span className="t-xs" style={{ color:'var(--ink2)', lineHeight:1.4 }}>{a}</span>
            </div>
          ))}
        </div>
      ))}

      <div className="sect-label" style={{ marginTop:4 }}>ROADMAP</div>
      <div className="card" style={{ padding:'4px 0', overflow:'hidden' }}>
        {ROADMAP.map((r,i) => (
          <div key={i} style={{ padding:'12px 16px', borderBottom:i<ROADMAP.length-1?'1px solid var(--bdr)':'none', display:'flex', gap:12, alignItems:'flex-start' }}>
            <div style={{ minWidth:72 }}>
              <div className="t-xs mut" style={{ marginBottom:2 }}>{r.mois}</div>
              <span className="b num" style={{ fontSize:13, color:'var(--acc)' }}>{r.cap}</span>
            </div>
            <div style={{ flex:1, fontSize:12, color:'var(--ink2)', lineHeight:1.5 }}>{r.focus}</div>
          </div>
        ))}
      </div>
    </Fragment>
  );
}

/* ── APP ──────────────────────────────────────────────── */
const TABS = [
  { id:'today',    label:"Aujourd'hui" },
  { id:'pipeline', label:'Pipeline' },
  { id:'projets',  label:'Projets' },
  { id:'demos',    label:'Démos' },
  { id:'plan',     label:'Plan' },
];

function App() {
  const [tab, setTab]         = useState('today');
  const [cap, setCap]         = useState(null);
  const [focus, setFocus]     = useState([]);
  const [pipeline, setPipeline] = useState([]);
  const [projets, setProjets] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    Promise.all([
      SB.from('pilotage_cap').select('*').single(),
      SB.from('pilotage_focus').select('*').order('ordre'),
      SB.from('pilotage_pipeline').select('*').order('priorite'),
      SB.from('pilotage_projets').select('*').order('priorite'),
    ]).then(([capR, focusR, pipeR, projR]) => {
      if (capR.data)   setCap(capR.data);
      if (focusR.data) setFocus(focusR.data);
      if (pipeR.data)  setPipeline(pipeR.data);
      if (projR.data)  setProjets(projR.data);
      setLoading(false);
      document.getElementById('boot')?.remove();
    });
  }, []);

  /* Focus handlers */
  const handleFocusToggle = async (item) => {
    const updated = !item.done;
    setFocus(prev => prev.map(f => f.id === item.id ? { ...f, done: updated } : f));
    await SB.from('pilotage_focus').update({ done: updated }).eq('id', item.id);
  };
  const handleFocusEdit = async (item, val) => {
    setFocus(prev => prev.map(f => f.id === item.id ? { ...f, description: val } : f));
    await SB.from('pilotage_focus').update({ description: val }).eq('id', item.id);
  };

  /* Pipeline handlers */
  const handlePipeProchaine = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, prochaine: val } : p));
    await SB.from('pilotage_pipeline').update({ prochaine: val }).eq('id', d.id);
  };
  const handlePipeStatut = async (d, statut, statut_color) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, statut, statut_color } : p));
    await SB.from('pilotage_pipeline').update({ statut, statut_color }).eq('id', d.id);
  };
  const handlePipeContact = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, contact: val } : p));
    await SB.from('pilotage_pipeline').update({ contact: val }).eq('id', d.id);
  };
  const handlePipeAdd = (newDossier) => {
    setPipeline(prev => [newDossier, ...prev]);
  };

  /* Projets handlers */
  const handleProjetProchaine = async (p, val) => {
    setProjets(prev => prev.map(pr => pr.id === p.id ? { ...pr, prochaine_action: val } : pr));
    await SB.from('pilotage_projets').update({ prochaine_action: val }).eq('id', p.id);
  };

  const heure = new Date().getHours();
  const salut = heure < 12 ? 'Bonjour' : heure < 18 ? 'Bon après-midi' : 'Bonsoir';

  if (loading) return null;

  return (
    <div className="app">
      <div className="hdr">
        <div className="hdr-left">
          <div className="label">Mr Attractor · Pilotage</div>
          <div className="title">{salut}, Mac Arthur</div>
        </div>
        <div className="hdr-right">{TODAY}</div>
      </div>

      <div className="tabs">
        {TABS.map(t => (
          <button key={t.id} className={'tab'+(tab===t.id?' on':'')} onClick={() => setTab(t.id)}>{t.label}</button>
        ))}
      </div>

      <div className="content">
        {tab === 'today'    && <TabAujourdHui cap={cap} focus={focus} onCapChange={setCap} onFocusToggle={handleFocusToggle} onFocusEdit={handleFocusEdit} />}
        {tab === 'pipeline' && <TabPipeline pipeline={pipeline} onEditProchaine={handlePipeProchaine} onEditStatut={handlePipeStatut} onEditContact={handlePipeContact} onAddProspect={handlePipeAdd} />}
        {tab === 'plan'     && <TabPlan />}
        {tab === 'projets'  && <TabProjets projets={projets} onEditProchaine={handleProjetProchaine} />}
        {tab === 'demos'    && <TabDemos />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
