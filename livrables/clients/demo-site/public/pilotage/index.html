function Toast({ message }) {
  if (!message) return null;
  return (
    <div style={{ position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)', zIndex:999,

      {message}

}

/* ── EDITABLE FIELD (contentEditable, pas de layout shift) */
function EditField({ value, onSave, style }) {
  const ref = useRef();
  useEffect(() => {
    if (ref.current && ref.current !== document.activeElement) {
      ref.current.innerText = value || '';
    }
  }, [value]);

  const save = () => {
    const txt = (ref.current?.innerText || '').trim();
    if (txt !== (value || '')) onSave(txt);
    else if (ref.current) ref.current.innerText = value || '';
  };

  return (
    <span
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      data-ph="Cliquer pour modifier…"
      onBlur={save}
      onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); ref.current?.blur(); } if (e.key === 'Escape') { if (ref.current) ref.current.innerText = value || ''; ref.current?.blur(); } }}
      style={{ ...style, cursor:'text', borderBottom:'1px dashed rgba(0,0,0,.15)', paddingBottom:1, display:'block', width:'100%', maxWidth:'100%', minWidth:0, overflowWrap:'break-word', wordBreak:'break-word' }}
    />
  );
}

function StatutBadge({ statut, statut_color, onEdit }) {
  const [open, setOpen] = useState(false);
  const [validating, setValidating] = useState(null);
  const ref = useRef();
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  const handleSelect = (opt) => {
    setOpen(false);
    const rules = SOP_VALIDATION[opt.label];
    if (!rules) { onEdit(opt.label, opt.color); return; }
    setValidating({ label: opt.label, color: opt.color, titre: rules.titre, checks: rules.checks, done: [] });
  };

  const toggle = (i) => setValidating(v => ({
    ...v, done: v.done.includes(i) ? v.done.filter(x=>x!==i) : [...v.done, i]
  }));

  const confirm = () => { if (validating) { onEdit(validating.label, validating.color); setValidating(null); } };

  const allDone = validating && validating.done.length === validating.checks.length;

  return (
    <div ref={ref} style={{ position:'relative', flexShrink:0 }}>
      <span className={'badge '+(statut_color||'neu')} style={{ cursor:'pointer', userSelect:'none' }} onClick={() => setOpen(o => !o)}>

        <svg width="8" height="8" viewBox="0 0 10 10" fill="none" style={{ marginLeft:3, opacity:.6 }}>

            <div key={opt.label}
              onClick={() => handleSelect(opt)}
              style={{ padding:'7px 10px', borderRadius:8, cursor:'pointer', display:'flex', alignItems:'center', gap:8, fontSize:12, fontWeight:600, color: statut === opt.label ? 'var(--ink)' : 'var(--ink2)', background: statut === opt.label ? 'rgba(0,0,0,.05)' : 'transparent' }}>
              <span className={'badge '+opt.color} style={{ padding:'2px 6px', fontSize:10, pointerEvents:'none' }}><span className="dot" /></span>
              {opt.label}
              {SOP_VALIDATION[opt.label] && <span style={{ marginLeft:'auto', fontSize:9, color:'var(--acc)', fontWeight:800, opacity:.7 }}>SOP</span>}
            </div>
          ))}
        </div>
      )}

      {validating && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.82)', zIndex:300, display:'flex', alignItems:'flex-end', justifyContent:'center' }}
          onClick={e => { if (e.target === e.currentTarget) setValidating(null); }}>
          <div style={{ width:'100%', maxWidth:520, background:'var(--card)', borderRadius:'18px 18px 0 0', maxHeight:'90vh', display:'flex', flexDirection:'column' }}>

            {/* En-tête fixe */}
            <div style={{ padding:'20px 20px 0', flexShrink:0 }}>
              <div style={{ width:36, height:4, borderRadius:2, background:'var(--bdr)', margin:'0 auto 18px' }} />
              <div style={{ fontSize:10, fontWeight:800, color:'var(--acc)', letterSpacing:'1.2px', textTransform:'uppercase', marginBottom:5 }}>Validation SOP requise</div>
              <div style={{ fontSize:17, fontWeight:800, color:'var(--ink)', marginBottom:4 }}>{validating.titre}</div>
              <div style={{ fontSize:12, color:'var(--mut)', paddingBottom:14, borderBottom:'1px solid var(--bdr)' }}>Coche chaque point pour débloquer la confirmation</div>
            </div>

            {/* Cases à cocher — scrollable */}
            <div style={{ flex:1, minHeight:0, overflowY:'auto', padding:'0 20px', WebkitOverflowScrolling:'touch' }}>
              {validating.checks.map((check, i) => (
                <div key={i} onClick={() => toggle(i)}
                  style={{ display:'flex', gap:14, alignItems:'flex-start', padding:'14px 0', borderBottom:'1px solid var(--bdr)', cursor:'pointer' }}>
                  <div style={{ width:24, height:24, minWidth:24, minHeight:24, borderRadius:8, marginTop:1, flexShrink:0,
                    background: validating.done.includes(i) ? 'var(--grn-s)' : 'rgba(0,0,0,.05)',
                    border: `2px solid ${validating.done.includes(i) ? 'var(--grn)' : 'var(--bdr)'}`,
                    display:'flex', alignItems:'center', justifyContent:'center', transition:'.15s' }}>
                    {validating.done.includes(i) && (

            {/* Boutons — toujours visibles en bas */}

  );

/* ── CAP CARD ─────────────────────────────────────────── */
function CapCard({ cap, onChange, onError }) {
  if (!cap) return null;
  const pct_conf = Math.min(100, (cap.confirme / cap.objectif) * 100);
  const pct_pipe = Math.min(100 - pct_conf, (cap.pipeline_val / cap.objectif) * 100);
  const moisRestants = Math.ceil((new Date('2026-08-31') - new Date()) / (1000*60*60*24*30));

  const saveConfirme = async (raw) => {
    const n = parseInt((raw||'').replace(/[^\d]/g,''), 10);
    if (isNaN(n)) return;
    const prev = cap.confirme;
    onChange({ ...cap, confirme: n });
    const { ok } = await saveField('pilotage_cap', cap.id, { confirme: n });
    if (!ok) { onChange({ ...cap, confirme: prev }); onError?.('Non enregistré, réessaie'); }
  };
  const savePipeline = async (raw) => {
    const n = parseInt((raw||'').replace(/[^\d]/g,''), 10);
    if (isNaN(n)) return;
    const prev = cap.pipeline_val;
    onChange({ ...cap, pipeline_val: n });
    const { ok } = await saveField('pilotage_cap', cap.id, { pipeline_val: n });
    if (!ok) { onChange({ ...cap, pipeline_val: prev }); onError?.('Non enregistré, réessaie'); }
  };

  return (
    <div className="card" style={{ padding:'18px 18px 16px', background:'linear-gradient(135deg,#FFF8F2 0%,#FFF0E0 100%)', borderColor:'rgba(238,124,31,.25)', borderLeft:'4px solid var(--acc)' }}>
      <div className="row between" style={{ marginBottom:14 }}>
        <div>
          <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:3 }}>
            <Ic name="target" size={13} color="var(--acc)" />
            <span className="t-xs mut sb">CAP MENSUEL</span>
          </div>
          <div className="row g8" style={{ alignItems:'baseline' }}>
            <span className="xb num t-xl" style={{ color:'var(--acc)' }}>{fmt(cap.objectif)}</span>
            <span className="t-xs mut">/mois · {cap.date_objectif}</span>
          </div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div className="t-xs mut" style={{ marginBottom:2 }}>Dans</div>
          <div className="xb" style={{ fontSize:20, color:'var(--ink)', letterSpacing:'-.5px' }}>{moisRestants}<span className="t-xs mut xb"> mois</span></div>
        </div>
      </div>

      <div style={{ height:8, borderRadius:100, background:'rgba(0,0,0,.08)', overflow:'hidden', marginBottom:12 }}>
        <div style={{ height:'100%', display:'flex', borderRadius:100, overflow:'hidden' }}>
          {pct_conf > 0 && <div style={{ width:pct_conf+'%', background:'var(--grn)', transition:'.6s' }} />}
          <div style={{ width:pct_pipe+'%', background:'var(--acc)', opacity:.85, transition:'.6s' }} />
        </div>
      </div>

      <div className="row g12">
        <div className="col g4 grow">
          <div className="row g5" style={{ alignItems:'center' }}>
            <span style={{ width:7,height:7,borderRadius:2,background:'var(--grn)',flexShrink:0 }} />
            <span className="t-xs mut">Confirmé</span>
          </div>
          <EditField
            value={cap.confirme > 0 ? String(cap.confirme) : '0'}
            onSave={saveConfirme}
            style={{ fontSize:14, fontWeight:700, color: cap.confirme > 0 ? 'var(--grn)' : 'var(--faint)' }}
          />
        </div>
        <div style={{ width:1, background:'var(--bdr)' }} />
        <div className="col g4 grow">
          <div className="row g5" style={{ alignItems:'center' }}>
            <span style={{ width:7,height:7,borderRadius:2,background:'var(--acc)',flexShrink:0 }} />
            <span className="t-xs mut">Pipeline qualifié</span>
          </div>
          <EditField
            value={String(cap.pipeline_val)}
            onSave={savePipeline}
            style={{ fontSize:14, fontWeight:700, color:'var(--acc)' }}
          />
        </div>
        <div style={{ width:1, background:'var(--bdr)' }} />
        <div className="col g4 grow">
          <div className="row g5" style={{ alignItems:'center' }}>
            <span style={{ width:7,height:7,borderRadius:2,background:'var(--faint)',flexShrink:0 }} />
            <span className="t-xs mut">Reste à trouver</span>
          </div>
          <span className="b num" style={{ fontSize:14, color:'var(--mut)' }}>{fmt(cap.objectif - cap.confirme - cap.pipeline_val)}</span>
        </div>
      </div>

      {cap.note && (
        <div style={{ marginTop:12, padding:'8px 11px', borderRadius:8, background:'rgba(238,124,31,.08)', borderLeft:'2.5px solid var(--acc)' }}>
          <span className="t-xs" style={{ color:'rgba(240,237,232,.65)' }}>{cap.note}</span>
        </div>
      )}
    </div>
  );
}

/* ── FINANCE SUMMARY MINI (dashboard) ────────────────────── */
function FinanceSummaryMini({ finances, onGoFinance }) {
  const now = new Date();
  const moisStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  const mois = finances.filter(f => f.date >= moisStart);
  const entreesPro   = mois.filter(f=>f.type==='entree'&&f.categorie==='pro').reduce((s,f)=>s+f.montant,0);
  const entreesPerso = mois.filter(f=>f.type==='entree'&&f.categorie==='perso').reduce((s,f)=>s+f.montant,0);
  const sorties      = mois.filter(f=>f.type==='sortie').reduce((s,f)=>s+f.montant,0);
  const pct = Math.min(100, Math.round((entreesPro/10000)*100));
  return (
    <div className="card" onClick={onGoFinance} style={{ padding:'14px 16px', cursor:'pointer', userSelect:'none', borderLeft:'4px solid var(--grn)' }}>

      </div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginBottom:10 }}>
        <div className="col g3">
          <span className="t-xs mut">Pro encaissé</span>
          <span className="b num" style={{ fontSize:13, color:'var(--grn)' }}>+{fmt(entreesPro)}</span>
        </div>
        <div className="col g3">
          <span className="t-xs mut">Perso</span>
          <span className="b num" style={{ fontSize:13, color:'var(--blu)' }}>+{fmt(entreesPerso)}</span>
        </div>
        <div className="col g3">
          <span className="t-xs mut">Sorties</span>
          <span className="b num" style={{ fontSize:13, color:'var(--red)' }}>-{fmt(sorties)}</span>

      </div>

    </div>
  );
}

// ── Éditeur d'ajustement : rédiger/retoucher un devis à prix fixe (après négo) ──
// Produit un config mode:"fixe" et le sauve sur la MÊME proposition (même numéro, même lien).
function DevisEditor({ d, pid, onSaved }) {
  const devise = (d.zone === 'CI' || d.zone === "Côte d'Ivoire") ? 'FCFA' : '€';
  const [open, setOpen] = useState(false);
  const [lignes, setLignes] = useState([{ nom:'', prix:'', offert:false }]);
  const [conditions, setConditions] = useState(['']);
  const [paiement, setPaiement] = useState([{ label:'Acompte au démarrage', montant:'' }]);
  const [forceTotal, setForceTotal] = useState('');
  const [titre, setTitre] = useState('');
  const [intro, setIntro] = useState('');
  const [limite, setLimite] = useState('');
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(null);

  const fmtN = n => (Number(n)||0).toLocaleString('fr-FR') + ' ' + devise;
  const sumTotal = lignes.reduce((s,l)=> s + (l.offert ? 0 : (Number(l.prix)||0)), 0);
  const total = forceTotal !== '' ? (Number(forceTotal)||0) : sumTotal;
  const setLigne = (i,k,v) => setLignes(a=>a.map((x,j)=>j===i?{...x,[k]:v}:x));
  const setCond  = (i,v)   => setConditions(a=>a.map((x,j)=>j===i?v:x));
  const setPay   = (i,k,v) => setPaiement(a=>a.map((x,j)=>j===i?{...x,[k]:v}:x));

  const inp = { width:'100%', padding:'8px 9px', borderRadius:8, border:'1px solid var(--bdr)', background:'var(--bg)', fontSize:12, fontFamily:'inherit', color:'var(--ink)' };
  const miniBtn = { border:'1px dashed var(--bdr)', background:'transparent', color:'var(--ink2)', borderRadius:8, padding:'6px 10px', fontSize:11.5, fontWeight:700, cursor:'pointer', fontFamily:'inherit' };

  const save = async () => {
    setSaving(true); setSaved(null);
    const clean = lignes.filter(l => (l.nom||'').trim());
    const config = {
      mode:'fixe',
      date: new Date().toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' }),
      client: d.nom || '', projet: d.activite || 'votre projet', devise,
      submitUrl:'https://lgdgbrivnhgeupqhkckd.supabase.co/functions/v1/devis-accept',
      waHelp:'33753902323', waHelpText:'Bonjour Mac Arthur, je regarde mon devis et j\'ai une question : ',
      tag:'Conseil en business & applications métier',
      titre: titre.trim() || 'Votre devis <em>Attractor</em>',
      intro: intro.trim(),
      lignes: clean.map(l => ({ nom:(l.nom||'').trim(), prix:Number(l.prix)||0, offert:!!l.offert })),
      total,
      total_label: fmtN(total),
      conditions: conditions.map(c => (c||'').trim()).filter(Boolean),
      paiement: paiement.filter(p => (p.label||'').trim()).map(p => ({ label:(p.label||'').trim(), montant:Number(p.montant)||0 })),
      limite: limite.trim(),
      doneMsg:'Votre accord a bien été enregistré et transmis à Mac Arthur.'
    };
    try {
      let res;
      if (pid) res = await SB.functions.invoke('generate-proposition', { body:{ update:true, id:pid, config, total, statut:'brouillon' } });
      else     res = await SB.functions.invoke('generate-proposition', { body:{ dossier_id:d.id, config } });
      const data = res.data;
      if (res.error || data?.error) { setSaved({ __error: data?.error || 'Erreur enregistrement' }); }
      else {
        const newId = data.id || pid;
        if (!pid && newId) { try { await SB.from('pilotage_pipeline').update({ proposition_id:newId }).eq('id', d.id); } catch {} }
        setSaved({ id:newId, numero:data.numero });
        onSaved && onSaved(newId, data.numero);
      }
    } catch { setSaved({ __error:'Erreur réseau' }); }
    setSaving(false);
  };

  return (
    <div style={{ marginTop:8 }}>
      <button onClick={() => setOpen(o=>!o)}
        style={{ width:'100%', minHeight:38, borderRadius:10, border:'1.5px solid var(--acc)', background:'transparent', color:'var(--acc)', fontWeight:800, fontSize:12, cursor:'pointer', fontFamily:'inherit' }}>
        {open ? '▾ Fermer l\'éditeur' : '✎ Ajuster / rédiger le devis (prix fixe négocié)'}
      </button>
      {open && (
        <div style={{ marginTop:8, padding:12, borderRadius:12, background:'var(--card2)', border:'1px solid var(--bdr)', display:'flex', flexDirection:'column', gap:12 }}>
          <div className="col g4">
            <span className="t-xs mut b">Titre (optionnel)</span>
            <input style={inp} value={titre} onChange={e=>setTitre(e.target.value)} placeholder="Votre devis Attractor" />
            <span className="t-xs mut b" style={{ marginTop:4 }}>Intro (optionnel)</span>
            <textarea style={{ ...inp, minHeight:46, resize:'vertical' }} value={intro} onChange={e=>setIntro(e.target.value)} placeholder="Le contexte négocié, en une phrase" />
          </div>

          <div className="col g6">
            <span className="t-xs mut b">Lignes du devis</span>
            {lignes.map((l,i) => (
              <div key={i} className="row g6" style={{ alignItems:'center' }}>
                <input style={{ ...inp, flex:2 }} value={l.nom} onChange={e=>setLigne(i,'nom',e.target.value)} placeholder="Prestation" />
                <input style={{ ...inp, width:74 }} type="number" value={l.prix} onChange={e=>setLigne(i,'prix',e.target.value)} placeholder="Prix" disabled={l.offert} />
                <label className="t-xs mut" style={{ display:'flex', alignItems:'center', gap:3, whiteSpace:'nowrap' }}><input type="checkbox" checked={l.offert} onChange={e=>setLigne(i,'offert',e.target.checked)} />offert</label>
                <button onClick={()=>setLignes(a=>a.filter((_,j)=>j!==i))} style={{ ...miniBtn, padding:'6px 8px' }}>✕</button>
              </div>
            ))}
            <button onClick={()=>setLignes(a=>[...a,{ nom:'', prix:'', offert:false }])} style={miniBtn}>+ Ajouter une ligne</button>
          </div>

          <div className="row between" style={{ alignItems:'center' }}>
            <span className="t-xs mut b">Total {forceTotal!=='' ? '(forcé)' : '(auto : '+fmtN(sumTotal)+')'}</span>
            <input style={{ ...inp, width:120 }} type="number" value={forceTotal} onChange={e=>setForceTotal(e.target.value)} placeholder="forcer le total" />
          </div>

          <div className="col g6">
            <span className="t-xs mut b">Conditions particulières</span>
            {conditions.map((c,i) => (
              <div key={i} className="row g6">
                <input style={{ ...inp, flex:1 }} value={c} onChange={e=>setCond(i,e.target.value)} placeholder="Ex : délai, périmètre, contrepartie…" />
                <button onClick={()=>setConditions(a=>a.filter((_,j)=>j!==i))} style={{ ...miniBtn, padding:'6px 8px' }}>✕</button>
              </div>
            ))}
            <button onClick={()=>setConditions(a=>[...a,''])} style={miniBtn}>+ Ajouter une condition</button>
          </div>

          <div className="col g6">
            <span className="t-xs mut b">Plan de paiement</span>
            {paiement.map((p,i) => (
              <div key={i} className="row g6" style={{ alignItems:'center' }}>
                <input style={{ ...inp, flex:2 }} value={p.label} onChange={e=>setPay(i,'label',e.target.value)} placeholder="Ex : Tranche 1 au démarrage" />
                <input style={{ ...inp, width:84 }} type="number" value={p.montant} onChange={e=>setPay(i,'montant',e.target.value)} placeholder="Montant" />
                <button onClick={()=>setPaiement(a=>a.filter((_,j)=>j!==i))} style={{ ...miniBtn, padding:'6px 8px' }}>✕</button>
              </div>
            ))}
            <button onClick={()=>setPaiement(a=>[...a,{ label:'', montant:'' }])} style={miniBtn}>+ Ajouter une tranche</button>
          </div>

          <div className="col g4">
            <span className="t-xs mut b">Mention « À noter » (optionnel)</span>
            <input style={inp} value={limite} onChange={e=>setLimite(e.target.value)} placeholder="Ex : offre valable jusqu'au 31/07…" />
          </div>

          <button onClick={save} disabled={saving}
            style={{ minHeight:42, borderRadius:10, border:'none', background:'var(--acc)', color:'#fff', fontWeight:800, fontSize:13, cursor:'pointer', fontFamily:'inherit', opacity:saving ? 0.6 : 1 }}>
            {saving ? 'Enregistrement…' : (pid ? 'Enregistrer et mettre à jour le lien' : 'Créer le devis et le lien')}
          </button>
          {saved?.__error && <div style={{ color:'var(--red)', fontSize:11.5, fontWeight:600 }}>{saved.__error}</div>}
          {saved && !saved.__error && <div style={{ color:'var(--grn)', fontSize:11.5, fontWeight:700 }}>✓ Devis {saved.numero||''} à jour. Le lien ci-dessus est prêt à renvoyer (même numéro).</div>}
        </div>
      )}
    </div>
  );
}

function DossierCard({ d, i, onEditProchaine, onEditStatut, onEditContact, onEditSetup, onEditMensuel, onEditField }) {
  const parseAmount = (raw) => { const n = parseInt((raw||'').replace(/[^\d]/g,''),10); return isNaN(n) ? null : n; };
  const famColor = d.famille === 'A' ? 'org' : d.famille === 'B' ? 'blu' : 'grn';
  const famBorder = d.famille === 'A' ? 'var(--acc)' : d.famille === 'B' ? 'var(--blu)' : d.famille === 'D' ? 'var(--red)' : 'var(--grn)';
  const [devis, setDevis] = useState(null);
  const [devisLoading, setDevisLoading] = useState(false);
  const [payPct, setPayPct] = useState('50');
  const [payChannel, setPayChannel] = useState('WAVECI');
  const [payLoading, setPayLoading] = useState(false);
  const [payResult, setPayResult] = useState(null);
  const [prop, setProp] = useState(null);
  const [propLoading, setPropLoading] = useState(false);

  const genProposition = async () => {
    setPropLoading(true); setProp(null);
    try {
      const { data, error } = await SB.functions.invoke('generate-proposition', { body: { dossier_id: d.id } });
      if (error || data?.error) setProp({ __error: data?.error || 'Erreur génération proposition' });
      else setProp(data);
    } catch { setProp({ __error: 'Erreur réseau' }); }
    setPropLoading(false);
  };

  const generatePayment = async () => {
    if (!devis?.devis_id) return;
    setPayLoading(true); setPayResult(null);
    try {
      const { data, error } = await SB.functions.invoke('init-pilotage-payment', {
        body: { devis_id: devis.devis_id, percentage: Number(payPct), channel: payChannel },
      });
      if (error || data?.error) setPayResult({ __error: data?.error || 'Erreur génération du lien' });
      else setPayResult(data);
    } catch { setPayResult({ __error: 'Erreur réseau' }); }
    setPayLoading(false);
  };

  const generateDevis = async () => {
    setDevisLoading(true); setDevis(null);
    try {
      const { data, error } = await SB.functions.invoke('generate-devis', { body: { dossier_id: d.id } });
      if (error || data?.error) setDevis({ __error: data?.error || 'Erreur génération devis' });
      else setDevis(data);
    } catch { setDevis({ __error: 'Erreur réseau' }); }
    setDevisLoading(false);
  };

  const validerDevis = async () => {
    if (!devis?.devis_id) return;
    await SB.from('pilotage_devis').update({ statut: 'valide' }).eq('id', devis.devis_id);
    setDevis(prev => ({ ...prev, statut: 'valide' }));
  };
  const [expanded, setExpanded] = useState(false);
  const shortNext = (d.prochaine || '').length > 72 ? (d.prochaine || '').slice(0, 72) + '…' : (d.prochaine || '');
  return (
    <div className="card anim col" style={{ overflow:'hidden', animationDelay:(i*70)+'ms', borderTop:`3px solid ${famBorder}` }}>
      {/* NIVEAU 1 — toujours visible, cliquable pour déplier (lisibilité) */}
      <div onClick={() => setExpanded(e => !e)} style={{ padding:'12px 14px', cursor:'pointer', display:'flex', alignItems:'flex-start', gap:10 }}>
        <span title={'Famille '+(d.famille||'?')} style={{ flex:'0 0 auto', width:11, height:11, borderRadius:'50%', marginTop:5, background:famBorder }} />
        <div style={{ flex:1, minWidth:0 }}>
          <div className="row between" style={{ gap:8, alignItems:'center' }}>
            <span className="b" style={{ fontSize:15, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{d.nom || '—'}</span>
            <span onClick={e => e.stopPropagation()} style={{ flexShrink:0 }}>
              <StatutBadge statut={d.statut} statut_color={d.statut_color} onEdit={(label, color) => onEditStatut(d, label, color)} />
            </span>
          </div>
          <div className="row g6" style={{ marginTop:3, alignItems:'baseline', minWidth:0 }}>
            {d.date_action && <span className="t-xs" style={{ color: d.urgent ? 'var(--red)' : 'var(--acc)', fontWeight:700, flexShrink:0 }}>{d.date_action}</span>}
            <span className="t-xs mut" style={{ whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', minWidth:0 }}>{shortNext || '—'}</span>
          </div>
        </div>
        <span className="mut" style={{ flex:'0 0 auto', fontSize:12, marginTop:3 }}>{expanded ? '▲' : '▼'}</span>
      </div>
      {/* NIVEAU 2 — détails, dépliés au clic */}
      {expanded && (<>
      <div style={{ padding:'2px 16px 12px', borderTop:'1px solid var(--bdr)' }}>
        <div className="row g6" style={{ flexWrap:'wrap', margin:'8px 0 8px', alignItems:'center' }}>
          <select value={d.famille || ''} onChange={e => onEditField(d, 'famille', e.target.value || null)}
            className={'badge '+(d.famille?famColor:'neu')}
            style={{ fontSize:10, padding:'2px 4px', border:'none', cursor:'pointer', fontFamily:'inherit', fontWeight:700 }}>
            <option value="">Famille ?</option>
            <option value="A">Fam. A</option>
            <option value="B">Fam. B</option>
            <option value="C">Fam. C</option>
            <option value="D">Fam. D</option>
          </select>
          <select value={d.zone || ''} onChange={e => onEditField(d, 'zone', e.target.value || null)}
            className="badge neu" style={{ fontSize:10, padding:'2px 4px', border:'none', cursor:'pointer', fontFamily:'inherit', fontWeight:700 }}>
            <option value="">Zone ?</option>
            <option value="CI">CI</option>
            <option value="France">France</option>
            <option value="International">International</option>
          </select>
          {d.source === 'inbound_site' && <span className="badge org" style={{ fontSize:10, padding:'2px 7px' }}>Site</span>}
        </div>
        <div style={{ marginBottom:10 }}>
          <EditField value={d.nom || ''} onSave={v => onEditField(d, 'nom', v)} style={{ fontSize:14, fontWeight:700 }} />
          <EditField value={d.activite || ''} onSave={v => onEditField(d, 'activite', v)} style={{ fontSize:11.5, color:'var(--ink2)', marginTop:1 }} />
        </div>
        <div className="row g10" style={{ marginBottom:12 }}>
          <div className="col g3 grow">
            <span className="t-xs mut">Setup €</span>
            <EditField
              value={d.setup != null ? String(d.setup) : ''}
              onSave={v => onEditSetup(d, parseAmount(v))}
              style={{ fontSize:14, fontWeight:700, color:'var(--ink)' }}
            />
          </div>
          <div style={{ width:1, background:'var(--bdr)', alignSelf:'stretch' }} />
          <div className="col g3 grow">
            <span className="t-xs mut">Récurrent €/mois</span>
            <EditField
              value={d.mensuel != null ? String(d.mensuel) : ''}
              onSave={v => onEditMensuel(d, parseAmount(v))}
              style={{ fontSize:14, fontWeight:700, color:'var(--grn)' }}
            />
          </div>
          <div style={{ width:1, background:'var(--bdr)', alignSelf:'stretch' }} />
          <div className="col g3" style={{ alignItems:'flex-end', flexShrink:0 }}>
            <span className="t-xs mut">Action le</span>
            <span className="b" style={{ fontSize:13, color: d.urgent ? 'var(--red)' : 'var(--acc)' }}>{d.date_action}</span>
          </div>
        </div>
        <div style={{ padding:'10px 12px', borderRadius:10, background:'rgba(0,0,0,.04)', borderLeft:'2px solid rgba(0,0,0,.1)', marginBottom:8 }}>
          <div className="t-xs mut b" style={{ marginBottom:4 }}>→ PROCHAINE ACTION</div>
          <EditField
            value={d.prochaine}
            onSave={v => onEditProchaine(d, v)}
            style={{ fontSize:11.5, color:'var(--ink2)', lineHeight:1.5 }}
            multiline
          />
        </div>
        <div style={{ padding:'10px 12px', borderRadius:10, background:'rgba(0,0,0,.04)', borderLeft:'2px solid rgba(0,0,0,.1)' }}>
          <div className="t-xs mut b" style={{ marginBottom:4 }}>BESOIN (utilisé par l'auto-devis)</div>
          <EditField
            value={d.besoin || ''}
            onSave={v => onEditField(d, 'besoin', v)}
            style={{ fontSize:11.5, color:'var(--ink2)', lineHeight:1.5 }}
            multiline
          />
        </div>
      </div>
      <div style={{ padding:'10px 16px', borderTop:'1px solid var(--bdr)', background:'var(--bg)', display:'flex', alignItems:'center', gap:8 }}>
        <span className="t-xs mut" style={{ flexShrink:0 }}>Contact</span>
        <div style={{ flex:1, minWidth:0 }}>
          <EditField
            value={d.contact || ''}
            onSave={v => onEditContact(d, v)}
            style={{ fontSize:11.5, fontWeight:600, color:'var(--ink2)' }}
          />
        </div>
        {d.contact && !d.wa_draft && (
          <a href={`https://wa.me/${d.contact.replace(/[\s+\-()]/g,'')}`} target="_blank"
            style={{ display:'flex', alignItems:'center', gap:5, background:'#25D366', color:'#fff', borderRadius:8, padding:'0 12px', fontSize:11, fontWeight:700, textDecoration:'none', flexShrink:0, minHeight:44, minWidth:44 }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            WA
          </a>
        )}
        {d.contact && d.wa_draft && (
          <a href={`https://wa.me/${d.contact.replace(/[\s+\-()]/g,'')}?text=${encodeURIComponent(d.wa_draft)}`} target="_blank"
            title={d.wa_draft}
            style={{ display:'flex', alignItems:'center', gap:5, background:'var(--org)', color:'#fff', borderRadius:8, padding:'0 12px', fontSize:11, fontWeight:700, textDecoration:'none', flexShrink:0, minHeight:44, whiteSpace:'nowrap' }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            WA pré-écrit
          </a>
        )}
      </div>

      {/* Proposition interactive — lien à envoyer au prospect (il compose, valide, Pilotage se met à jour) */}
      <div style={{ padding:'10px 16px 14px', borderTop:'1px solid var(--bdr)' }}>
        {!prop && !d.proposition_id && !propLoading && (
          <button onClick={genProposition}
            style={{ width:'100%', minHeight:40, borderRadius:10, border:'none', background:'var(--acc)', color:'#fff', fontWeight:800, fontSize:12, cursor:'pointer', fontFamily:'inherit' }}>
            Créer le lien proposition (interactif)
          </button>
        )}
        {propLoading && <div className="t-xs mut" style={{ textAlign:'center', padding:'8px 0' }}>Génération de la proposition…</div>}
        {prop?.__error && (
          <div style={{ padding:'8px 10px', borderRadius:8, background:'var(--red-s)', color:'var(--red)', fontSize:11.5, fontWeight:600 }}>{prop.__error}</div>
        )}
        {(prop?.id || d.proposition_id) && !prop?.__error && (() => {
          const pid = prop?.id || d.proposition_id;
          const url = `https://demo.agenceattractor.com/proposition?id=${pid}`;
          const waMsg = `Bonjour ${d.nom || ''}, voici votre proposition Mr Attractor. Vous composez ce que vous voulez, le total se calcule tout seul, et vous validez en un clic : ${url}`;
          const waNum = (d.contact || '').replace(/[\s+\-()]/g,'');
          return (
            <div style={{ padding:'12px', borderRadius:12, background:'var(--card2)', border:'1px solid var(--bdr)' }}>
              <div className="b" style={{ fontSize:12.5, marginBottom:8 }}>Lien proposition {prop?.numero ? '· '+prop.numero : ''}</div>
              <input readOnly value={url} onClick={e => e.target.select()}
                style={{ width:'100%', padding:'9px 10px', borderRadius:8, border:'1px solid var(--bdr)', background:'var(--bg)', fontSize:11, color:'var(--ink2)', fontFamily:'inherit', marginBottom:8 }} />
              <div className="row g6">
                <button onClick={() => { navigator.clipboard.writeText(url); }}
                  style={{ flex:1, minHeight:40, borderRadius:9, border:'1.5px solid var(--bdr)', background:'transparent', color:'var(--ink2)', fontWeight:700, fontSize:12, cursor:'pointer', fontFamily:'inherit' }}>Copier</button>
                <a href={url} target="_blank"
                  style={{ flex:1, minHeight:40, display:'flex', alignItems:'center', justifyContent:'center', borderRadius:9, border:'1.5px solid var(--bdr)', color:'var(--ink2)', fontWeight:700, fontSize:12, textDecoration:'none' }}>Ouvrir</a>
                {waNum && (
                  <a href={`https://wa.me/${waNum}?text=${encodeURIComponent(waMsg)}`} target="_blank"
                    style={{ flex:1.4, minHeight:40, display:'flex', alignItems:'center', justifyContent:'center', gap:5, borderRadius:9, border:'none', background:'#25D366', color:'#fff', fontWeight:800, fontSize:12, textDecoration:'none' }}>Envoyer WA</a>
                )}
              </div>
            </div>
          );
        })()}
        <DevisEditor d={d} pid={prop?.id || d.proposition_id} onSaved={(id, numero) => setProp({ id, numero })} />
      </div>

      {/* Auto-devis Claude — brouillon à valider, jamais envoyé automatiquement */}
      <div style={{ padding:'10px 16px 14px', borderTop:'1px solid var(--bdr)' }}>
        {!devis && !devisLoading && (
          <button onClick={generateDevis}
            style={{ width:'100%', minHeight:40, borderRadius:10, border:'1.5px solid var(--acc)', background:'var(--acc-s)', color:'var(--acc)', fontWeight:800, fontSize:12, cursor:'pointer', fontFamily:'inherit' }}>
            Générer devis (Claude · barème officiel)
          </button>
        )}
        {devisLoading && <div className="t-xs mut" style={{ textAlign:'center', padding:'8px 0' }}>Calcul du devis…</div>}
        {devis?.__error && (
          <div style={{ padding:'8px 10px', borderRadius:8, background:'var(--red-s)', color:'var(--red)', fontSize:11.5, fontWeight:600 }}>{devis.__error}</div>
        )}
        {devis && !devis.__error && (
          <div style={{ padding:'12px', borderRadius:12, background:'var(--card2)', border:'1px solid var(--bdr)' }}>
            <div className="row between" style={{ marginBottom:8 }}>
              <span className="b" style={{ fontSize:12.5 }}>Devis {devis.numero}</span>
              {devis.statut === 'valide'
                ? <span className="badge grn" style={{ fontSize:10 }}>Validé</span>
                : <span className="badge org" style={{ fontSize:10 }}>Brouillon</span>}
            </div>
            <div className="col g4" style={{ marginBottom: devis.raisonnement ? 8 : 0 }}>
              <div className="row between"><span className="t-xs mut">Famille / Niveau</span><span className="t-xs b">{devis.famille} — {devis.niveau}</span></div>
              {devis.setup_ht != null && <div className="row between"><span className="t-xs mut">Setup</span><span className="t-xs b">{devis.setup_ht} {devis.devise}</span></div>}
              {devis.mrr != null && <div className="row between"><span className="t-xs mut">Mensuel</span><span className="t-xs b">{devis.mrr} {devis.devise}</span></div>}
              {devis.acompte != null && <div className="row between"><span className="t-xs mut">Acompte 50%</span><span className="t-xs b" style={{ color:'var(--acc)' }}>{devis.acompte} {devis.devise}</span></div>}
            </div>
            {devis.raisonnement && <div className="t-xs mut" style={{ fontStyle:'italic', marginBottom:8 }}>"{devis.raisonnement}"</div>}
            {devis.questions_manquantes && devis.questions_manquantes !== 'null' && (
              <div style={{ padding:'6px 9px', borderRadius:8, background:'rgba(238,124,31,.1)', marginBottom:8 }}>
                <span className="t-xs" style={{ color:'var(--acc)', fontWeight:700 }}>À préciser : </span>
                <span className="t-xs">{devis.questions_manquantes}</span>
              </div>
            )}
            {devis.statut !== 'valide' && (
              <button onClick={validerDevis}
                style={{ width:'100%', minHeight:38, borderRadius:9, border:'none', background:'var(--grn)', color:'#fff', fontWeight:800, fontSize:12, cursor:'pointer', fontFamily:'inherit' }}>
                Valider ce devis
              </button>
            )}

            {/* Lien de paiement XPaye — uniquement devis validé + en FCFA (gateway CI) */}
            {devis.statut === 'valide' && devis.devise === 'FCFA' && (
              <div style={{ marginTop:10, paddingTop:10, borderTop:'1px solid var(--bdr)' }}>
                <div className="t-xs mut b" style={{ marginBottom:6 }}>PAIEMENT XPAYE</div>

/* ── DÉCHARGE VOCALE (Pipeline) ──────────────────────────── */
function DechargeVocalePipeline({ onAddProspect }) {
  const [phase, setPhase] = useState('idle'); // idle | recording | processing | review
  const [errMsg, setErrMsg] = useState('');
  const [transcript, setTranscript] = useState('');
  const [draft, setDraft] = useState(null);
  const [saving, setSaving] = useState(false);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);

  const startRecording = async () => {
    setErrMsg('');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const recorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4' });
      chunksRef.current = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      recorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); processAudio(recorder.mimeType); };
      recorderRef.current = recorder;
      recorder.start(250);
      setPhase('recording');
    } catch {
      setErrMsg("Accès micro refusé — autorise le micro dans les paramètres du navigateur.");
    }
  };

  const stopRecording = () => {
    if (recorderRef.current?.state === 'recording') {
      recorderRef.current.stop();
      setPhase('processing');
    }
  };

  const processAudio = async (mimeType) => {
    try {
      const blob = new Blob(chunksRef.current, { type: mimeType });
      if (blob.size < 1000) { setPhase('idle'); setErrMsg('Enregistrement trop court — maintiens et parle.'); return; }
      const audio_b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onloadend = () => res(r.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(blob);
      });
      const { data, error } = await SB.functions.invoke('process-dump-pilotage', { body: { audio_b64, audio_type: mimeType } });
      if (error || data?.error) { setPhase('idle'); setErrMsg(data?.error || 'Erreur de traitement'); return; }
      setTranscript(data.transcript || '');
      setDraft({
        nom: data.prospect?.nom || '',
        activite: data.prospect?.activite || '',
        besoin: data.prospect?.besoin || '',
        zone: data.prospect?.zone || 'CI',
        contact: data.prospect?.contact || '',
      });
      setPhase('review');
    } catch { setPhase('idle'); setErrMsg('Erreur réseau'); }
  };

  const confirmDraft = async () => {
    if (!draft?.nom?.trim() || saving) return;
    setSaving(true);
    const { data, error } = await SB.from('pilotage_pipeline').insert({
      nom: draft.nom.trim(),
      activite: draft.activite || null,
      besoin: draft.besoin || null,
      contact: draft.contact || null,
      zone: draft.zone,
      famille: 'A',
      type: 'App Métier',
      statut: 'Nouveau',
      statut_color: 'neu',
      prochaine: 'Qualifier le besoin',
      date_action: new Date().toLocaleDateString('fr-FR'),
      priorite: 99,
      urgent: false,
    }).select().single();
    setSaving(false);
    if (!error && data) { onAddProspect(data); reset(); }
  };

  const reset = () => { setPhase('idle'); setTranscript(''); setDraft(null); setErrMsg(''); };

  if (phase === 'idle') {
    return (
      <button onClick={startRecording}
        style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:6, width:44, height:44, borderRadius:10, border:'1.5px solid var(--acc)', background:'var(--acc-s)', color:'var(--acc)', cursor:'pointer', flexShrink:0 }}
        title="Ajouter un prospect en parlant">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
      </button>
    );
  }

  return (
    <div className="card anim col" style={{ padding:14, marginBottom:14, width:'100%', flexBasis:'100%' }}>
      {phase === 'recording' && (
        <div className="col g8" style={{ alignItems:'center' }}>
          <div className="t-xs mut">Parle : prénom, activité, besoin, zone, contact…</div>
          <button onClick={stopRecording}
            style={{ width:56, height:56, borderRadius:100, border:'none', background:'var(--red)', color:'#fff', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <div className="t-xs mut">Touche pour arrêter</div>
        </div>
      )}
      {phase === 'processing' && <div className="t-xs mut" style={{ textAlign:'center' }}>Transcription en cours…</div>}
      {errMsg && <div className="t-xs" style={{ color:'var(--red)', textAlign:'center' }}>{errMsg}</div>}
      {phase === 'review' && draft && (
        <div className="col g8">
          {transcript && <div className="t-xs mut" style={{ fontStyle:'italic' }}>"{transcript}"</div>}
          <input value={draft.nom} onChange={e=>setDraft({...draft, nom:e.target.value})} placeholder="Nom / prénom *" style={iStyle} />
          <input value={draft.activite} onChange={e=>setDraft({...draft, activite:e.target.value})} placeholder="Activité" style={iStyle} />
          <input value={draft.besoin} onChange={e=>setDraft({...draft, besoin:e.target.value})} placeholder="Besoin" style={iStyle} />
          <div className="row g8">
            <select value={draft.zone} onChange={e=>setDraft({...draft, zone:e.target.value})} style={{...iStyle, flex:1}}>
              <option value="CI">Côte d'Ivoire</option>
              <option value="France">France</option>
              <option value="International">International</option>
            </select>
            <input value={draft.contact} onChange={e=>setDraft({...draft, contact:e.target.value})} placeholder="WhatsApp" style={{...iStyle, flex:1}} />
          </div>
          <div className="row g8">
            <button onClick={reset} style={{ flex:1, minHeight:40, borderRadius:10, border:'1.5px solid var(--bdr)', background:'transparent', color:'var(--mut)', fontWeight:700, fontSize:12, cursor:'pointer', fontFamily:'inherit' }}>Annuler</button>
            <button onClick={confirmDraft} disabled={!draft.nom.trim() || saving} style={{ flex:2, minHeight:40, borderRadius:10, border:'none', background:'var(--acc)', color:'#fff', fontWeight:800, fontSize:12, cursor:'pointer', fontFamily:'inherit' }}>
              {saving ? 'Création…' : 'Créer le dossier →'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── ALIMENTER MODAL ─────────────────────────────────── */
function AlimenterModal({ env, onConfirm, onCancel }) {
  const [montant, setMontant] = useState('');
  const [saving, setSaving]   = useState(false);
  const val = montant && parseFloat(montant) > 0;

  const save = async () => {
    if (!val || saving) return;
    setSaving(true);
    const newEpargne = (env.epargne || 0) + parseFloat(montant);
    const { error } = await SB.from('pilotage_enveloppes').update({ epargne: newEpargne }).eq('id', env.id);
    setSaving(false);
    if (!error) onConfirm({ ...env, epargne: newEpargne });
  };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.85)', zIndex:300, display:'flex', alignItems:'flex-end', justifyContent:'center' }}
      onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div style={{ width:'100%', maxWidth:520, background:'var(--card)', borderRadius:'18px 18px 0 0', padding:'24px 20px 48px' }}>
        <div style={{ width:36, height:4, borderRadius:2, background:'var(--bdr)', margin:'0 auto 20px' }} />
        <div style={{ fontSize:15, fontWeight:800, color:'var(--ink)', marginBottom:3 }}>Alimenter l'enveloppe</div>
        <div style={{ fontSize:12, color:'var(--mut)', marginBottom:20 }}>{env.nom} · {fmt(env.epargne || 0)} / {fmt(env.cible)}</div>
        <div style={{ marginBottom:20 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>Montant à ajouter €</div>
          <input value={montant} onChange={e => setMontant(e.target.value.replace(/[^0-9.]/g,''))}
            inputMode="decimal" placeholder="0.00" style={iStyle} autoFocus />
        </div>
        <div style={{ display:'flex', gap:10 }}>
          <button onClick={onCancel} style={{ flex:1, minHeight:44, borderRadius:12, border:'1.5px solid var(--bdr)', background:'transparent', color:'var(--mut)', fontWeight:700, fontSize:13, cursor:'pointer', fontFamily:'inherit' }}>Annuler</button>
          <button onClick={save} disabled={!val||saving}
            style={{ flex:2, minHeight:44, borderRadius:12, border:'none',
              background:val?'var(--grn)':'rgba(0,0,0,.06)',
              color:val?'#fff':'var(--faint)',
              fontWeight:800, fontSize:13, cursor:val?'pointer':'not-allowed', fontFamily:'inherit', transition:'.2s' }}>
            {saving ? 'Enregistrement…' : val ? '+'+fmt(parseFloat(montant))+' →' : 'Saisir un montant'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── ENVELOPPE CARD ──────────────────────────────────── */
function EnveloppeCard({ env, onAlimenter }) {
  const epargne = env.epargne || 0;
  const pct     = Math.min(100, Math.round((epargne / env.cible) * 100));
  const reste   = env.cible - epargne;
  const barCol  = pct >= 75 ? 'var(--grn)' : pct >= 40 ? 'var(--acc)' : 'var(--red)';
  const hzLabel = env.horizon === 'court' ? 'Court terme' : env.horizon === 'moyen' ? 'Moyen terme' : 'Long terme';
  const hzBadge = env.horizon === 'court' ? 'org' : env.horizon === 'moyen' ? 'blu' : 'neu';

  return (
    <div style={{ padding:'14px 16px', borderBottom:'1px solid var(--bdr)' }}>
      <div className="row between" style={{ marginBottom:8, alignItems:'flex-start' }}>
        <div className="col g3 grow" style={{ minWidth:0 }}>
          <span className="b truncate" style={{ fontSize:13 }}>{env.nom}</span>
          {env.description && <span className="t-xs mut truncate">{env.description}</span>}
        </div>
        <div style={{ display:'flex', gap:4, flexShrink:0, marginLeft:8 }}>
          <span className={'badge '+(env.categorie==='pro'?'blu':'grn')} style={{ fontSize:10, padding:'2px 6px' }}>{env.categorie==='pro'?'Pro':'Perso'}</span>
          <span className={'badge '+hzBadge} style={{ fontSize:10, padding:'2px 6px' }}>{hzLabel}</span>
        </div>
      </div>
      <div style={{ marginBottom:8 }}>
        <div className="row between" style={{ marginBottom:5 }}>
          <span className="b num" style={{ fontSize:14, color:barCol }}>{fmt(epargne)}</span>
          <span className="t-xs mut">sur {fmt(env.cible)} · reste {fmt(reste)}</span>
        </div>
        <div style={{ height:7, borderRadius:100, background:'rgba(0,0,0,.07)', overflow:'hidden' }}>
          <div style={{ height:'100%', width:pct+'%', background:barCol, borderRadius:100, transition:'.5s' }} />
        </div>
      </div>
      <div className="row between" style={{ alignItems:'center' }}>
        <span style={{ fontSize:11, fontWeight:700, color:barCol }}>{pct}% constitué</span>
        <button onClick={() => onAlimenter(env)}
          style={{ minHeight:36, padding:'0 14px', borderRadius:9, border:'none',
            background:'var(--grn-s)', color:'var(--grn)', fontWeight:800, fontSize:12, cursor:'pointer', fontFamily:'inherit' }}>
          + Alimenter
        </button>
      </div>
    </div>
  );
}

/* ── ENVELOPPES SECTION ──────────────────────────────── */
function EnveloppesSection({ enveloppes, onUpdateEnveloppe }) {
  const [alimenter, setAlimenter] = useState(null);

  const total_cible   = enveloppes.reduce((s,e) => s + e.cible, 0);
  const total_epargne = enveloppes.reduce((s,e) => s + (e.epargne||0), 0);
  const total_reste   = total_cible - total_epargne;
  const pct_global    = total_cible > 0 ? Math.min(100, Math.round((total_epargne/total_cible)*100)) : 0;

  return (
    <Fragment>
      <div className="card" style={{ overflow:'hidden', borderLeft:'4px solid var(--blu)' }}>
        <div style={{ padding:'14px 16px 12px', borderBottom:'1px solid var(--bdr)', background:'rgba(0,0,0,.02)' }}>
          <div className="row between" style={{ marginBottom:10, alignItems:'flex-start' }}>
            <SectionHead icon="piggy" color="var(--blu)" bg="var(--blu-s)" label="ENVELOPPES & OBJECTIFS" sub={`${enveloppes.length} objectifs · ${fmt(total_reste)} restants`} style={{ marginBottom:0 }} />
            <div className="col g3" style={{ alignItems:'flex-end' }}>
              <span className="t-xs mut">Déjà constitué</span>
              <span className="b num" style={{ fontSize:15, color:'var(--grn)' }}>{fmt(total_epargne)}</span>
            </div>
          </div>
          <div style={{ height:7, borderRadius:100, background:'rgba(0,0,0,.07)', overflow:'hidden', marginBottom:5 }}>
            <div style={{ height:'100%', width:pct_global+'%', background:'var(--grn)', borderRadius:100, transition:'.6s' }} />
          </div>
          <div className="t-xs mut">{pct_global}% de la suffisance financière · objectif total {fmt(total_cible)}</div>
        </div>
        {enveloppes.map((e,i) => (
          <EnveloppeCard key={e.id} env={e} onAlimenter={setAlimenter} />
        ))}
      </div>

      {alimenter && (
        <AlimenterModal
          env={alimenter}
          onConfirm={updated => { onUpdateEnveloppe(updated); setAlimenter(null); }}
          onCancel={() => setAlimenter(null)}
        />
      )}
    </Fragment>
  );
}

  const [desc, setDesc]   = useState(entry?.description || '');

  const [saving, setSaving] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const valid = montant && parseFloat(montant) > 0 && desc.trim();

  const save = async () => {
    if (!valid || saving) return;
    setSaving(true);
    const payload = {
      type, categorie: cat, montant: parseFloat(montant),
      description: desc.trim(), notes: notes.trim() || null, date,
    };
    const { data, error } = await (isEdit
      ? SB.from('pilotage_finances').update(payload).eq('id', entry.id).select().single()

const REGLES_COACH = [
  { id:'epargne',   label:'Épargne de sécurité', desc:'Mettre de côté 20% de chaque encaissement pro', pct:0.20, couleur:'var(--grn)' },
  { id:'charges',   label:'Charges stack', desc:'Stack outils (Claude Max, API, GoDaddy…) = 110 €/mois max', plafond:110, couleur:'var(--acc)' },
  { id:'reinvest',  label:'Réinvestissement', desc:'10% des encaissements pro pour ads et croissance', pct:0.10, couleur:'var(--blu)' },
  { id:'salaire',   label:'Salaire pro fixe', desc:'Te verser un salaire fixe dès 3 000 € encaissés/mois', seuil:3000, couleur:'var(--mut)' },
];

function CoachFinancier({ finances }) {
  const now = new Date();
  const moisStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  const mois = finances.filter(f => f.date >= moisStart);
  const entreesPro = mois.filter(f=>f.type==='entree'&&f.categorie==='pro').reduce((s,f)=>s+f.montant,0);
  const sortiesPro = mois.filter(f=>f.type==='sortie'&&f.categorie==='pro').reduce((s,f)=>s+f.montant,0);

  const [chatOpen, setChatOpen] = useState(false);
  const [chatMsgs, setChatMsgs] = useState([]);
  const [chatInput, setChatInput] = useState('');
  const [chatLoading, setChatLoading] = useState(false);
  const [recPhase, setRecPhase] = useState('idle'); // idle | recording | processing
  const [recErr, setRecErr] = useState('');
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);

  const startRec = async () => {
    setRecErr('');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const recorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4' });
      chunksRef.current = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      recorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); processRecAudio(recorder.mimeType); };
      recorderRef.current = recorder;
      recorder.start(250);
      setRecPhase('recording');
    } catch {
      setRecErr("Accès micro refusé — autorise le micro dans les paramètres du navigateur.");
    }
  };

  const stopRec = () => {
    if (recorderRef.current?.state === 'recording') {
      recorderRef.current.stop();
      setRecPhase('processing');
    }
  };

  const processRecAudio = async (mimeType) => {
    try {
      const blob = new Blob(chunksRef.current, { type: mimeType });
      if (blob.size < 1000) { setRecPhase('idle'); setRecErr('Enregistrement trop court — maintiens et parle.'); return; }
      const audio_b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onloadend = () => res(r.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(blob);
      });
      const { data, error } = await SB.functions.invoke('process-dump-pilotage', { body: { audio_b64, audio_type: mimeType } });
      if (error || data?.error) { setRecPhase('idle'); setRecErr(data?.error || 'Erreur de traitement'); return; }
      const transcript = (data.transcript || '').trim();
      if (transcript) setChatInput(prev => prev ? prev + ' ' + transcript : transcript);
      setRecPhase('idle');
    } catch { setRecPhase('idle'); setRecErr('Erreur réseau'); }
  };

  const sendToRoland = async () => {
    const txt = chatInput.trim();
    if (!txt || chatLoading) return;
    setChatInput('');
    const isFirst = chatMsgs.length === 0;
    const contexte = isFirst
      ? `Contexte chiffré du mois : ${fmt(entreesPro)} encaissé (pro), ${fmt(sortiesPro)} de sorties (pro).\n\n${txt}`
      : txt;
    const newMsgs = [...chatMsgs, { from:'me', text: txt }];
    setChatMsgs(newMsgs);
    setChatLoading(true);
    try {
      const { data, error } = await SB.functions.invoke('chat-assistant', {
        body: { assistant_id: 'roland', messages: [...newMsgs.slice(0,-1), { from:'me', text: contexte }] },
      });
      const reply = (!error && data?.reply) ? data.reply : "Petit souci de connexion, réessaie.";
      setChatMsgs(prev => [...prev, { from:'roland', text: reply }]);
    } catch { setChatMsgs(prev => [...prev, { from:'roland', text: "Petit souci de connexion, réessaie." }]); }
    setChatLoading(false);
  };

  const diagnostics = [];
  if (entreesPro > 0) {
    const epargne = entreesPro * 0.20;
    diagnostics.push({ ok: sortiesPro < entreesPro * 0.80, label:'Épargne 20%', msg: `Mettre ${fmt(epargne)} de côté ce mois`, couleur:'var(--grn)' });
    diagnostics.push({ ok: sortiesPro <= 110, label:'Charges stack', msg: sortiesPro <= 110 ? `Charges dans les clous (${fmt(sortiesPro)})` : `Dépassement : ${fmt(sortiesPro)} > 110 €`, couleur:'var(--acc)' });
    diagnostics.push({ ok: entreesPro >= 3000, label:'Seuil salaire fixe', msg: entreesPro >= 3000 ? 'Seuil atteint — verse-toi un salaire' : `Il manque ${fmt(3000-entreesPro)} pour le seuil`, couleur:'var(--mut)' });
    diagnostics.push({ ok: true, label:'Réinvestissement', msg: `Prévoir ${fmt(entreesPro*0.10)} pour les Meta Ads ce mois`, couleur:'var(--blu)' });
  }

  return (
    <div style={{ background:'rgba(238,124,31,.06)', border:'1.5px solid rgba(238,124,31,.2)', borderLeft:'4px solid var(--acc)', borderRadius:12, overflow:'hidden' }}>
      <div style={{ padding:'11px 14px 10px', borderBottom:'1px solid rgba(238,124,31,.15)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <Ic name="compass" size={14} color="var(--acc)" />
          <span style={{ fontSize:10, fontWeight:800, letterSpacing:'1.2px', textTransform:'uppercase', color:'var(--acc)' }}>Coach Financier</span>
        </div>
      </div>
      {entreesPro === 0 ? (
        <div style={{ padding:'14px 14px', fontSize:12, color:'var(--ink2)', lineHeight:1.6 }}>
          Enregistre tes premières entrées pro ce mois pour recevoir ton diagnostic personnalisé.
        </div>
      ) : (
        <div style={{ padding:'6px 0' }}>
          {diagnostics.map((d, i) => (
            <div key={i} style={{ padding:'10px 14px', borderBottom:i<diagnostics.length-1?'1px solid rgba(238,124,31,.1)':'none', display:'flex', gap:10, alignItems:'flex-start' }}>
              <div style={{ width:18, height:18, borderRadius:6, flexShrink:0, marginTop:1, display:'flex', alignItems:'center', justifyContent:'center',
                background: d.ok?'var(--grn-s)':'var(--red-s)' }}>
                {d.ok
                  ? <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="var(--grn)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  : <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="var(--red)" strokeWidth="2" strokeLinecap="round"/></svg>
                }
              </div>
              <div className="col g3">
                <span style={{ fontSize:11, fontWeight:800, color:d.couleur }}>{d.label}</span>
                <span style={{ fontSize:11.5, color:'var(--ink2)', lineHeight:1.4 }}>{d.msg}</span>
              </div>
            </div>
          ))}
        </div>
      )}
      <div style={{ padding:'10px 14px', borderTop:'1px solid rgba(238,124,31,.15)' }}>
        <button onClick={() => setChatOpen(o => !o)}
          style={{ width:'100%', minHeight:36, borderRadius:9, border:'1.5px solid var(--acc)', background: chatOpen ? 'var(--acc)' : 'var(--acc-s)', color: chatOpen ? '#fff' : 'var(--acc)', fontWeight:800, fontSize:11.5, cursor:'pointer', fontFamily:'inherit' }}>
          {chatOpen ? 'Fermer la discussion' : 'Discuter avec Roland (donner des détails)'}
        </button>
        {chatOpen && (
          <div style={{ marginTop:10 }}>
            {chatMsgs.length === 0 && (
              <div className="t-xs mut" style={{ marginBottom:8, fontStyle:'italic' }}>Donne un détail (une dépense exceptionnelle, un projet d'investissement…) — Roland réagit avec le contexte du mois.</div>
            )}
            <div className="col g8" style={{ marginBottom:8, maxHeight:220, overflowY:'auto' }}>
              {chatMsgs.map((m,i) => (
                <div key={i} style={{ alignSelf: m.from==='me' ? 'flex-end' : 'flex-start', maxWidth:'85%',
                  background: m.from==='me' ? 'var(--acc)' : 'var(--card)', color: m.from==='me' ? '#fff' : 'var(--ink)',
                  border: m.from==='me' ? 'none' : '1px solid var(--bdr)', borderRadius:10, padding:'8px 11px', fontSize:12, lineHeight:1.5 }}>
                  {m.text}
                </div>
              ))}
              {chatLoading && <div className="t-xs mut">Roland réfléchit…</div>}
            </div>
            {recPhase === 'recording' && (
              <div className="t-xs mut" style={{ marginBottom:6, textAlign:'center' }}>Parle, puis touche à nouveau le micro pour arrêter…</div>
            )}
            {recErr && <div className="t-xs" style={{ color:'var(--red)', marginBottom:6, textAlign:'center' }}>{recErr}</div>}
            <div className="row g6">
              <button onClick={recPhase === 'recording' ? stopRec : startRec} disabled={recPhase === 'processing'}
                title="Décharge vocale — parler à Roland"
                style={{ width:38, height:38, flexShrink:0, borderRadius:9, border:'none', cursor: recPhase === 'processing' ? 'default' : 'pointer',
                  background: recPhase === 'recording' ? 'var(--red)' : 'var(--acc-s)',
                  color: recPhase === 'recording' ? '#fff' : 'var(--acc)',
                  display:'flex', alignItems:'center', justifyContent:'center', opacity: recPhase === 'processing' ? .6 : 1 }}>
                {recPhase === 'recording'
                  ? <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                  : <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
                }
              </button>
              <input value={chatInput} onChange={e=>setChatInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') sendToRoland(); }}
                placeholder={recPhase === 'processing' ? 'Transcription en cours…' : "Ex : j'ai eu une grosse dépense imprévue ce mois…"}
                style={{ ...iStyle, flex:1, padding:'9px 12px', fontSize:12.5 }} />
              <button onClick={sendToRoland} disabled={chatLoading}
                style={{ minHeight:38, padding:'0 14px', borderRadius:9, border:'none', background:'var(--acc)', color:'#fff', fontWeight:800, fontSize:12, cursor: chatLoading ? 'default':'pointer', fontFamily:'inherit', opacity: chatLoading ? .6 : 1 }}>
                →
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

      SB.from('pilotage_focus').select('*').order('ordre'),
      SB.from('pilotage_pipeline').select('*, source, wa_draft').order('priorite'),
      SB.from('pilotage_projets').select('*').order('priorite'),
      SB.from('pilotage_finances').select('*').order('date', { ascending: false }),
      SB.from('pilotage_enveloppes').select('*').order('priorite'),
      SB.from('pilotage_charges').select('*').order('ordre'),
    ]).then(([capR, focusR, pipeR, projR, finR, envR, chgR]) => {
      if (capR.data)   setCap(capR.data);
      if (focusR.data) setFocus(focusR.data);
      if (pipeR.data)  setPipeline(pipeR.data);
      if (projR.data)  setProjets(projR.data);
      if (finR.data)   setFinances(finR.data);
      if (envR.data)   setEnveloppes(envR.data);
      if (chgR.data)   setCharges(chgR.data);
      setLoading(false);
      document.getElementById('boot')?.remove();
    });
  }, []);

  /* Focus handlers */
  const handleFocusToggle = async (item) => {
    const updated = !item.done;
    setFocus(prev => prev.map(f => f.id === item.id ? { ...f, done: updated } : f));
    const { ok } = await saveField('pilotage_focus', item.id, { done: updated });
    if (!ok) { setFocus(prev => prev.map(f => f.id === item.id ? { ...f, done: item.done } : f)); showError('Non enregistré, réessaie'); }
  };
  const handleFocusEdit = async (item, val) => {
    setFocus(prev => prev.map(f => f.id === item.id ? { ...f, description: val } : f));
    const { ok } = await saveField('pilotage_focus', item.id, { description: val });
    if (!ok) { setFocus(prev => prev.map(f => f.id === item.id ? { ...f, description: item.description } : f)); showError('Non enregistré, réessaie'); }
  };

  /* Pipeline handlers */
  const handlePipeProchaine = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, prochaine: val } : p));
    const { ok } = await saveField('pilotage_pipeline', d.id, { prochaine: val });
    if (!ok) { setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, prochaine: d.prochaine } : p)); showError('Non enregistré, réessaie'); }
  };
  const handlePipeStatut = async (d, statut, statut_color) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, statut, statut_color } : p));
    const { ok } = await saveField('pilotage_pipeline', d.id, { statut, statut_color });
    if (!ok) { setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, statut: d.statut, statut_color: d.statut_color } : p)); showError('Non enregistré, réessaie'); }
  };
  const handlePipeContact = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, contact: val } : p));
    const { ok } = await saveField('pilotage_pipeline', d.id, { contact: val });
    if (!ok) { setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, contact: d.contact } : p)); showError('Non enregistré, réessaie'); }
  };
  const handlePipeSetup = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, setup: val } : p));
    const { ok } = await saveField('pilotage_pipeline', d.id, { setup: val });
    if (!ok) { setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, setup: d.setup } : p)); showError('Non enregistré, réessaie'); }
  };
  const handlePipeMensuel = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, mensuel: val } : p));
    const { ok } = await saveField('pilotage_pipeline', d.id, { mensuel: val });
    if (!ok) { setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, mensuel: d.mensuel } : p)); showError('Non enregistré, réessaie'); }
  };
  const handlePipeAdd = (newDossier) => {
    setPipeline(prev => [newDossier, ...prev]);
  };
  // Handler générique pour les champs simples (nom, activité, besoin, famille, zone)
  const handlePipeField = async (d, field, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, [field]: val } : p));
    const { ok } = await saveField('pilotage_pipeline', d.id, { [field]: val });
    if (!ok) { setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, [field]: d[field] } : p)); showError('Non enregistré, réessaie'); }
  };

  /* Projets handlers */
  const handleProjetProchaine = async (p, val) => {
    setProjets(prev => prev.map(pr => pr.id === p.id ? { ...pr, prochaine_action: val } : pr));
    const { ok } = await saveField('pilotage_projets', p.id, { prochaine_action: val });
    if (!ok) { setProjets(prev => prev.map(pr => pr.id === p.id ? { ...pr, prochaine_action: p.prochaine_action } : pr)); showError('Non enregistré, réessaie'); }
  };

  /* Finance handlers */
  const handleFinanceAdd = (entry) => {
    setFinances(prev => [entry, ...prev]);
  };
  const handleFinanceEdit = (updated) => {
    setFinances(prev => prev.map(f => f.id === updated.id ? updated : f));
  };
  const handleFinanceDelete = (id) => {
    setFinances(prev => prev.filter(f => f.id !== id));
  };

  /* Enveloppes handlers */
  const handleEnveloppeUpdate = (updated) => {
    setEnveloppes(prev => prev.map(e => e.id === updated.id ? updated : e));
  };

  /* Charges handlers */
  const handleChargeAdd = (c) => {
    setCharges(prev => [...prev, c]);
  };
  const handleChargeEdit = (updated) => {
    setCharges(prev => prev.map(c => c.id === updated.id ? updated : c));
  };
  const handleChargeDelete = (id) => {
    setCharges(prev => prev.filter(c => c.id !== id));
  };

  const heure = new Date().getHours();
  const salut = heure < 12 ? 'Bonjour' : heure < 18 ? 'Bon après-midi' : 'Bonsoir';

  if (loading) return null;

  return (
    <div className="app">
      <div className="hdr">
        <div className="hdr-left">
          <div className="label">Mr Attractor · Pilotage</div>
          <div className="title">{salut}, Mac Arthur</div>
        </div>
        <div className="hdr-right">{TODAY}</div>
      </div>

      <div className="tabs">
        {TABS.map(t => (
          <button key={t.id} className={'tab'+(tab===t.id?' on':'')} onClick={() => setTab(t.id)}>{t.label}</button>
        ))}
      </div>

      <div className="content">
        {tab === 'today'    && <TabAujourdHui cap={cap} focus={focus} finances={finances} onCapChange={setCap} onFocusToggle={handleFocusToggle} onFocusEdit={handleFocusEdit} onGoFinance={() => setTab('finance')} onError={showError} />}
        {tab === 'pipeline' && <TabPipeline pipeline={pipeline} onEditProchaine={handlePipeProchaine} onEditStatut={handlePipeStatut} onEditContact={handlePipeContact} onEditSetup={handlePipeSetup} onEditMensuel={handlePipeMensuel} onAddProspect={handlePipeAdd} onEditField={handlePipeField} />}
        {tab === 'plan'     && <TabPlan />}
        {tab === 'projets'  && <TabProjets projets={projets} onEditProchaine={handleProjetProchaine} />}
        {tab === 'finance'  && <TabFinance finances={finances} enveloppes={enveloppes} charges={charges} onAdd={handleFinanceAdd} onEditEntry={handleFinanceEdit} onDeleteEntry={handleFinanceDelete} onUpdateEnveloppe={handleEnveloppeUpdate} onAddCharge={handleChargeAdd} onEditCharge={handleChargeEdit} onDeleteCharge={handleChargeDelete} />}
        {tab === 'demos'    && <TabDemos />}
      </div>
      <Toast message={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
