/* ── EDITABLE FIELD (contentEditable, pas de layout shift) */
function EditField({ value, onSave, style }) {
  const ref = useRef();
  useEffect(() => {
    if (ref.current && ref.current !== document.activeElement) {
      ref.current.innerText = value || '';
    }
  }, [value]);

  const save = () => {
    const txt = (ref.current?.innerText || '').trim();
    if (txt && txt !== value) onSave(txt);
    else if (ref.current) ref.current.innerText = value || '';
  };

  return (
    <span
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      data-ph="Cliquer pour modifier…"
      onBlur={save}
      onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); ref.current?.blur(); } if (e.key === 'Escape') { if (ref.current) ref.current.innerText = value || ''; ref.current?.blur(); } }}
      style={{ ...style, cursor:'text', borderBottom:'1px dashed rgba(0,0,0,.15)', paddingBottom:1, display:'block', width:'100%', maxWidth:'100%', minWidth:0, overflowWrap:'break-word', wordBreak:'break-word' }}
    />
  );
}

function StatutBadge({ statut, statut_color, onEdit }) {
  const [open, setOpen] = useState(false);

    return () => document.removeEventListener('mousedown', h);

  const handleSelect = (opt) => {
    setOpen(false);
    const rules = SOP_VALIDATION[opt.label];
    if (!rules) { onEdit(opt.label, opt.color); return; }
    setValidating({ label: opt.label, color: opt.color, titre: rules.titre, checks: rules.checks, done: [] });
  };

  const toggle = (i) => setValidating(v => ({
    ...v, done: v.done.includes(i) ? v.done.filter(x=>x!==i) : [...v.done, i]
  }));

  const confirm = () => { if (validating) { onEdit(validating.label, validating.color); setValidating(null); } };

  const allDone = validating && validating.done.length === validating.checks.length;

  return (
    <div ref={ref} style={{ position:'relative', flexShrink:0 }}>
      <span className={'badge '+(statut_color||'neu')} style={{ cursor:'pointer', userSelect:'none' }} onClick={() => setOpen(o => !o)}>

            <div key={opt.label}
              onClick={() => handleSelect(opt)}
              style={{ padding:'7px 10px', borderRadius:8, cursor:'pointer', display:'flex', alignItems:'center', gap:8, fontSize:12, fontWeight:600, color: statut === opt.label ? 'var(--ink)' : 'var(--ink2)', background: statut === opt.label ? 'rgba(0,0,0,.05)' : 'transparent' }}>
              <span className={'badge '+opt.color} style={{ padding:'2px 6px', fontSize:10, pointerEvents:'none' }}><span className="dot" /></span>
              {opt.label}
              {SOP_VALIDATION[opt.label] && <span style={{ marginLeft:'auto', fontSize:9, color:'var(--acc)', fontWeight:800, opacity:.7 }}>SOP</span>}
            </div>
          ))}
        </div>
      )}

      {validating && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.82)', zIndex:300, display:'flex', alignItems:'flex-end', justifyContent:'center' }}
          onClick={e => { if (e.target === e.currentTarget) setValidating(null); }}>
          <div style={{ width:'100%', maxWidth:520, background:'var(--card)', borderRadius:'18px 18px 0 0', maxHeight:'90vh', display:'flex', flexDirection:'column' }}>

            {/* En-tête fixe */}
            <div style={{ padding:'20px 20px 0', flexShrink:0 }}>
              <div style={{ width:36, height:4, borderRadius:2, background:'var(--bdr)', margin:'0 auto 18px' }} />
              <div style={{ fontSize:10, fontWeight:800, color:'var(--acc)', letterSpacing:'1.2px', textTransform:'uppercase', marginBottom:5 }}>Validation SOP requise</div>
              <div style={{ fontSize:17, fontWeight:800, color:'var(--ink)', marginBottom:4 }}>{validating.titre}</div>
              <div style={{ fontSize:12, color:'var(--mut)', paddingBottom:14, borderBottom:'1px solid var(--bdr)' }}>Coche chaque point pour débloquer la confirmation</div>
            </div>

            {/* Cases à cocher — scrollable */}
            <div style={{ flex:1, minHeight:0, overflowY:'auto', padding:'0 20px', WebkitOverflowScrolling:'touch' }}>
              {validating.checks.map((check, i) => (
                <div key={i} onClick={() => toggle(i)}
                  style={{ display:'flex', gap:14, alignItems:'flex-start', padding:'14px 0', borderBottom:'1px solid var(--bdr)', cursor:'pointer' }}>
                  <div style={{ width:24, height:24, minWidth:24, minHeight:24, borderRadius:8, marginTop:1, flexShrink:0,
                    background: validating.done.includes(i) ? 'var(--grn-s)' : 'rgba(0,0,0,.05)',
                    border: `2px solid ${validating.done.includes(i) ? 'var(--grn)' : 'var(--bdr)'}`,
                    display:'flex', alignItems:'center', justifyContent:'center', transition:'.15s' }}>
                    {validating.done.includes(i) && (

                    )}

/* ── FOCUS ITEM ───────────────────────────────────────── */
function FocusItem({ item, i, onToggle, onEdit }) {
  const tagColor = item.tag === 'Pipeline' ? 'var(--acc)' : 'var(--blu)';
  return (
    <div className="anim row g12" style={{ padding:'13px 0', borderBottom:'1px solid var(--bdr)', animationDelay:(i*60)+'ms', alignItems:'flex-start', opacity: item.done ? .45 : 1 }}>
      <div
        onClick={() => onToggle(item)}
        style={{ width:22, height:22, borderRadius:8, flexShrink:0, marginTop:2, cursor:'pointer',
          background: item.done ? 'var(--grn-s)' : item.urgent ? 'var(--red-s)' : 'rgba(0,0,0,.06)',
          display:'flex', alignItems:'center', justifyContent:'center' }}>
        {item.done
          ? <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="var(--grn)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          : <span style={{ width:6,height:6,borderRadius:50,background: item.urgent ? 'var(--red)' : 'var(--faint)' }} />
        }
      </div>
      <div className="col grow g4" style={{ minWidth:0 }}>
        <EditField
          value={item.description}
          onSave={v => onEdit(item, v)}
          style={{ fontSize:13, fontWeight:600, lineHeight:1.4, textDecoration: item.done ? 'line-through' : 'none', wordBreak:'break-word' }}
        />
        <span style={{ fontSize:10.5, fontWeight:700, color:tagColor }}>{item.tag}{item.urgent ? ' · URGENT' : ''}</span>
      </div>
    </div>
  );
}

/* ── FINANCE SUMMARY MINI (dashboard) ────────────────────── */
function FinanceSummaryMini({ finances, onGoFinance }) {
  const now = new Date();
  const moisStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  const mois = finances.filter(f => f.date >= moisStart);
  const entreesPro   = mois.filter(f=>f.type==='entree'&&f.categorie==='pro').reduce((s,f)=>s+f.montant,0);
  const entreesPerso = mois.filter(f=>f.type==='entree'&&f.categorie==='perso').reduce((s,f)=>s+f.montant,0);
  const sorties      = mois.filter(f=>f.type==='sortie').reduce((s,f)=>s+f.montant,0);
  const pct = Math.min(100, Math.round((entreesPro/10000)*100));
  return (
    <div className="card" onClick={onGoFinance} style={{ padding:'14px 16px', cursor:'pointer', userSelect:'none' }}>
      <div className="row between" style={{ marginBottom:10, alignItems:'center' }}>
        <div className="sect-label" style={{ margin:0 }}>Finances ce mois</div>
        <span style={{ fontSize:10, color:'var(--acc)', fontWeight:700 }}>Voir détail →</span>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginBottom:10 }}>
        <div className="col g3">
          <span className="t-xs mut">Pro encaissé</span>
          <span className="b num" style={{ fontSize:13, color:'var(--grn)' }}>+{fmt(entreesPro)}</span>
        </div>
        <div className="col g3">
          <span className="t-xs mut">Perso</span>
          <span className="b num" style={{ fontSize:13, color:'var(--blu)' }}>+{fmt(entreesPerso)}</span>
        </div>
        <div className="col g3">
          <span className="t-xs mut">Sorties</span>
          <span className="b num" style={{ fontSize:13, color:'var(--red)' }}>-{fmt(sorties)}</span>
        </div>
      </div>
      <div style={{ height:5, borderRadius:100, background:'rgba(0,0,0,.07)', overflow:'hidden' }}>
        <div style={{ height:'100%', width:pct+'%', background:'var(--grn)', borderRadius:100, transition:'.6s' }} />
      </div>
      <div className="t-xs mut" style={{ marginTop:4 }}>{pct}% de l'objectif 10 000 € encaissé (pro)</div>
    </div>
  );
}

function TabAujourdHui({ cap, focus, finances, onCapChange, onFocusToggle, onFocusEdit, onGoFinance }) {
  return (

}

/* ── NOUVEAU PROSPECT MODAL ───────────────────────────── */
function NouveauProspectModal({ onConfirm, onCancel }) {
  const [nom, setNom] = useState('');
  const [wa, setWa] = useState('');
  const [activite, setActivite] = useState('');
  const [famille, setFamille] = useState('');
  const [zone, setZone] = useState('');
  const [saving, setSaving] = useState(false);
  const valid = nom.trim() && famille && zone;

  const handleSave = async () => {
    if (!valid || saving) return;
    setSaving(true);
    const { data, error } = await SB.from('pilotage_pipeline').insert({
      nom: nom.trim(),
      contact: wa.trim() || null,
      activite: activite.trim() || null,
      famille,
      zone,
      type: famille === 'A' ? 'App Métier' : famille === 'B' ? 'Consulting' : 'SaaS / Assists',
      statut: 'En contact',
      statut_color: 'neu',
      prochaine: famille === 'A' ? 'Préparer maquette → caler présentation directe' : 'Brief découverte 30 min',
      date_action: new Date().toLocaleDateString('fr-FR'),
      priorite: 99,
      urgent: false,
    }).select().single();
    setSaving(false);
    if (!error && data) onConfirm(data);
  };

  const famOptions = [['A','App Métier'],['B','Consulting'],['C','SaaS / Assists']];
  const zoneOptions = ['CI', 'France', 'International'];

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.85)', zIndex:300, display:'flex', alignItems:'flex-end', justifyContent:'center' }}
      onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div style={{ width:'100%', maxWidth:520, background:'var(--card)', borderRadius:'18px 18px 0 0', padding:'24px 20px 48px' }}>
        <div style={{ width:36, height:4, borderRadius:2, background:'var(--bdr)', margin:'0 auto 22px' }} />
        <div style={{ fontSize:17, fontWeight:800, color:'var(--ink)', marginBottom:18 }}>Nouveau prospect</div>

        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>Nom / Prénom *</div>
          <input value={nom} onChange={e=>setNom(e.target.value)} placeholder="Ex: Andréa Koné, Club Élévia…" style={iStyle} />
        </div>
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>Activité</div>
          <input value={activite} onChange={e=>setActivite(e.target.value)} placeholder="Ex: livraison express, réseau B2B…" style={iStyle} />
        </div>
        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>WhatsApp</div>
          <input value={wa} onChange={e=>setWa(e.target.value)} placeholder="+33 6… ou +225 07…" style={iStyle} />
        </div>

        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:8 }}>Famille *</div>
          <div style={{ display:'flex', gap:8 }}>
            {famOptions.map(([f, label]) => (
              <div key={f} onClick={() => setFamille(f)}
                style={{ flex:1, padding:'10px 6px', borderRadius:10, textAlign:'center', cursor:'pointer',
                  border:`1.5px solid ${famille===f ? 'var(--acc)' : 'var(--bdr)'}`,
                  background: famille===f ? 'var(--acc-s)' : 'transparent', transition:'.15s' }}>
                <div style={{ fontWeight:800, fontSize:15, color: famille===f ? 'var(--acc)' : 'var(--ink)', marginBottom:2 }}>Fam. {f}</div>
                <div style={{ fontSize:10, color:'var(--mut)', fontWeight:600 }}>{label}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ marginBottom:22 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:8 }}>Zone *</div>
          <div style={{ display:'flex', gap:8 }}>
            {zoneOptions.map(z => (
              <div key={z} onClick={() => setZone(z)}
                style={{ flex:1, padding:'10px 6px', borderRadius:10, textAlign:'center', cursor:'pointer', fontSize:12, fontWeight:700,
                  border:`1.5px solid ${zone===z ? 'var(--acc)' : 'var(--bdr)'}`,
                  background: zone===z ? 'var(--acc-s)' : 'transparent',
                  color: zone===z ? 'var(--acc)' : 'var(--mut)', transition:'.15s' }}>
                {z}
              </div>
            ))}
          </div>
        </div>

        <div style={{ display:'flex', gap:10 }}>
          <button onClick={onCancel}
            style={{ flex:1, minHeight:44, padding:'0 13px', borderRadius:12, border:'1.5px solid var(--bdr)', background:'transparent', color:'var(--mut)', fontWeight:700, fontSize:13, cursor:'pointer', fontFamily:'inherit' }}>
            Annuler
          </button>
          <button onClick={handleSave} disabled={!valid || saving}
            style={{ flex:2, minHeight:44, padding:'0 13px', borderRadius:12, border:'none',
              background: valid ? 'var(--acc)' : 'rgba(0,0,0,.06)',
              color: valid ? '#fff' : 'var(--faint)',
              fontWeight:800, fontSize:13, cursor: valid ? 'pointer' : 'not-allowed', fontFamily:'inherit', transition:'.2s' }}>
            {saving ? 'Création…' : 'Créer le dossier →'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── ALIMENTER MODAL ─────────────────────────────────── */
function AlimenterModal({ env, onConfirm, onCancel }) {
  const [montant, setMontant] = useState('');
  const [saving, setSaving]   = useState(false);
  const val = montant && parseFloat(montant) > 0;

  const save = async () => {
    if (!val || saving) return;
    setSaving(true);
    const newEpargne = (env.epargne || 0) + parseFloat(montant);
    const { error } = await SB.from('pilotage_enveloppes').update({ epargne: newEpargne }).eq('id', env.id);
    setSaving(false);
    if (!error) onConfirm({ ...env, epargne: newEpargne });
  };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.85)', zIndex:300, display:'flex', alignItems:'flex-end', justifyContent:'center' }}
      onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div style={{ width:'100%', maxWidth:520, background:'var(--card)', borderRadius:'18px 18px 0 0', padding:'24px 20px 48px' }}>
        <div style={{ width:36, height:4, borderRadius:2, background:'var(--bdr)', margin:'0 auto 20px' }} />
        <div style={{ fontSize:15, fontWeight:800, color:'var(--ink)', marginBottom:3 }}>Alimenter l'enveloppe</div>
        <div style={{ fontSize:12, color:'var(--mut)', marginBottom:20 }}>{env.nom} · {fmt(env.epargne || 0)} / {fmt(env.cible)}</div>
        <div style={{ marginBottom:20 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>Montant à ajouter €</div>
          <input value={montant} onChange={e => setMontant(e.target.value.replace(/[^0-9.]/g,''))}
            inputMode="decimal" placeholder="0.00" style={iStyle} autoFocus />
        </div>
        <div style={{ display:'flex', gap:10 }}>
          <button onClick={onCancel} style={{ flex:1, minHeight:44, borderRadius:12, border:'1.5px solid var(--bdr)', background:'transparent', color:'var(--mut)', fontWeight:700, fontSize:13, cursor:'pointer', fontFamily:'inherit' }}>Annuler</button>
          <button onClick={save} disabled={!val||saving}
            style={{ flex:2, minHeight:44, borderRadius:12, border:'none',
              background:val?'var(--grn)':'rgba(0,0,0,.06)',
              color:val?'#fff':'var(--faint)',
              fontWeight:800, fontSize:13, cursor:val?'pointer':'not-allowed', fontFamily:'inherit', transition:'.2s' }}>
            {saving ? 'Enregistrement…' : val ? '+'+fmt(parseFloat(montant))+' →' : 'Saisir un montant'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── ENVELOPPE CARD ──────────────────────────────────── */

  const epargne = env.epargne || 0;
  const pct     = Math.min(100, Math.round((epargne / env.cible) * 100));
  const reste   = env.cible - epargne;
  const barCol  = pct >= 75 ? 'var(--grn)' : pct >= 40 ? 'var(--acc)' : 'var(--red)';
  const hzLabel = env.horizon === 'court' ? 'Court terme' : env.horizon === 'moyen' ? 'Moyen terme' : 'Long terme';
  const hzBadge = env.horizon === 'court' ? 'org' : env.horizon === 'moyen' ? 'blu' : 'neu';

  return (
    <div style={{ padding:'14px 16px', borderBottom:'1px solid var(--bdr)' }}>
      <div className="row between" style={{ marginBottom:8, alignItems:'flex-start' }}>
        <div className="col g3 grow" style={{ minWidth:0 }}>
          <span className="b truncate" style={{ fontSize:13 }}>{env.nom}</span>
          {env.description && <span className="t-xs mut truncate">{env.description}</span>}
        </div>
        <div style={{ display:'flex', gap:4, flexShrink:0, marginLeft:8 }}>
          <span className={'badge '+(env.categorie==='pro'?'blu':'grn')} style={{ fontSize:10, padding:'2px 6px' }}>{env.categorie==='pro'?'Pro':'Perso'}</span>
          <span className={'badge '+hzBadge} style={{ fontSize:10, padding:'2px 6px' }}>{hzLabel}</span>
        </div>
      </div>
      <div style={{ marginBottom:8 }}>
        <div className="row between" style={{ marginBottom:5 }}>
          <span className="b num" style={{ fontSize:14, color:barCol }}>{fmt(epargne)}</span>
          <span className="t-xs mut">sur {fmt(env.cible)} · reste {fmt(reste)}</span>
        </div>
        <div style={{ height:7, borderRadius:100, background:'rgba(0,0,0,.07)', overflow:'hidden' }}>
          <div style={{ height:'100%', width:pct+'%', background:barCol, borderRadius:100, transition:'.5s' }} />
        </div>
      </div>
      <div className="row between" style={{ alignItems:'center' }}>
        <span style={{ fontSize:11, fontWeight:700, color:barCol }}>{pct}% constitué</span>
        <button onClick={() => onAlimenter(env)}
          style={{ minHeight:36, padding:'0 14px', borderRadius:9, border:'none',
            background:'var(--grn-s)', color:'var(--grn)', fontWeight:800, fontSize:12, cursor:'pointer', fontFamily:'inherit' }}>
          + Alimenter
        </button>
      </div>
    </div>
  );
}

/* ── ENVELOPPES SECTION ──────────────────────────────── */
function EnveloppesSection({ enveloppes, onUpdateEnveloppe }) {
  const [alimenter, setAlimenter] = useState(null);

  const total_cible   = enveloppes.reduce((s,e) => s + e.cible, 0);
  const total_epargne = enveloppes.reduce((s,e) => s + (e.epargne||0), 0);
  const total_reste   = total_cible - total_epargne;
  const pct_global    = total_cible > 0 ? Math.min(100, Math.round((total_epargne/total_cible)*100)) : 0;

  return (
    <Fragment>
      <div className="card" style={{ overflow:'hidden' }}>
        <div style={{ padding:'14px 16px 12px', borderBottom:'1px solid var(--bdr)', background:'rgba(0,0,0,.02)' }}>
          <div className="row between" style={{ marginBottom:10, alignItems:'flex-start' }}>
            <div>
              <div className="sect-label" style={{ margin:0, marginBottom:3 }}>Enveloppes & Objectifs</div>
              <div className="t-xs mut">{enveloppes.length} objectifs · {fmt(total_reste)} restants</div>
            </div>
            <div className="col g3" style={{ alignItems:'flex-end' }}>
              <span className="t-xs mut">Déjà constitué</span>
              <span className="b num" style={{ fontSize:15, color:'var(--grn)' }}>{fmt(total_epargne)}</span>
            </div>
          </div>
          <div style={{ height:7, borderRadius:100, background:'rgba(0,0,0,.07)', overflow:'hidden', marginBottom:5 }}>
            <div style={{ height:'100%', width:pct_global+'%', background:'var(--grn)', borderRadius:100, transition:'.6s' }} />
          </div>
          <div className="t-xs mut">{pct_global}% de la suffisance financière · objectif total {fmt(total_cible)}</div>
        </div>
        {enveloppes.map((e,i) => (
          <EnveloppeCard key={e.id} env={e} onAlimenter={setAlimenter} />
        ))}
      </div>

      {alimenter && (
        <AlimenterModal
          env={alimenter}
          onConfirm={updated => { onUpdateEnveloppe(updated); setAlimenter(null); }}
          onCancel={() => setAlimenter(null)}
        />
      )}
    </Fragment>
  );
}

                  border:`1.5px solid ${cat===v?'var(--acc)':'var(--bdr)'}`,
                  background: cat===v?'var(--acc-s)':'transparent',
                  color: cat===v?'var(--acc)':'var(--mut)', transition:'.15s' }}>{l}</div>
            ))}
          </div>
        </div>

        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>Montant € *</div>
          <input value={montant} onChange={e => setMontant(e.target.value.replace(/[^0-9.]/g,''))}
            inputMode="decimal" placeholder="0.00" style={iStyle} />
        </div>

        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>Description *</div>
          <input value={desc} onChange={e => setDesc(e.target.value)}
            placeholder="Ex: Acompte Club Élévia, Salaire DGFiP juin…" style={iStyle} />
        </div>

        <div style={{ marginBottom:22 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:6 }}>Date</div>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} style={iStyle} />
        </div>

        <div style={{ display:'flex', gap:10 }}>
          <button onClick={onCancel}
            style={{ flex:1, minHeight:44, borderRadius:12, border:'1.5px solid var(--bdr)', background:'transparent', color:'var(--mut)', fontWeight:700, fontSize:13, cursor:'pointer', fontFamily:'inherit' }}>
            Annuler
          </button>
          <button onClick={save} disabled={!valid||saving}
            style={{ flex:2, minHeight:44, borderRadius:12, border:'none',
              background: valid?'var(--acc)':'rgba(0,0,0,.06)',
              color: valid?'#fff':'var(--faint)',
              fontWeight:800, fontSize:13, cursor:valid?'pointer':'not-allowed', fontFamily:'inherit', transition:'.2s' }}>
            {saving ? 'Enregistrement…' : 'Enregistrer →'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── COACH FINANCIER ──────────────────────────────────── */
const REGLES_COACH = [
  { id:'epargne',   label:'Épargne de sécurité', desc:'Mettre de côté 20% de chaque encaissement pro', pct:0.20, couleur:'var(--grn)' },
  { id:'charges',   label:'Charges stack', desc:'Stack outils (Claude Max, API, GoDaddy…) = 110 €/mois max', plafond:110, couleur:'var(--acc)' },
  { id:'reinvest',  label:'Réinvestissement', desc:'10% des encaissements pro pour ads et croissance', pct:0.10, couleur:'var(--blu)' },
  { id:'salaire',   label:'Salaire pro fixe', desc:'Te verser un salaire fixe dès 3 000 € encaissés/mois', seuil:3000, couleur:'var(--mut)' },
];

function CoachFinancier({ finances }) {
  const now = new Date();
  const moisStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  const mois = finances.filter(f => f.date >= moisStart);
  const entreesPro = mois.filter(f=>f.type==='entree'&&f.categorie==='pro').reduce((s,f)=>s+f.montant,0);
  const sortiesPro = mois.filter(f=>f.type==='sortie'&&f.categorie==='pro').reduce((s,f)=>s+f.montant,0);

  const diagnostics = [];
  if (entreesPro > 0) {
    const epargne = entreesPro * 0.20;
    diagnostics.push({ ok: sortiesPro < entreesPro * 0.80, label:'Épargne 20%', msg: `Mettre ${fmt(epargne)} de côté ce mois`, couleur:'var(--grn)' });
    diagnostics.push({ ok: sortiesPro <= 110, label:'Charges stack', msg: sortiesPro <= 110 ? `Charges dans les clous (${fmt(sortiesPro)})` : `Dépassement : ${fmt(sortiesPro)} > 110 €`, couleur:'var(--acc)' });
    diagnostics.push({ ok: entreesPro >= 3000, label:'Seuil salaire fixe', msg: entreesPro >= 3000 ? 'Seuil atteint — verse-toi un salaire' : `Il manque ${fmt(3000-entreesPro)} pour le seuil`, couleur:'var(--mut)' });
    diagnostics.push({ ok: true, label:'Réinvestissement', msg: `Prévoir ${fmt(entreesPro*0.10)} pour les Meta Ads ce mois`, couleur:'var(--blu)' });
  }

  return (
    <div style={{ background:'rgba(238,124,31,.06)', border:'1.5px solid rgba(238,124,31,.2)', borderRadius:12, overflow:'hidden' }}>
      <div style={{ padding:'11px 14px 10px', borderBottom:'1px solid rgba(238,124,31,.15)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="var(--acc)" strokeWidth="1.5"/><path d="M8 5v4M8 11v.5" stroke="var(--acc)" strokeWidth="1.8" strokeLinecap="round"/></svg>
          <span style={{ fontSize:10, fontWeight:800, letterSpacing:'1.2px', textTransform:'uppercase', color:'var(--acc)' }}>Coach Financier</span>
        </div>
      </div>
      {entreesPro === 0 ? (
        <div style={{ padding:'14px 14px', fontSize:12, color:'var(--ink2)', lineHeight:1.6 }}>
          Enregistre tes premières entrées pro ce mois pour recevoir ton diagnostic personnalisé.
        </div>
      ) : (
        <div style={{ padding:'6px 0' }}>
          {diagnostics.map((d, i) => (
            <div key={i} style={{ padding:'10px 14px', borderBottom:i<diagnostics.length-1?'1px solid rgba(238,124,31,.1)':'none', display:'flex', gap:10, alignItems:'flex-start' }}>
              <div style={{ width:18, height:18, borderRadius:6, flexShrink:0, marginTop:1, display:'flex', alignItems:'center', justifyContent:'center',
                background: d.ok?'var(--grn-s)':'var(--red-s)' }}>
                {d.ok
                  ? <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="var(--grn)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  : <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="var(--red)" strokeWidth="2" strokeLinecap="round"/></svg>
                }
              </div>
              <div className="col g3">
                <span style={{ fontSize:11, fontWeight:800, color:d.couleur }}>{d.label}</span>
                <span style={{ fontSize:11.5, color:'var(--ink2)', lineHeight:1.4 }}>{d.msg}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── TAB FINANCE ──────────────────────────────────────── */
function TabFinance({ finances, enveloppes, onAdd, onUpdateEnveloppe }) {
  const [showModal, setShowModal] = useState(false);
  const [filter, setFilter]       = useState('all');

  const now = new Date();
  const moisLabel = now.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });
  const moisStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];

  const moisF = finances.filter(f => f.date >= moisStart);
  const entreesPro   = moisF.filter(f=>f.type==='entree'&&f.categorie==='pro').reduce((s,f)=>s+f.montant,0);
  const entreesPerso = moisF.filter(f=>f.type==='entree'&&f.categorie==='perso').reduce((s,f)=>s+f.montant,0);
  const sortiesPro   = moisF.filter(f=>f.type==='sortie'&&f.categorie==='pro').reduce((s,f)=>s+f.montant,0);
  const sortiesPerso = moisF.filter(f=>f.type==='sortie'&&f.categorie==='perso').reduce((s,f)=>s+f.montant,0);
  const soldePro   = entreesPro - sortiesPro;
  const soldePerso = entreesPerso - sortiesPerso;
  const pct = Math.min(100, Math.round((entreesPro/10000)*100));

  const displayed = finances.filter(f => filter === 'all' ? true : f.categorie === filter);
  const tColor = (f) => f.type==='entree'?'var(--grn)':'var(--red)';
  const tSign  = (f) => f.type==='entree'?'+':'-';

  return (
    <Fragment>
      {/* Recap mois */}
      <div className="card" style={{ padding:'16px 18px', background:'linear-gradient(135deg,#F2FFF6,#E8F8EC)', borderColor:'rgba(26,148,72,.2)' }}>
        <div style={{ fontSize:10, fontWeight:700, color:'var(--mut)', letterSpacing:'1.2px', textTransform:'uppercase', marginBottom:10 }}>
          {moisLabel}
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:14 }}>
          <div className="col g4">
            <span className="t-xs mut">Entrées pro</span>
            <span className="xb num" style={{ fontSize:17, color:'var(--grn)' }}>+{fmt(entreesPro)}</span>
          </div>
          <div className="col g4">
            <span className="t-xs mut">Entrées perso</span>
            <span className="xb num" style={{ fontSize:17, color:'var(--blu)' }}>+{fmt(entreesPerso)}</span>
          </div>
          <div className="col g4">
            <span className="t-xs mut">Sorties pro</span>
            <span className="xb num" style={{ fontSize:17, color:'var(--red)' }}>-{fmt(sortiesPro)}</span>
          </div>
          <div className="col g4">
            <span className="t-xs mut">Sorties perso</span>
            <span className="xb num" style={{ fontSize:17, color:'var(--red)' }}>-{fmt(sortiesPerso)}</span>
          </div>
        </div>
        <div style={{ height:1, background:'rgba(0,0,0,.07)', marginBottom:12 }} />
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12 }}>
          <div className="col g3">
            <span className="t-xs mut">Solde net pro</span>
            <span className="b num" style={{ fontSize:15, color:soldePro>=0?'var(--grn)':'var(--red)' }}>{soldePro>=0?'+':''}{fmt(soldePro)}</span>
          </div>
          <div className="col g3">
            <span className="t-xs mut">Solde net perso</span>
            <span className="b num" style={{ fontSize:15, color:soldePerso>=0?'var(--blu)':'var(--red)' }}>{soldePerso>=0?'+':''}{fmt(soldePerso)}</span>
          </div>
        </div>
        <div>
          <div className="row between" style={{ marginBottom:5 }}>
            <span className="t-xs mut">Objectif 10 000 €/mois</span>
            <span className="t-xs b" style={{ color:'var(--grn)' }}>{pct}%</span>
          </div>
          <div style={{ height:7, borderRadius:100, background:'rgba(0,0,0,.08)', overflow:'hidden' }}>
            <div style={{ height:'100%', width:pct+'%', background:'var(--grn)', borderRadius:100, transition:'.6s' }} />
          </div>
        </div>
      </div>

      {/* Enveloppes */}
      <EnveloppesSection enveloppes={enveloppes} onUpdateEnveloppe={onUpdateEnveloppe} />

      {/* Coach financier */}
      <CoachFinancier finances={finances} />

      {/* Filtres + bouton */}
      <div className="row between" style={{ alignItems:'center' }}>
        <div style={{ display:'flex', gap:6 }}>
          {[['all','Tout'],['pro','Pro'],['perso','Perso']].map(([v,l]) => (
            <button key={v} onClick={() => setFilter(v)}
              style={{ minHeight:36, padding:'0 14px', borderRadius:20, fontFamily:'inherit', cursor:'pointer',
                border:`1.5px solid ${filter===v?'var(--acc)':'var(--bdr)'}`,
                background: filter===v?'var(--acc)':'var(--card)',
                color: filter===v?'#fff':'var(--mut)', fontWeight:700, fontSize:12, transition:'.15s' }}>{l}</button>
          ))}
        </div>
        <button onClick={() => setShowModal(true)}
          style={{ display:'flex', alignItems:'center', gap:6, minHeight:44, padding:'0 14px', borderRadius:10, border:'none',
            background:'var(--acc)', color:'#fff', fontWeight:800, fontSize:12, cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap' }}>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          Ajouter
        </button>
      </div>

      {/* Liste */}
      <div className="card" style={{ padding:'4px 0', overflow:'hidden' }}>
        {displayed.length === 0 && (
          <div style={{ padding:'22px 16px', textAlign:'center', color:'var(--mut)', fontSize:13 }}>
            Aucune transaction enregistrée
          </div>
        )}
        {displayed.map((f, i) => (
          <div key={f.id} style={{ padding:'12px 16px', borderBottom:i<displayed.length-1?'1px solid var(--bdr)':'none', display:'flex', gap:12, alignItems:'center' }}>
            <div style={{ width:36, height:36, borderRadius:10, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center',
              background: f.type==='entree'?'var(--grn-s)':'var(--red-s)' }}>
              <span style={{ fontSize:17, fontWeight:900, color:tColor(f) }}>{tSign(f)}</span>
            </div>
            <div className="col grow g4" style={{ minWidth:0 }}>
              <span className="b truncate" style={{ fontSize:13 }}>{f.description}</span>
              <div style={{ display:'flex', gap:6, alignItems:'center' }}>
                <span className={'badge '+(f.categorie==='pro'?'org':'blu')} style={{ fontSize:10, padding:'1px 6px' }}>
                  {f.categorie==='pro'?'Pro':'Perso'}
                </span>
                <span className="t-xs mut">
                  {new Date(f.date+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
                </span>
              </div>
            </div>
            <span className="xb num" style={{ fontSize:15, color:tColor(f), flexShrink:0 }}>
              {tSign(f)}{fmt(f.montant)}
            </span>
          </div>
        ))}
      </div>

      {showModal && (
        <FinanceModal
          onConfirm={d => { onAdd(d); setShowModal(false); }}
          onCancel={() => setShowModal(false)}
        />
      )}
    </Fragment>
  );
}

/* ── APP ──────────────────────────────────────────────── */
const TABS = [
  { id:'today',    label:"Aujourd'hui" },
  { id:'pipeline', label:'Pipeline' },
  { id:'projets',  label:'Projets' },
  { id:'finance',  label:'Finance' },
  { id:'demos',    label:'Démos' },
  { id:'plan',     label:'Plan' },
];

function App() {
  const [tab, setTab]           = useState('today');
  const [cap, setCap]           = useState(null);
  const [focus, setFocus]       = useState([]);
  const [pipeline, setPipeline] = useState([]);
  const [projets, setProjets]   = useState([]);
  const [finances, setFinances]     = useState([]);
  const [enveloppes, setEnveloppes] = useState([]);
  const [loading, setLoading]       = useState(true);

  useEffect(() => {
    Promise.all([
      SB.from('pilotage_cap').select('*').single(),
      SB.from('pilotage_focus').select('*').order('ordre'),
      SB.from('pilotage_pipeline').select('*, source, wa_draft').order('priorite'),
      SB.from('pilotage_projets').select('*').order('priorite'),
      SB.from('pilotage_finances').select('*').order('date', { ascending: false }),
      SB.from('pilotage_enveloppes').select('*').order('priorite'),
    ]).then(([capR, focusR, pipeR, projR, finR, envR]) => {
      if (capR.data)   setCap(capR.data);
      if (focusR.data) setFocus(focusR.data);
      if (pipeR.data)  setPipeline(pipeR.data);
      if (projR.data)  setProjets(projR.data);
      if (finR.data)   setFinances(finR.data);
      if (envR.data)   setEnveloppes(envR.data);
      setLoading(false);
      document.getElementById('boot')?.remove();
    });
  }, []);

  /* Focus handlers */
  const handleFocusToggle = async (item) => {
    const updated = !item.done;
    setFocus(prev => prev.map(f => f.id === item.id ? { ...f, done: updated } : f));
    await SB.from('pilotage_focus').update({ done: updated }).eq('id', item.id);
  };
  const handleFocusEdit = async (item, val) => {
    setFocus(prev => prev.map(f => f.id === item.id ? { ...f, description: val } : f));
    await SB.from('pilotage_focus').update({ description: val }).eq('id', item.id);
  };

  /* Pipeline handlers */
  const handlePipeProchaine = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, prochaine: val } : p));
    await SB.from('pilotage_pipeline').update({ prochaine: val }).eq('id', d.id);
  };
  const handlePipeStatut = async (d, statut, statut_color) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, statut, statut_color } : p));
    await SB.from('pilotage_pipeline').update({ statut, statut_color }).eq('id', d.id);
  };
  const handlePipeContact = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, contact: val } : p));
    await SB.from('pilotage_pipeline').update({ contact: val }).eq('id', d.id);
  };
  const handlePipeSetup = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, setup: val } : p));
    await SB.from('pilotage_pipeline').update({ setup: val }).eq('id', d.id);
  };
  const handlePipeMensuel = async (d, val) => {
    setPipeline(prev => prev.map(p => p.id === d.id ? { ...p, mensuel: val } : p));
    await SB.from('pilotage_pipeline').update({ mensuel: val }).eq('id', d.id);
  };
  const handlePipeAdd = (newDossier) => {
    setPipeline(prev => [newDossier, ...prev]);
  };

  /* Projets handlers */
  const handleProjetProchaine = async (p, val) => {
    setProjets(prev => prev.map(pr => pr.id === p.id ? { ...pr, prochaine_action: val } : pr));
    await SB.from('pilotage_projets').update({ prochaine_action: val }).eq('id', p.id);
  };

  /* Finance handlers */
  const handleFinanceAdd = (entry) => {
    setFinances(prev => [entry, ...prev]);
  };

  /* Enveloppes handlers */
  const handleEnveloppeUpdate = (updated) => {
    setEnveloppes(prev => prev.map(e => e.id === updated.id ? updated : e));
  };

  const heure = new Date().getHours();
  const salut = heure < 12 ? 'Bonjour' : heure < 18 ? 'Bon après-midi' : 'Bonsoir';

  if (loading) return null;

  return (
    <div className="app">
      <div className="hdr">
        <div className="hdr-left">
          <div className="label">Mr Attractor · Pilotage</div>
          <div className="title">{salut}, Mac Arthur</div>
        </div>
        <div className="hdr-right">{TODAY}</div>
      </div>

      <div className="tabs">
        {TABS.map(t => (
          <button key={t.id} className={'tab'+(tab===t.id?' on':'')} onClick={() => setTab(t.id)}>{t.label}</button>
        ))}
      </div>

      <div className="content">
        {tab === 'today'    && <TabAujourdHui cap={cap} focus={focus} finances={finances} onCapChange={setCap} onFocusToggle={handleFocusToggle} onFocusEdit={handleFocusEdit} onGoFinance={() => setTab('finance')} />}
        {tab === 'pipeline' && <TabPipeline pipeline={pipeline} onEditProchaine={handlePipeProchaine} onEditStatut={handlePipeStatut} onEditContact={handlePipeContact} onEditSetup={handlePipeSetup} onEditMensuel={handlePipeMensuel} onAddProspect={handlePipeAdd} />}
        {tab === 'plan'     && <TabPlan />}
        {tab === 'projets'  && <TabProjets projets={projets} onEditProchaine={handleProjetProchaine} />}
        {tab === 'finance'  && <TabFinance finances={finances} enveloppes={enveloppes} onAdd={handleFinanceAdd} onUpdateEnveloppe={handleEnveloppeUpdate} />}
        {tab === 'demos'    && <TabDemos />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
