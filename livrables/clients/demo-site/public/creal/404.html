<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable — C'Real</title>
<meta name="robots" content="noindex">
<!--
  Cette page existe parce qu'elle manquait.

  Sans fichier 404.html, Cloudflare Pages sert index.html sur TOUTE adresse
  inconnue, avec un code 200. Vérifié le 06/08/2026 : boutiquecreal.com/admin
  et boutiquecreal.com/nimportequoi renvoyaient la boutique, octet pour octet.
  Une cliente qui tape mal une adresse croyait être au bon endroit, et aucun
  outil de suivi ne pouvait voir le problème puisque le serveur répondait 200.

  Même famille de défaut qu'une règle attrape-tout dans un fichier _redirects :
  elle sert une page à la place d'une autre, sans jamais lever d'erreur.
-->
<link rel="icon" type="image/png" sizes="32x32" href="/imgs/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --brand:#4A2E12; --orange:#F2A33D; --muted:#8A7A66; --bg:#FFFBF4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--brand);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; overflow-x: hidden;
  }
  .box { max-width: 420px; width: 100%; }
  .logo { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; margin-bottom: 24px; }
  h1 { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 800; margin-bottom: 16px; }
  p { font-size: 16px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 24px; border-radius: 14px;
    background: var(--orange); color: #fff; text-decoration: none;
    font-weight: 700; font-size: 16px; width: 100%; max-width: 100%;
  }
  .btn.secondaire {
    background: transparent; color: var(--brand);
    border: 1.5px solid rgba(74,46,18,.2); margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="/imgs/logo.jpeg" alt="C'Real">
    <h1>Cette page n'existe pas</h1>
    <p>
      L'adresse que vous avez ouverte ne correspond à aucune page de la boutique.
      Le lien a peut-être été mal recopié.
    </p>
    <a class="btn" href="/">Voir les farines C'Real</a>
    <a class="btn secondaire" href="https://wa.me/2250749563976">Écrire à Kezey sur WhatsApp</a>
  </div>
</body>
</html>
