<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Administration — Mission L'Armée du Seigneur</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/png" href="assets/logo-as.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --nuit:#0A1730;--nuit-2:#0F2143;--carte:#0e1f3d;--bord:rgba(201,163,78,.22);
  --bord-doux:rgba(255,255,255,.09);--or:#C9A34E;--or-clair:#E4C97E;
  --texte:#EAF0FB;--texte-doux:#A9B6D0;--texte-faible:#7688A8;--r:14px;
  --ok:#39B54A;--danger:#E05a5a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--nuit);color:var(--texte);line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3,.cinzel{font-family:'Cinzel',serif}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
a{color:var(--or-clair)}

/* LOGIN */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(800px 500px at 50% -10%,rgba(201,163,78,.14),transparent 60%),var(--nuit)}
.login .card{background:var(--carte);border:1px solid var(--bord-doux);border-radius:20px;padding:34px;max-width:400px;width:100%;text-align:center}
.login img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:14px;padding:6px;margin:0 auto 16px}
.login h1{font-size:20px;margin-bottom:4px}
.login p{color:var(--texte-doux);font-size:13.5px;margin-bottom:22px}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;font-size:12.5px;color:var(--texte-doux);margin-bottom:6px;font-weight:500}
.field input,.field textarea,.field select{width:100%;background:var(--nuit);border:1px solid var(--bord-doux);border-radius:10px;color:var(--texte);padding:12px 13px;font-size:14px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--or)}
.field textarea{resize:vertical;min-height:90px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;padding:12px 18px;border-radius:10px;border:none;min-height:44px;transition:.15s}
.btn-or{background:var(--or);color:#25190a}.btn-or:hover{background:var(--or-clair)}
.btn-ghost{background:transparent;color:var(--texte);border:1px solid var(--bord-doux)}.btn-ghost:hover{background:rgba(255,255,255,.05)}
.btn-danger{background:rgba(224,90,90,.12);color:#f0a3a3;border:1px solid rgba(224,90,90,.3)}
.btn-sm{padding:8px 12px;font-size:12.5px;min-height:36px}
.err{color:#f0a3a3;font-size:13px;margin-top:10px;min-height:18px}

/* APP */
.app{display:none;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(10,23,48,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--bord-doux);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:12px}
.top .b{display:flex;align-items:center;gap:11px;min-width:0}
.top img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:9px;padding:3px}
.top b{font-family:'Cinzel',serif;font-size:14px}.top small{display:block;color:var(--or-clair);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--bord-doux);background:var(--nuit-2)}
.tabs button{white-space:nowrap;background:transparent;border:1px solid transparent;color:var(--texte-doux);padding:9px 14px;border-radius:9px;font-size:13.5px;font-weight:500}
.tabs button.on{background:rgba(201,163,78,.12);border-color:var(--bord);color:var(--or-clair)}
.tabs .badge{display:inline-block;background:var(--or);color:#25190a;border-radius:100px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:6px}
.main{max-width:1060px;margin:0 auto;padding:22px 18px 60px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h2{font-size:21px}
.head p{color:var(--texte-doux);font-size:13.5px;margin-top:3px}
.list{display:grid;gap:12px}
.row{background:var(--carte);border:1px solid var(--bord-doux);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.row .th{width:54px;height:54px;border-radius:9px;object-fit:cover;background:var(--nuit);flex-shrink:0}
.row .g{flex:1;min-width:0}
.row .g h3{font-size:15px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g .m{font-size:12.5px;color:var(--texte-faible);display:flex;gap:10px;flex-wrap:wrap}
.row .act{display:flex;gap:8px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em}
.pill.on{background:rgba(57,181,74,.14);color:#8be59a}
.pill.off{background:rgba(255,255,255,.06);color:var(--texte-faible)}
.empty{text-align:center;color:var(--texte-faible);padding:44px 20px;border:1px dashed var(--bord-doux);border-radius:12px;font-size:14px}

/* MODAL */
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,9,22,.86);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.modal.open{display:flex}
.modal .m{background:var(--nuit-2);border:1px solid var(--bord);border-radius:18px;width:100%;max-width:560px;padding:24px}
.modal .m h3{font-size:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.imgprev{margin-top:8px;display:flex;align-items:center;gap:10px}
.imgprev img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:var(--nuit)}
.up{position:relative;overflow:hidden;display:inline-flex}
.up input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.footbtn{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.check{display:flex;align-items:center;gap:9px;background:var(--nuit);border:1px solid var(--bord-doux);border-radius:10px;padding:11px 13px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--or)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#04220e;font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:100px;z-index:80;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.msgcard{background:var(--carte);border:1px solid var(--bord-doux);border-radius:12px;padding:16px}
.msgcard .h{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.msgcard .h b{font-size:14.5px}.msgcard .h span{font-size:12px;color:var(--texte-faible)}
.msgcard .co{font-size:13px;color:var(--or-clair);margin-bottom:8px}
.msgcard p{font-size:14px;color:var(--texte-doux);white-space:pre-wrap}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="card">
    <img src="assets/logo-as.png" alt="" />
    <h1 class="cinzel">Administration</h1>
    <p>Mission L'Armée du Seigneur</p>
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="admin@…" autocomplete="username" /></div>
    <div class="field"><label>Mot de passe</label><input id="pwd" type="password" placeholder="••••••••" autocomplete="current-password" /></div>
    <button class="btn btn-or" style="width:100%" id="loginBtn">Se connecter</button>
    <div class="err" id="loginErr"></div>
    <p style="margin-top:16px;font-size:12px"><a href="#" id="forgot">Mot de passe oublié ?</a></p>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="top">
    <div class="b"><img src="assets/logo-as.png" alt="" /><div><b>L'Armée du Seigneur</b><small>Espace administration</small></div></div>
    <button class="btn btn-ghost btn-sm" id="logout">Déconnexion</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="main" id="main"></div>
</div>

<!-- MODAL FORM -->
<div class="modal" id="modal"><div class="m"><h3 id="mTitle"></h3><div id="mBody"></div>
  <div class="footbtn"><button class="btn btn-ghost" id="mCancel">Annuler</button><button class="btn btn-or" id="mSave">Enregistrer</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://lgdgbrivnhgeupqhkckd.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZGdicml2bmhnZXVwcWhrY2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDI1OTEsImV4cCI6MjA5NTU3ODU5MX0.kMmpwsQAUJQ6VkEpj4OOloijP1HoZbYYzbjWW2hg7Gk";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>(s||"").toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);};

/* ---------- ENTITES (config-driven CRUD) ---------- */
const EVT_TYPES=["culte","conférence","croisade","retraite","campagne"];
const TEMO_TYPES=["miracle","conversion","guérison","transformation"];
const ENTITIES={
  actualites:{table:"als_actualites",label:"Actualités",icon:"news",order:["date_pub",false],
    fields:[
      {k:"titre",l:"Titre",t:"text",req:1},
      {k:"categorie",l:"Catégorie",t:"text",half:1},
      {k:"auteur",l:"Auteur",t:"text",half:1},
      {k:"date_pub",l:"Date",t:"date",half:1},
      {k:"publie",l:"Publié sur le site",t:"bool",half:1},
      {k:"image_url",l:"Image",t:"image"},
      {k:"contenu",l:"Contenu",t:"textarea"},
    ],
    title:r=>r.titre, sub:r=>[r.categorie,r.date_pub].filter(Boolean).join(" · "), img:r=>r.image_url, pub:r=>r.publie},
  evenements:{table:"als_evenements",label:"Événements",order:["date_event",true],
    fields:[
      {k:"titre",l:"Titre",t:"text",req:1},
      {k:"type",l:"Type",t:"select",opts:EVT_TYPES,half:1},
      {k:"date_event",l:"Date",t:"date",half:1},
      {k:"heure",l:"Heure",t:"text",half:1,ph:"ex : 18h00"},
      {k:"lieu",l:"Lieu",t:"text",half:1},
      {k:"publie",l:"Publié sur le site",t:"bool",half:1},
      {k:"album_id",l:"Album (galerie après event)",t:"albumref",half:1},
      {k:"banniere_url",l:"Bannière",t:"image"},
      {k:"description",l:"Description",t:"textarea"},
    ],
    title:r=>r.titre, sub:r=>[r.type,r.date_event,r.lieu].filter(Boolean).join(" · "), img:r=>r.banniere_url, pub:r=>r.publie},
  albums:{table:"als_albums",label:"Galerie · Albums",order:["annee",false],
    fields:[
      {k:"titre",l:"Titre de l'album",t:"text",req:1},
      {k:"annee",l:"Année",t:"number",half:1},
      {k:"evenement",l:"Événement",t:"text",half:1},
      {k:"departement",l:"Département",t:"text",half:1},
      {k:"ordre",l:"Ordre",t:"number",half:1},
      {k:"couverture_url",l:"Photo de couverture",t:"image"},
    ],
    title:r=>r.titre, sub:r=>[r.annee,r.evenement,r.departement].filter(Boolean).join(" · "), img:r=>r.couverture_url},
  medias:{table:"als_medias",label:"Galerie · Médias",order:["ordre",true],
    fields:[
      {k:"album_id",l:"Album",t:"albumref",req:1},
      {k:"type",l:"Type",t:"select",opts:["photo","video"],half:1},
      {k:"ordre",l:"Ordre",t:"number",half:1},
      {k:"url",l:"Photo (upload) ou lien vidéo YouTube",t:"image"},
      {k:"legende",l:"Légende",t:"text"},
    ],
    title:r=>r.legende||r.type, sub:r=>r._albumTitle||"", img:r=>r.type==="photo"?r.url:null},
  temoignages:{table:"als_temoignages",label:"Témoignages",order:["cree_le",false],
    fields:[
      {k:"auteur",l:"Auteur (ou anonyme)",t:"text",half:1},
      {k:"type",l:"Type",t:"select",opts:TEMO_TYPES,half:1},
      {k:"publie",l:"Publié sur le site",t:"bool",half:1},
      {k:"photo_url",l:"Photo (optionnel)",t:"image",half:1},
      {k:"video_url",l:"Lien vidéo (optionnel)",t:"text"},
      {k:"texte",l:"Témoignage",t:"textarea",req:1},
    ],
    title:r=>r.auteur||"Témoignage", sub:r=>r.type, img:r=>r.photo_url, pub:r=>r.publie},
  dirigeants:{table:"als_dirigeants",label:"Dirigeants",order:["ordre",true],
    fields:[
      {k:"nom",l:"Nom",t:"text",req:1},
      {k:"role",l:"Rôle",t:"text",half:1},
      {k:"lieu",l:"Lieu",t:"text",half:1},
      {k:"ordre",l:"Ordre",t:"number",half:1},
      {k:"photo_url",l:"Photo",t:"image",half:1},
      {k:"bio",l:"Biographie",t:"textarea"},
      {k:"mission",l:"Sa mission",t:"textarea"},
      {k:"messages",l:"Ses messages (optionnel)",t:"textarea"},
    ],
    title:r=>r.nom, sub:r=>[r.role,r.lieu].filter(Boolean).join(" · "), img:r=>r.photo_url},
  departements:{table:"als_departements",label:"Départements",order:["ordre",true],
    fields:[
      {k:"nom",l:"Nom",t:"text",req:1},
      {k:"responsable",l:"Responsable",t:"text",half:1},
      {k:"ordre",l:"Ordre",t:"number",half:1},
      {k:"actif",l:"Actif (visible sur le site)",t:"bool",half:1},
      {k:"photo_url",l:"Photo",t:"image",half:1},
      {k:"mission",l:"Mission",t:"textarea"},
      {k:"description",l:"Description (optionnel)",t:"textarea"},
    ],
    title:r=>r.nom, sub:r=>r.responsable||"", img:r=>r.photo_url, pub:r=>r.actif},
  messages:{table:"als_contact",label:"Messages",order:["cree_le",false],readonly:1},
};
const TAB_ORDER=["actualites","evenements","albums","medias","temoignages","dirigeants","departements","messages"];

let CURRENT="actualites", ALBUMS_CACHE=[];

/* ---------- AUTH ---------- */
async function boot(){
  const {data}=await sb.auth.getSession();
  if(data.session){showApp();}else{$("#login").style.display="flex";}
}
$("#loginBtn").onclick=async()=>{
  $("#loginErr").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#pwd").value});
  if(error){$("#loginErr").textContent="Identifiants incorrects.";return;}
  showApp();
};
$("#pwd").addEventListener("keydown",e=>{if(e.key==="Enter")$("#loginBtn").click();});
$("#forgot").onclick=async e=>{
  e.preventDefault();const em=$("#email").value.trim();
  if(!em){$("#loginErr").textContent="Entrez d'abord votre email ci-dessus.";return;}
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href});
  $("#loginErr").textContent=error?"Erreur d'envoi.":"Email de réinitialisation envoyé.";
};
$("#logout").onclick=async()=>{await sb.auth.signOut();location.reload();};
function showApp(){$("#login").style.display="none";$("#app").style.display="block";renderTabs();openTab("actualites");}

/* ---------- TABS ---------- */
async function renderTabs(){
  const {count}=await sb.from("als_contact").select("*",{count:"exact",head:true});
  $("#tabs").innerHTML=TAB_ORDER.map(k=>{
    const e=ENTITIES[k];const badge=(k==="messages"&&count)?`<span class="badge">${count}</span>`:"";
    return `<button data-k="${k}" class="${k===CURRENT?'on':''}">${e.label}${badge}</button>`;
  }).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>openTab(b.dataset.k));
}
async function openTab(k){
  CURRENT=k;
  $("#tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  if(k==="albums"||k==="medias"||k==="evenements") await loadAlbumsCache();
  k==="messages"?renderMessages():renderList(k);
}
async function loadAlbumsCache(){const {data}=await sb.from("als_albums").select("id,titre").order("annee",{ascending:false});ALBUMS_CACHE=data||[];}

/* ---------- LIST ---------- */
async function renderList(k){
  const e=ENTITIES[k];
  const {data,error}=await sb.from(e.table).select("*").order(e.order[0],{ascending:e.order[1]});
  const rows=data||[];
  if(k==="medias")rows.forEach(r=>r._albumTitle=(ALBUMS_CACHE.find(a=>a.id===r.album_id)||{}).titre||"—");
  $("#main").innerHTML=`
    <div class="head"><div><h2>${e.label}</h2><p>${rows.length} élément(s)</p></div>
      <button class="btn btn-or" id="addBtn">+ Ajouter</button></div>
    <div class="list" id="list"></div>`;
  $("#addBtn").onclick=()=>openForm(k,null);
  const list=$("#list");
  if(!rows.length){list.innerHTML=`<div class="empty">Aucun élément pour l'instant. Cliquez sur « Ajouter » pour commencer.</div>`;return;}
  list.innerHTML=rows.map(r=>{
    const img=e.img&&e.img(r);const pub=e.pub?e.pub(r):null;
    return `<div class="row">
      ${img?`<img class="th" src="${esc(img)}" alt="">`:`<div class="th"></div>`}
      <div class="g"><h3>${esc(e.title(r))||"(sans titre)"}</h3><div class="m"><span>${esc(e.sub(r)||"")}</span></div></div>
      ${pub!==null&&pub!==undefined?`<span class="pill ${pub?'on':'off'}">${pub?'En ligne':'Masqué'}</span>`:""}
      <div class="act">
        <button class="btn btn-ghost btn-sm" data-ed="${r.id}">Modifier</button>
        <button class="btn btn-danger btn-sm" data-del="${r.id}">Suppr.</button>
      </div></div>`;
  }).join("");
  list.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>openForm(k,rows.find(x=>x.id===b.dataset.ed)));
  list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(k,b.dataset.del));
}

/* ---------- MESSAGES (readonly inbox) ---------- */
async function renderMessages(){
  const {data}=await sb.from("als_contact").select("*").order("cree_le",{ascending:false});
  const rows=data||[];
  $("#main").innerHTML=`<div class="head"><div><h2>Messages reçus</h2><p>${rows.length} message(s) via le formulaire du site</p></div></div>
    <div class="list" id="list"></div>`;
  const list=$("#list");
  if(!rows.length){list.innerHTML=`<div class="empty">Aucun message pour l'instant.</div>`;return;}
  list.innerHTML=rows.map(r=>{
    const wa=(r.coordonnee||"").replace(/[^0-9]/g,"");
    return `<div class="msgcard">
      <div class="h"><b>${esc(r.nom||"Anonyme")} · ${esc(r.pays||"")}</b><span>${new Date(r.cree_le).toLocaleString("fr-FR")}</span></div>
      <div class="co">${esc(r.coordonnee||"")}</div>
      <p>${esc(r.message||"")}</p>
      <div class="act" style="margin-top:12px;justify-content:flex-end">
        ${wa.length>=8?`<a class="btn btn-ghost btn-sm" href="https://wa.me/${wa}" target="_blank" rel="noopener">Répondre WhatsApp</a>`:""}
        <button class="btn btn-danger btn-sm" data-del="${r.id}">Supprimer</button>
      </div></div>`;
  }).join("");
  list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del("messages",b.dataset.del));
}

/* ---------- FORM (modal) ---------- */
let EDIT_ID=null, FORM_KEY=null, FORM_STATE={};
function openForm(k,rec){
  const e=ENTITIES[k];FORM_KEY=k;EDIT_ID=rec?rec.id:null;FORM_STATE={};
  $("#mTitle").textContent=(rec?"Modifier — ":"Ajouter — ")+e.label;
  const body=$("#mBody");
  body.innerHTML=`<div class="grid2">`+e.fields.map(f=>fieldHtml(f,rec?rec[f.k]:defVal(f))).map(h=>h).join("")+`</div>`;
  // full-width fields outside grid2 : re-render properly
  body.innerHTML="";
  const grid=document.createElement("div");grid.className="grid2";
  const full=document.createElement("div");
  e.fields.forEach(f=>{
    const wrap=document.createElement("div");wrap.innerHTML=fieldHtml(f,rec?rec[f.k]:defVal(f));
    (f.half?grid:full).appendChild(wrap.firstElementChild);
  });
  body.appendChild(grid);body.appendChild(full);
  bindImages();
  $("#modal").classList.add("open");
}
function defVal(f){if(f.t==="bool")return true;if(f.t==="date")return new Date().toISOString().slice(0,10);if(f.k==="type"&&f.opts)return f.opts[0];return "";}
function fieldHtml(f,v){
  v=v==null?"":v;
  if(f.t==="bool")return `<div class="field"><label class="check"><input type="checkbox" data-k="${f.k}" ${v?"checked":""}> ${f.l}</label></div>`;
  if(f.t==="textarea")return `<div class="field"><label>${f.l}${f.req?" *":""}</label><textarea data-k="${f.k}" ${f.ph?`placeholder="${f.ph}"`:""}>${esc(v)}</textarea></div>`;
  if(f.t==="select")return `<div class="field"><label>${f.l}</label><select data-k="${f.k}">${f.opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select></div>`;
  if(f.t==="albumref"){const opts=[`<option value="">— Aucun —</option>`].concat(ALBUMS_CACHE.map(a=>`<option value="${a.id}" ${a.id===v?"selected":""}>${esc(a.titre)}</option>`));return `<div class="field"><label>${f.l}${f.req?" *":""}</label><select data-k="${f.k}">${opts.join("")}</select></div>`;}
  if(f.t==="image")return `<div class="field"><label>${f.l}</label>
      <input type="text" data-k="${f.k}" data-img="1" value="${esc(v)}" placeholder="Coller une URL, ou téléverser →">
      <div class="imgprev"><img data-prev="${f.k}" src="${esc(v)}" style="${v?'':'display:none'}">
        <span class="btn btn-ghost btn-sm up">Téléverser<input type="file" accept="image/*" data-up="${f.k}"></span></div></div>`;
  if(f.t==="number")return `<div class="field"><label>${f.l}</label><input type="number" data-k="${f.k}" value="${esc(v)}"></div>`;
  return `<div class="field"><label>${f.l}${f.req?" *":""}</label><input type="${f.t}" data-k="${f.k}" value="${esc(v)}" ${f.ph?`placeholder="${f.ph}"`:""}></div>`;
}
function bindImages(){
  $("#mBody").querySelectorAll("[data-up]").forEach(inp=>{
    inp.onchange=async()=>{
      const file=inp.files[0];if(!file)return;
      const k=inp.dataset.up;const txt=$(`#mBody [data-k="${k}"]`);
      inp.parentElement.textContent="Envoi…";
      const path=`${FORM_KEY}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"")}`;
      const {error}=await sb.storage.from("als-medias").upload(path,file,{upsert:false});
      if(error){toast("Échec de l'upload");inp.parentElement.innerHTML='Téléverser';return;}
      const {data}=sb.storage.from("als-medias").getPublicUrl(path);
      txt.value=data.publicUrl;
      const prev=$(`#mBody [data-prev="${k}"]`);prev.src=data.publicUrl;prev.style.display="";
      inp.parentElement.innerHTML='Remplacer';
      bindImages();
    };
  });
  $("#mBody").querySelectorAll("[data-img]").forEach(t=>t.oninput=()=>{const p=$(`#mBody [data-prev="${t.dataset.k}"]`);if(p){p.src=t.value;p.style.display=t.value?"":"none";}});
}
$("#mCancel").onclick=()=>$("#modal").classList.remove("open");
$("#modal").onclick=e=>{if(e.target===$("#modal"))$("#modal").classList.remove("open");};
$("#mSave").onclick=async()=>{
  const e=ENTITIES[FORM_KEY];const payload={};
  $("#mBody").querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k;
    if(el.type==="checkbox")payload[k]=el.checked;
    else if(el.type==="number")payload[k]=el.value===""?null:Number(el.value);
    else payload[k]=el.value.trim()===""?null:el.value.trim();
  });
  for(const f of e.fields){if(f.req&&!payload[f.k]){toast("Champ requis : "+f.l);return;}}
  $("#mSave").disabled=true;$("#mSave").textContent="Enregistrement…";
  let res;
  if(EDIT_ID)res=await sb.from(e.table).update(payload).eq("id",EDIT_ID);
  else res=await sb.from(e.table).insert(payload);
  $("#mSave").disabled=false;$("#mSave").textContent="Enregistrer";
  if(res.error){toast("Erreur : "+res.error.message);return;}
  $("#modal").classList.remove("open");toast(EDIT_ID?"Modifié":"Ajouté");
  renderTabs();openTab(FORM_KEY);
};

/* ---------- DELETE ---------- */
async function del(k,id){
  if(!confirm("Supprimer définitivement cet élément ?"))return;
  const {error}=await sb.from(ENTITIES[k].table).delete().eq("id",id);
  if(error){toast("Erreur suppression");return;}
  toast("Supprimé");renderTabs();openTab(k);
}

boot();
</script>
