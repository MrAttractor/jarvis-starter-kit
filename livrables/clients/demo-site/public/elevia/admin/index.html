<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Élévia — file de vérification</title>
<meta name="robots" content="noindex">
<!--
  CLUB PRIVÉ ÉLÉVIA — back-office de modération (CDC, Module 2).
  Réservé aux membres dont le rôle est « agent ». La même session que l'espace
  membre : Élise se connecte une fois, et voit la file si son rôle l'autorise.
  Les vidéos ne sont jamais publiques : chaque lecture passe par une adresse
  signée valable 5 minutes, générée à l'ouverture de la file.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#181614; --creme:#FBF9F5; --sable:#F0EAE0; --blanc:#FFF;
  --or:#B99A63; --or-fonce:#96794A; --muted:#6B6459; --gris:#8F887C; --bord:#EAE4D8;
  --succes:#2F9E63; --alerte:#B3403A;
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--encre);background:var(--creme);line-height:1.6;overflow-x:hidden}
.barre{background:var(--encre);color:var(--creme);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.barre .t{font-family:var(--serif);font-size:17px;letter-spacing:.1em}
.barre .t small{display:block;font-size:9.5px;letter-spacing:.26em;color:var(--or);margin-top:2px}
.barre .qui{font-size:12px;color:#C9BEB2}
.enveloppe{max-width:820px;margin:0 auto;padding:26px 18px 60px}
h1{font-family:var(--serif);font-size:23px;font-weight:500;margin-bottom:6px}
.sous{color:var(--muted);font-size:14px;margin-bottom:24px}
.carte{background:var(--blanc);border:1px solid var(--bord);border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 8px 30px rgba(24,22,20,.06)}
.tete{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:baseline;margin-bottom:14px}
.qui-nom{font-family:var(--serif);font-size:19px}
.qui-det{font-size:12.5px;color:var(--muted)}
.defi{background:var(--sable);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.defi b{display:block;font-size:10px;letter-spacing:.16em;color:var(--or-fonce);margin-bottom:4px}
video{width:100%;border-radius:12px;background:#000;display:block;margin-bottom:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font-family:inherit;font-size:14.5px;font-weight:500;border:none;border-radius:10px;padding:14px;cursor:pointer;min-height:48px}
.oui{background:var(--succes);color:#fff}
.non{background:var(--blanc);color:var(--alerte);border:1px solid var(--alerte)}
.plein{grid-column:1/-1;background:var(--encre);color:var(--creme)}
input[type=text]{width:100%;padding:13px 14px;border:1px solid var(--bord);border-radius:10px;font-size:15px;font-family:inherit;margin-bottom:10px;min-height:46px;background:var(--creme)}
.etat{display:inline-block;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500}
.etat.attente{background:var(--sable);color:var(--muted)}
.etat.valide{background:#EAF6EF;color:#1E7346}
.etat.refuse{background:#FBEDEC;color:#8C302B}
.vide{text-align:center;padding:50px 20px;color:var(--muted)}
.vide .g{font-family:var(--serif);font-size:21px;color:var(--encre);margin-bottom:8px}
.note{font-size:12px;color:var(--gris);line-height:1.6;margin-top:14px;padding-top:14px;border-top:1px solid var(--bord)}
.message{padding:13px 15px;border-radius:10px;font-size:13.5px;margin-bottom:18px}
.message.erreur{background:#FBEDEC;color:#8C302B}
.message.info{background:var(--sable);color:var(--muted)}
@media(max-width:560px){ .actions{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="barre">
  <div class="t">ÉLÉVIA<small>FILE DE VÉRIFICATION</small></div>
  <div class="qui" id="qui"></div>
</div>

<main class="enveloppe" id="vue"></main>

<script>
const API_VERIF = "https://lgdgbrivnhgeupqhkckd.supabase.co/functions/v1/elevia-verif";
const CLE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZGdicml2bmhnZXVwcWhrY2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDI1OTEsImV4cCI6MjA5NTU3ODU5MX0.kMmpwsQAUJQ6VkEpj4OOloijP1HoZbYYzbjWW2hg7Gk";

const $ = (s) => document.querySelector(s);
const vue = $("#vue");
const jeton = () => localStorage.getItem("elevia_jeton") || "";
const ech = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

async function appel(url, corps) {
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: CLE, Authorization: "Bearer " + CLE },
      body: JSON.stringify(corps),
    });
    return await r.json();
  } catch (_) { return { ok: false, error: "Connexion impossible." }; }
}

const jour = (d) => new Date(d).toLocaleString("fr-FR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });

function ecranRefus(msg) {
  vue.innerHTML = `<div class="carte"><h1>Accès réservé</h1>
    <p class="sous" style="margin:0">${ech(msg)}</p>
    <p class="note">Connectez-vous d'abord sur votre espace membre, avec un compte autorisé par Élévia.
      <br><a href="/elevia/app/" style="color:var(--or-fonce)">Aller à l'espace membre</a></p></div>`;
}

async function charger() {
  vue.innerHTML = `<p class="sous">Chargement de la file…</p>`;
  const r = await appel(API_VERIF, { action: "file", jeton: jeton() });

  if (!r.ok) return ecranRefus(r.error || "Accès refusé.");
  $("#qui").textContent = r.agent ? "Connectée en tant que " + r.agent : "";

  const attente = r.demandes.filter((d) => d.statut === "en_attente");
  const traitees = r.demandes.filter((d) => d.statut !== "en_attente");

  vue.innerHTML = `
    <h1>${attente.length} vérification${attente.length > 1 ? "s" : ""} en attente</h1>
    <p class="sous">Chaque décision est prise par une personne de l'équipe, jamais par un automate.
      ${r.purgees ? `<br><b>${r.purgees} vidéo${r.purgees > 1 ? "s" : ""}</b> viennent d'être supprimées, 24 h après leur décision.` : ""}</p>
    ${attente.length === 0
      ? `<div class="carte vide"><div class="g">La file est vide</div><p>Aucune demande n'attend de décision.</p></div>`
      : attente.map(carteDemande).join("")}
    ${traitees.length ? `<h1 style="margin-top:34px;font-size:19px">Décisions récentes</h1>
      ${traitees.slice(0, 8).map(carteTraitee).join("")}` : ""}
    <p class="note">Les vidéos sont supprimées définitivement dans les 24 heures suivant votre décision.
      Cette suppression est horodatée et vérifiable. Les adresses de lecture ci-dessus expirent au bout de 5 minutes.</p>`;

  document.querySelectorAll("[data-oui]").forEach((b) => b.onclick = () => decider(b.dataset.oui, "valide"));
  document.querySelectorAll("[data-non]").forEach((b) => b.onclick = () => {
    const zone = document.querySelector(`#refus-${b.dataset.non}`);
    zone.style.display = "block";
    zone.querySelector("input").focus();
  });
  document.querySelectorAll("[data-conf]").forEach((b) => b.onclick = () => {
    const motif = document.querySelector(`#refus-${b.dataset.conf} input`).value.trim();
    decider(b.dataset.conf, "refuse", motif);
  });
}

function carteDemande(d) {
  const m = d.membre || {};
  return `<div class="carte">
    <div class="tete">
      <div>
        <div class="qui-nom">${ech(m.pseudo || "Membre")}</div>
        <div class="qui-det">${ech(m.pays || "—")} · inscrit${(m.genre === "femme") ? "e" : ""} le ${m.created_at ? jour(m.created_at) : "—"}</div>
      </div>
      <span class="etat attente">Soumis le ${jour(d.soumis_le)}</span>
    </div>
    <div class="defi"><b>GESTE DEMANDÉ</b>${ech(d.defi)}</div>
    ${d.video ? `<video src="${d.video}" controls playsinline preload="metadata"></video>`
              : `<div class="message info">La vidéo n'est plus disponible.</div>`}
    <div class="actions">
      <button class="oui" data-oui="${d.id}">Valider le profil</button>
      <button class="non" data-non="${d.id}">Refuser</button>
    </div>
    <div id="refus-${d.id}" style="display:none;margin-top:12px">
      <input type="text" placeholder="Motif communiqué au membre (facultatif)" maxlength="160">
      <div class="actions"><button class="plein" data-conf="${d.id}">Confirmer le refus</button></div>
    </div>
  </div>`;
}

function carteTraitee(d) {
  const m = d.membre || {};
  return `<div class="carte" style="padding:16px 20px">
    <div class="tete" style="margin:0">
      <div>
        <div class="qui-nom" style="font-size:16px">${ech(m.pseudo || "Membre")}</div>
        <div class="qui-det">${d.decide_le ? jour(d.decide_le) : ""}${d.motif ? " · " + ech(d.motif) : ""}</div>
      </div>
      <span class="etat ${d.statut}">${d.statut === "valide" ? "Validé" : "Refusé"}</span>
    </div>
  </div>`;
}

async function decider(id, decision, motif) {
  document.querySelectorAll("button").forEach((b) => b.disabled = true);
  const r = await appel(API_VERIF, { action: "decider", jeton: jeton(), id, decision, motif });
  if (!r.ok) {
    vue.insertAdjacentHTML("afterbegin", `<div class="message erreur">${ech(r.error)}</div>`);
    document.querySelectorAll("button").forEach((b) => b.disabled = false);
    return;
  }
  charger();
}

if (!jeton()) ecranRefus("Vous n'êtes pas connectée.");
else charger();
</script>
</body>
</html>
