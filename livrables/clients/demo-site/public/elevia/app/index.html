<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Privé Élévia</title>
<meta name="robots" content="noindex">
<meta name="description" content="Club privé international. L'adhésion se mérite, la discrétion se cultive.">
<meta name="theme-color" content="#00234B">
<!--
  CLUB PRIVÉ ÉLÉVIA — Modules 1 et 2 du CDC.
  Identité, inscription, connexion par code à 6 chiffres, vérification vidéo, profil.
  Stack maison : HTML/CSS/JS natif + edge functions elevia-auth / elevia-verif (service role).
  Aucune donnée de membre n'est lisible avec la clé publique : tout passe par les fonctions.

  Révision du 14/08/2026 — recette de la Cliente du 08/08/2026, 16 points.
  Ce qui reste en attente d'un élément de la Cliente est marqué « EN ATTENTE »
  dans le bloc MARQUE ci-dessous : un seul endroit à modifier.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── Charte, relevée sur le logo officiel de la Cliente ──
   Bleu nuit #00234B et or #A87726 → #D9AC56 sont les couleurs mesurées dans le
   fichier ELEVIA LOGO.png. Le cahier des charges parlait de « Noir & Or » parce
   que les maquettes ont été faites avant que le logo existe : c'est le logo qui
   fait foi désormais, la charte graphique appartient à la Cliente. */
:root{
  --encre:#00234B; --creme:#F4F6F9; --sable:#E9EDF3; --blanc:#FFFFFF;
  --or:#BE9440; --or-clair:#D9AC56; --or-fonce:#A87726; --or-texte:#8A6420;
  --muted:#55606F; --gris:#6E7889; --bord:#DCE3EB;
  --succes:#1E7346; --alerte:#8C302B;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --ombre:0 8px 30px rgba(0,35,75,.08);
  --ombre-douce:0 2px 10px rgba(0,35,75,.05);
  --rayon:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--encre);background:var(--creme);
  line-height:1.6;overflow-x:hidden;min-height:100vh;
  display:flex;flex-direction:column;
}
img{max-width:100%;display:block}

/* ── Accessibilité : le focus doit toujours se voir ──
   Contrat, critère « navigation clavier ». On garde :focus-visible pour ne pas
   cercler un bouton simplement touché au doigt, et on met un contour franc. */
:focus-visible{outline:2px solid var(--or-fonce);outline-offset:3px;border-radius:6px}
.saut{
  position:absolute;left:-9999px;top:0;background:var(--encre);color:var(--creme);
  padding:12px 18px;z-index:99;border-radius:0 0 8px 0;font-size:14px;
}
.saut:focus{left:0}

.enveloppe{max-width:560px;margin:0 auto;padding:28px 20px 40px;width:100%;flex:1 0 auto}

/* ── En-tête de marque ── */
.marque{text-align:center;margin-bottom:30px}
.marque .blason{width:58px;height:58px;margin:0 auto 12px}
.marque .blason img{width:100%;height:100%;object-fit:contain}
.marque .nom{font-family:var(--serif);font-size:30px;letter-spacing:.14em;line-height:1}
.marque .sous{font-size:9.5px;letter-spacing:.3em;color:var(--or);margin-top:8px;font-weight:500}
.filet{width:44px;height:1px;background:var(--or);margin:15px auto 0;opacity:.6}

/* ── Cartes ── */
.carte{
  background:var(--blanc);border:1px solid var(--bord);border-radius:var(--rayon);
  padding:32px 26px;box-shadow:var(--ombre);
}
.carte + .carte{margin-top:16px}
h1{font-family:var(--serif);font-size:25px;line-height:1.3;font-weight:500;margin-bottom:12px}
h2{font-family:var(--serif);font-size:20px;line-height:1.3;font-weight:500;margin-bottom:8px}
.chapo{color:var(--muted);font-size:14.5px;margin-bottom:24px}
.etiquette{
  display:inline-block;font-size:9.5px;letter-spacing:.22em;color:var(--or);
  font-weight:700;margin-bottom:12px;
}

/* ── Animation d'entrée, discrète ── */
.anime{animation:monte .5s cubic-bezier(.22,.61,.36,1) both}
.anime-2{animation:monte .5s cubic-bezier(.22,.61,.36,1) .07s both}
@keyframes monte{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .anime,.anime-2{animation:none}
  *{transition:none !important}
}

/* ── Visuel d'accueil ── */
.tableau{
  position:relative;border-radius:13px;overflow:hidden;margin-bottom:22px;
  aspect-ratio:16/9;background:var(--blanc);border:1px solid var(--bord);
}
.tableau img{width:100%;height:100%;object-fit:cover}
.tableau .decor{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 82% 8%, rgba(217,172,86,.16), transparent 56%),
    radial-gradient(100% 80% at 10% 96%, rgba(0,35,75,.07), transparent 58%),
    linear-gradient(165deg,#FFFFFF 0%,#FBFCFE 55%,#F2F5F9 100%);
}
.tableau .trame{position:absolute;inset:0;opacity:.5}
.tableau .sceau{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
.tableau .sceau{padding:16px}
.tableau .sceau-logo{width:auto;height:100%;max-height:100%;object-fit:contain}

/* ── Badges de confiance ── */
.gages{display:grid;gap:9px;margin-bottom:24px}
.gage{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.gage svg{width:15px;height:15px;flex:0 0 auto;stroke:var(--or);stroke-width:2.2;fill:none}

/* ── Progression ── */
.pas{display:flex;gap:6px;margin-bottom:24px}
.pas i{flex:1;height:2px;background:var(--sable);border-radius:2px;transition:background .3s}
.pas i.fait{background:var(--or)}

/* ── Champs ── */
.champ{margin-bottom:20px}
label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:7px}
input,select{
  width:100%;padding:14px 15px;border:1px solid var(--bord);border-radius:10px;
  font-size:16px;font-family:inherit;color:var(--encre);background:var(--creme);
  min-height:48px;transition:border-color .15s,background .15s,box-shadow .15s;
}
input:focus,select:focus{outline:none;border-color:var(--or);background:var(--blanc);box-shadow:0 0 0 3px rgba(190,148,64,.17)}
input[aria-invalid="true"]{border-color:var(--alerte)}
.aide{font-size:12px;color:var(--gris);margin-top:6px;line-height:1.5;display:flex;align-items:flex-start;gap:6px}
.aide.ok{color:var(--succes);font-weight:500}
.aide.non{color:var(--alerte);font-weight:500}
.aide svg{width:13px;height:13px;flex:0 0 auto;margin-top:3px;stroke:currentColor;stroke-width:2.6;fill:none}
.compteur{float:right;font-size:11.5px;color:var(--gris);font-weight:400;letter-spacing:.02em}
.exemples{font-size:12px;color:var(--gris);margin-top:6px}
.exemples b{color:var(--muted);font-weight:500}

/* ── Sélecteur de pays avec recherche ── */
.combo{position:relative}
.combo-liste{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;
  background:var(--blanc);border:1px solid var(--bord);border-radius:11px;
  box-shadow:0 12px 34px rgba(0,35,75,.16);max-height:240px;overflow-y:auto;
  padding:5px;display:none;-webkit-overflow-scrolling:touch;
}
.combo-liste.ouverte{display:block}
.combo-liste div[role="option"]{
  padding:11px 13px;border-radius:8px;font-size:14.5px;cursor:pointer;
  min-height:44px;display:flex;align-items:center;
}
.combo-liste div[role="option"]:hover,
.combo-liste div[role="option"].survol{background:var(--sable)}
.combo-liste div[role="option"][aria-selected="true"]{color:var(--or-texte);font-weight:500}
.combo-vide{padding:14px 13px;font-size:13.5px;color:var(--gris)}

/* ── Genre : deux choix ── */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo button{
  padding:14px;border:1px solid var(--bord);border-radius:10px;background:var(--creme);
  font-family:inherit;font-size:14.5px;color:var(--muted);cursor:pointer;min-height:48px;
  transition:border-color .15s,color .15s,background .15s,box-shadow .15s;
}
.duo button.actif{border-color:var(--or);background:var(--blanc);color:var(--encre);font-weight:500;
  box-shadow:0 0 0 3px rgba(190,148,64,.16)}

/* ── Cases à cocher ── */
.coche{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;cursor:pointer}
.coche input{width:19px;height:19px;min-height:0;flex:0 0 auto;margin-top:2px;accent-color:var(--or)}
.coche span{font-size:13px;color:var(--muted);line-height:1.55}
.coche a{color:var(--or-texte);text-underline-offset:2px}

/* ── Boutons ── */
.bouton{
  width:100%;padding:16px;border:none;border-radius:10px;background:var(--encre);color:var(--creme);
  font-family:inherit;font-size:15px;font-weight:500;letter-spacing:.03em;cursor:pointer;
  min-height:52px;transition:background .15s,opacity .15s,transform .1s;
}
.bouton:active:not(:disabled){transform:translateY(1px)}
.bouton:disabled{opacity:.4;cursor:not-allowed}
.bouton.or{background:var(--or);color:var(--blanc)}
@media (hover:hover) and (pointer:fine){
  .bouton:hover:not(:disabled){background:#001B3A}
  .bouton.or:hover:not(:disabled){background:var(--or-fonce)}
}
button{-webkit-tap-highlight-color:transparent}
.lien{
  display:block;width:100%;background:none;border:none;padding:14px;margin-top:6px;
  font-family:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;min-height:44px;
}

/* ── Code à 6 chiffres ── */
.code{
  width:100%;text-align:center;font-family:var(--serif);font-size:32px;
  letter-spacing:.32em;padding:18px 15px 18px 25px;
}
.code::placeholder{letter-spacing:.2em;font-size:22px;color:#B9C3D0}
.minuteur{text-align:center;font-size:12.5px;color:var(--gris);margin-top:12px}
.minuteur b{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.minuteur.fini{color:var(--alerte)}

/* ── Messages ── */
.message{
  padding:13px 15px;border-radius:10px;font-size:13.5px;line-height:1.55;margin-bottom:20px;
}
.message.erreur{background:#FBEDEC;color:var(--alerte);border:1px solid #F0D5D3}
.message.info{background:var(--sable);color:var(--muted)}
.message.succes{background:#EAF6EF;color:var(--succes);border:1px solid #CFE9DA}

/* ── Consignes numérotées ── */
.consignes{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:11px}
.consignes li{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.5}
.consignes .rang{
  flex:0 0 auto;width:23px;height:23px;border-radius:50%;border:1px solid var(--or);
  color:var(--or-fonce);font-size:12px;font-weight:700;display:flex;align-items:center;
  justify-content:center;margin-top:1px;
}
.consignes .coche-or{flex:0 0 auto;width:15px;height:15px;margin-top:4px;stroke:var(--or);stroke-width:2.4;fill:none}

/* ── Profil ── */
.profil-tete{text-align:center;padding-bottom:24px;border-bottom:1px solid var(--bord);margin-bottom:24px}
.medaille{
  width:76px;height:76px;border-radius:50%;background:var(--sable);border:1px solid var(--or);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  font-family:var(--serif);font-size:30px;color:var(--or-fonce);
}
.pseudo{font-family:var(--serif);font-size:23px;font-weight:500}
.ligne{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--bord);font-size:14px}
.ligne:last-of-type{border-bottom:none}
.ligne .cle{color:var(--muted)}
.ligne .val{font-weight:500;text-align:right}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
  font-size:11.5px;font-weight:500;
}
.badge.attente{background:var(--sable);color:var(--muted)}
.badge.valide{background:#EAF6EF;color:var(--succes)}
.badge svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.4;fill:none}

/* ── Attente de décision ── */
.jauge{
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:20px;
  background:#FDF7E9;color:var(--or-texte);font-size:12.5px;font-weight:500;border:1px solid #EFDFBC;
}
.jauge .point{width:7px;height:7px;border-radius:50%;background:#C79A32;animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── Bandeau de recette ── */
.proto{
  background:var(--encre);color:var(--creme);font-size:11.5px;text-align:center;
  padding:9px 16px;line-height:1.5;
}
.proto b{color:var(--or-clair)}
.pied .pied-societe{letter-spacing:.16em}

/* ── Pied de page ── */
.pied{
  flex:0 0 auto;border-top:1px solid var(--bord);background:var(--sable);
  padding:26px 20px 30px;text-align:center;
}
.pied .pied-marque{font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--encre)}
.pied .pied-societe{font-size:10.5px;letter-spacing:.16em;color:var(--or-texte);margin-top:6px;font-weight:500}
.pied nav{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin:18px 0 16px}
.pied nav a{font-size:12.5px;color:var(--muted);text-decoration:none;padding:6px 2px;min-height:24px}
.pied nav a:hover{text-decoration:underline;text-underline-offset:3px}
.pied .mention{font-size:11px;color:var(--gris);line-height:1.7}

@media(max-width:380px){
  .enveloppe{padding:22px 15px 34px}
  .carte{padding:26px 19px}
  h1{font-size:22px}
}
</style>
</head>
<body>

<a class="saut" href="#vue">Aller au contenu</a>

<div class="proto" id="bandeau-recette">
  <b>Version de recette</b> — Club Privé Élévia, Modules 1 et 2. Les comptes créés ici sont réels.
</div>

<main class="enveloppe">
  <div class="marque">
    <div class="blason" id="blason"></div>
    <div class="nom">ÉLÉVIA</div>
    <div class="sous">CLUB PRIVÉ</div>
    <div class="filet"></div>
  </div>
  <div id="vue"></div>
</main>

<footer class="pied">
  <div class="pied-marque">ÉLÉVIA</div>
  <div class="pied-societe" id="pied-societe"></div>
  <nav aria-label="Informations légales">
    <a href="../cgu/">Conditions d'utilisation</a>
    <a href="../confidentialite/">Politique de confidentialité</a>
    <a id="pied-contact" href="#">Nous contacter</a>
  </nav>
  <p class="mention">
    Vos données sont hébergées en Europe et traitées de manière confidentielle.<br>
    <span id="pied-copyright"></span>
  </p>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   MARQUE — le seul bloc à modifier quand la Cliente fournit ses éléments.
   Recette du 08/08/2026 : points 1, 2 et 8 de sa liste.
   ═══════════════════════════════════════════════════════════════ */
const MARQUE = {
  // Logo officiel de la Cliente, reçu le 14/08/2026. Deux déclinaisons tirées du
  // même fichier : le monogramme en tête de chaque écran, le logo complet en
  // ouverture. Fond détouré, donc posable sur n'importe quel fond.
  logo: "../assets/monogramme-elevia.png",
  logoComplet: "../assets/logo-elevia.png",

  societe: "YNL CLUB",

  // Adresse de contact affichée aux membres.
  // EN ATTENTE : la Cliente a proposé support@elevia.fr et contact@ynlclub.com,
  // qui supposent un nom de domaine qu'elle n'a pas encore acheté (Contrat Art. 10,
  // le domaine est acheté par la Cliente, à son nom). On retient donc la seule
  // adresse existante et prouvée à ce jour.
  contact: "clubpriveeelevia@gmail.com",

  // Photographie d'accueil. EN ATTENTE de la Cliente (rooftop, hôtel, salon privé,
  // voyage). Tant qu'elle est vide, un visuel de marque dessiné maison s'affiche :
  // on n'invente pas une photo, et on ne pose pas d'image de banque sans licence.
  photoAccueil: "",

  // Bandeau « Version de recette ». À passer sur false pour une présentation
  // investisseur, à condition d'assumer que les comptes créés restent réels.
  recette: true,
};

/* ═══════════ Configuration technique ═══════════ */
const API = "https://lgdgbrivnhgeupqhkckd.supabase.co/functions/v1/elevia-auth";
const CLE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZGdicml2bmhnZXVwcWhrY2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDI1OTEsImV4cCI6MjA5NTU3ODU5MX0.kMmpwsQAUJQ6VkEpj4OOloijP1HoZbYYzbjWW2hg7Gk";

/* Durée de validité du code, alignée sur la base (el_codes.expire_at = 10 minutes).
   La Cliente proposait un compte à rebours de 02:00 : ce serait afficher une durée
   fausse, et faire redemander un code encore valable pendant huit minutes. */
const CODE_MINUTES = 10;

/* Ouvert au monde entier : décision de la Cliente du 05/08/2026, pour ne pas
   écarter une diaspora en restreignant la liste. On part des codes ISO 3166-1
   officiels et on laisse le navigateur produire le nom en français : une liste
   de noms figée se périme, les codes non. Les territoires sans population
   permanente (Antarctique, îles désertes) sont écartés : ce ne sont pas des
   pays de résidence. */
const CODES = ("AF AX AL DZ AS AD AO AI AG AR AM AW AU AT AZ BS BH BD BB BY BE BZ BJ BM BT BO BQ BA BW BR "
  + "IO BN BG BF BI CV KH CM CA KY CF TD CL CN CX CC CO KM CG CD CK CR CI HR CU CW CY CZ DK DJ DM DO EC EG "
  + "SV GQ ER EE SZ ET FK FO FJ FI FR GF PF GA GM GE DE GH GI GR GL GD GP GU GT GG GN GW GY HT VA HN HK HU "
  + "IS IN ID IR IQ IE IM IL IT JM JP JE JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV "
  + "ML MT MH MQ MR MU YT MX FM MD MC MN ME MS MA MZ MM NA NR NP NL NC NZ NI NE NG NU NF MK MP NO OM PK PW "
  + "PS PA PG PY PE PH PN PL PT PR QA RE RO RU RW BL SH KN LC MF PM VC WS SM ST SA SN RS SC SL SG SX SK SI "
  + "SB SO ZA SS ES LK SD SR SJ SE CH SY TW TJ TZ TH TL TG TK TO TT TN TR TM TC TV UG UA AE GB US UY UZ VU "
  + "VE VN VG VI WF EH YE ZM ZW").split(" ");

const PAYS = (function () {
  let nom = (c) => c;
  try {
    const dn = new Intl.DisplayNames(["fr"], { type: "region" });
    if (dn.of("CI") !== "CI") nom = (c) => dn.of(c) || c;
  } catch (_) { /* navigateur ancien : on retombe sur le code, jamais sur une page vide */ }
  return CODES.map((c) => ({ code: c, nom: nom(c) }))
              .sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
})();

/* Recherche insensible aux accents : « cote d ivoire » doit trouver Côte d'Ivoire.
   Sans cela, la moitié de la cible ne trouve pas son propre pays au clavier. */
const aplat = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
PAYS.forEach((p) => { p.cle = aplat(p.nom); });

const $ = (s) => document.querySelector(s);
const vue = $("#vue");
const etat = { pas: 1, form: {}, email: "", membre: null, jeton: localStorage.getItem("elevia_jeton") || "" };

const ech = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* Icônes maison, jamais d'emoji dans l'interface. */
const ICONE = {
  ok:   '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  non:  '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  horloge: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>',
  bouclier: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9V6z"/></svg>',
  globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>',
};

async function appel(action, corps = {}) {
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: CLE, Authorization: "Bearer " + CLE },
      body: JSON.stringify({ action, ...corps }),
    });
    return await r.json();
  } catch (_) {
    return { ok: false, error: "La connexion a échoué. Vérifiez votre réseau et réessayez." };
  }
}

function rendre(html) {

  rendre(`

        <input id="i-pseudo" type="text" maxlength="24" autocomplete="off" autocapitalize="words"
               spellcheck="false" placeholder="AlexandraParis" aria-describedby="a-pseudo x-pseudo"
               value="${ech(etat.form.pseudo || "")}">
        <p class="aide" id="a-pseudo" role="status" aria-live="polite">Entre 3 et 24 caractères.</p>
        <p class="exemples" id="x-pseudo">Par exemple <b>AlexandraParis</b> ou <b>Voyageur75</b>.</p>
      </div>

      <button class="lien" id="b-retour">Retour</button>
    </div>`);

  const champ = $("#i-pseudo"), aide = $("#a-pseudo"), suite = $("#b-suite"), compteur = $("#c-pseudo");
  let minuteur = null, libre = false;

  const majCompteur = () => { compteur.textContent = champ.value.length + " / 24"; };

  const dire = (classe, texte, icone) => {
    aide.className = "aide" + (classe ? " " + classe : "");
    aide.innerHTML = (icone || "") + "<span>" + ech(texte) + "</span>";
  };

  const verifier = async () => {
    const v = champ.value.trim();
    libre = false; suite.disabled = true; champ.removeAttribute("aria-invalid");
    if (v.length < 3) { dire("", "Entre 3 et 24 caractères."); return; }
    dire("", "Vérification…");
    try {
      const r = await fetch("https://lgdgbrivnhgeupqhkckd.supabase.co/rest/v1/rpc/el_pseudo_libre", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: CLE, Authorization: "Bearer " + CLE },
        body: JSON.stringify({ p: v }),
      });
      const dispo = await r.json();
      if (champ.value.trim() !== v) return;            // une frappe plus récente a pris la main
      libre = dispo === true;
      if (libre) dire("ok", "Disponible", ICONE.ok);
      else { dire("non", "Déjà utilisé", ICONE.non); champ.setAttribute("aria-invalid", "true"); }
      suite.disabled = !libre;
    } catch (_) {
      dire("", "Vérification impossible pour le moment.");
    }
  };

  champ.oninput = () => { majCompteur(); clearTimeout(minuteur); minuteur = setTimeout(verifier, 350); };
  champ.onkeydown = (e) => { if (e.key === "Enter" && libre) suite.click(); };
  majCompteur();
  if (champ.value.trim().length >= 3) verifier();
  champ.focus();

  suite.onclick = () => { etat.form.pseudo = champ.value.trim(); ecranProfil(); };
  $("#b-retour").onclick = ecranAccueil;
}

/* ── Sélecteur de pays : recherche, autocomplétion, clavier ──
   La liste native de 240 entrées obligeait à faire défiler très longtemps sur
   téléphone. Ici, trois lettres suffisent. Le champ reste un vrai champ texte :
   on retient le code seulement quand une option est réellement choisie. */
function monterCombo() {
  const champ = $("#i-pays"), liste = $("#l-pays");
  let visibles = [], curseur = -1;

  const fermer = () => {
    liste.classList.remove("ouverte");
    champ.setAttribute("aria-expanded", "false");
    champ.removeAttribute("aria-activedescendant");
    curseur = -1;
  };

  const peindre = () => {
    liste.innerHTML = visibles.length
      ? visibles.map((p, i) => `<div role="option" id="opt-${p.code}" data-code="${p.code}"
           aria-selected="${etat.form.pays_code === p.code}" class="${i === curseur ? "survol" : ""}">${ech(p.nom)}</div>`).join("")
      : `<div class="combo-vide">Aucun pays ne correspond à cette recherche.</div>`;
    liste.classList.add("ouverte");
    champ.setAttribute("aria-expanded", "true");
    liste.querySelectorAll('[role="option"]').forEach((o) => {
      // mousedown et non click : le clic arrive après le blur, qui a déjà fermé la liste.
      o.onmousedown = (e) => { e.preventDefault(); choisir(o.dataset.code); };
    });
  };

  const chercher = (q) => {
    const k = aplat(q);
    visibles = !k ? PAYS.slice(0, 60)
      : PAYS.filter((p) => p.cle.includes(k))
            .sort((a, b) => (a.cle.startsWith(k) ? 0 : 1) - (b.cle.startsWith(k) ? 0 : 1))
            .slice(0, 60);
    curseur = visibles.length ? 0 : -1;
    peindre();
  };

  const choisir = (code) => {
    const p = PAYS.find((x) => x.code === code);
    if (!p) return;
    etat.form.pays = p.nom; etat.form.pays_code = p.code;
    champ.value = p.nom;
    fermer();
    champ.focus();
  };

  champ.oninput = () => {
    // Toute frappe annule le choix précédent : sinon on garderait un code
    // qui ne correspond plus au texte affiché.
    etat.form.pays = ""; etat.form.pays_code = "";
    chercher(champ.value);
  };
  champ.onfocus = () => chercher(champ.value);
  champ.onblur = () => setTimeout(fermer, 120);

  champ.onkeydown = (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!liste.classList.contains("ouverte")) return chercher(champ.value);
      if (!visibles.length) return;
      curseur = (curseur + (e.key === "ArrowDown" ? 1 : -1) + visibles.length) % visibles.length;
      peindre();
      const el = liste.querySelector(".survol");
      if (el) { el.scrollIntoView({ block: "nearest" }); champ.setAttribute("aria-activedescendant", el.id); }
    } else if (e.key === "Enter") {
      if (liste.classList.contains("ouverte") && curseur >= 0 && visibles[curseur]) {
        e.preventDefault(); choisir(visibles[curseur].code);
      }
    } else if (e.key === "Escape") {
      fermer();
    }
  };
}

function majoriteMax() {
  const d = new Date();
  d.setFullYear(d.getFullYear() - 18);
  return d.toISOString().slice(0, 10);

/* ═══════════ Code à 6 chiffres ═══════════ */
let ticCode = null;

function ecranCode(msg) {
  clearInterval(ticCode);
  rendre(`
    <div class="carte anime">
      <span class="etiquette">CONFIRMATION</span>
      <h2>Votre code vient de partir</h2>
      <p class="chapo">Nous l'avons envoyé à <strong>${ech(etat.email)}</strong>.</p>
      ${erreur(msg)}

        <label for="i-code">Code à 6 chiffres</label>
        <input id="i-code" class="code" type="text" inputmode="numeric" maxlength="6"
               autocomplete="one-time-code" placeholder="••••••" aria-describedby="m-code">
      </div>
      <p class="minuteur" id="m-code" role="status" aria-live="polite"></p>
      <button class="bouton" id="b-entrer" style="margin-top:18px" disabled>Entrer</button>
      <button class="lien" id="b-renvoi" hidden>Recevoir un nouveau code</button>
    </div>`);

  const champ = $("#i-code"), entrer = $("#b-entrer"), pendule = $("#m-code"), renvoi = $("#b-renvoi");
  champ.focus();

  /* Compte à rebours sur la vraie durée de validité. Le bouton de renvoi
     n'apparaît qu'à l'expiration : proposé trop tôt, il fait demander un
     second code qui invalide le premier, et le membre saisit le mauvais. */
  let reste = CODE_MINUTES * 60;
  const peindre = () => {
    if (reste > 0) {
      const mm = String(Math.floor(reste / 60)).padStart(2, "0");
      const ss = String(reste % 60).padStart(2, "0");
      pendule.className = "minuteur";
      pendule.innerHTML = `Ce code est valable encore <b>${mm}:${ss}</b>.`;
      renvoi.hidden = true;
    } else {
      pendule.className = "minuteur fini";
      pendule.textContent = "Ce code a expiré.";
      renvoi.hidden = false;
      clearInterval(ticCode);
    }
  };
  peindre();
  ticCode = setInterval(() => { reste -= 1; peindre(); }, 1000);

  champ.oninput = () => {
    champ.value = champ.value.replace(/\D/g, "").slice(0, 6);
    entrer.disabled = champ.value.length !== 6;
    if (champ.value.length === 6) entrer.click();
  };

  entrer.onclick = async () => {
    entrer.disabled = true; entrer.textContent = "Vérification…";
    const r = await appel("verifier", { email: etat.email, code: champ.value });
    if (!r.ok) { entrer.textContent = "Entrer"; return ecranCode(r.error); }
    clearInterval(ticCode);
    etat.jeton = r.jeton; etat.membre = r.membre;
    localStorage.setItem("elevia_jeton", r.jeton);
    ecranMembre(true);
  };

  renvoi.onclick = async () => {
    renvoi.disabled = true; renvoi.textContent = "Envoi…";
    const r = await appel("connexion", { email: etat.email });
    ecranCode(r && r.ok === false ? r.error : "Un nouveau code vient de vous être envoyé.");
  };
}

   personne de l'équipe. C'est ce que promet l'avenant, et c'est ce qui
   évite de manipuler une donnée biométrique.                          */
const VERIF = "https://lgdgbrivnhgeupqhkckd.supabase.co/functions/v1/elevia-verif";

  try {

        Vous allez enregistrer une courte vidéo en faisant deux gestes simples, tirés au sort.
        Une personne de notre équipe la regarde, jamais un automate.
        <b>La vidéo est supprimée définitivement dans les 24 heures qui suivent la décision</b>,
        et aucune analyse de votre visage n'est effectuée.
      </div>
      <button class="bouton or" id="b-camera">Activer ma caméra</button>
      <button class="lien" id="b-plus-tard">Plus tard</button>
    </div>`);
  $("#b-camera").onclick = ecranVerifCamera;
  $("#b-plus-tard").onclick = () => ecranMembre(false);
}

async function ecranVerifCamera() {
  rendre(`
    <div class="carte anime">
      <span class="etiquette">VÉRIFICATION</span>
      <h2>Un instant…</h2>
      <p class="chapo">Votre navigateur va vous demander l'autorisation d'utiliser la caméra.</p>
    </div>`);

  let flux;
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
      audio: false,
    });
  } catch (e) {
    // Le CDC demande un message d'aide, pas un simple échec.
    const refus = e && (e.name === "NotAllowedError" || e.name === "SecurityError");
    rendre(`
      <div class="carte anime">
        <span class="etiquette">VÉRIFICATION</span>
        <h2>${refus ? "L'accès à la caméra a été refusé" : "Aucune caméra n'a été trouvée"}</h2>
        <p class="chapo">${refus
          ? "Pour autoriser l'accès : touchez l'icône de cadenas (ou de caméra) à gauche de l'adresse du site, en haut de votre navigateur, puis activez la caméra et rechargez la page."
          : "Vérifiez qu'une caméra est bien connectée et qu'aucune autre application ne l'utilise en ce moment."}</p>
        <button class="bouton" id="b-reessayer">Réessayer</button>
        <button class="lien" id="b-retour">Revenir à mon profil</button>
      </div>`);
    $("#b-reessayer").onclick = ecranVerifCamera;
    $("#b-retour").onclick = () => ecranMembre(false);
    return;
  }

  fluxCamera = flux;
  const dem = await appelVerif("demarrer");
  if (!dem.ok) { couperCamera(); return ecranVerifIntro(dem.error); }

  /* Les gestes arrivent en liste depuis le serveur pour être numérotés ① ②.
     Une version antérieure de la fonction ne renvoyait qu'une phrase : dans ce
     cas on l'affiche telle quelle plutôt que de la découper au hasard, car
     certains gestes contiennent eux-mêmes « , puis ». */
  const gestes = Array.isArray(dem.gestes) && dem.gestes.length ? dem.gestes : null;
  const consigne = gestes
    ? `<ul class="consignes">${gestes.map((g, i) =>
        `<li><span class="rang">${i + 1}</span><span>${ech(g.charAt(0).toUpperCase() + g.slice(1))}</span></li>`).join("")}</ul>`
    : `<p class="chapo" style="color:var(--encre);font-size:15.5px"><strong>${ech(dem.defi)}</strong></p>`;

  rendre(`
    <div class="carte anime">
      <span class="etiquette">VÉRIFICATION</span>
      <h2>Votre geste à faire</h2>
      ${consigne}
      <div style="position:relative;border-radius:14px;overflow:hidden;background:#000;margin-bottom:18px">
        <video id="apercu" autoplay muted playsinline style="width:100%;display:block;transform:scaleX(-1)"></video>
        <div id="pastille" style="position:absolute;top:12px;left:12px;background:rgba(0,35,75,.78);color:#fff;
          font-size:12px;padding:5px 11px;border-radius:20px;display:none">● Enregistrement <span id="reste">8</span> s</div>
      </div>
      <button class="bouton or" id="b-lancer">Lancer l'enregistrement</button>
      <button class="lien" id="b-annuler">Annuler</button>
    </div>`);

  const video = $("#apercu");
  video.srcObject = flux;

  $("#b-annuler").onclick = () => { couperCamera(); ecranMembre(false); };

  $("#b-lancer").onclick = () => {
    const type = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"]
      .find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    // Débit plafonné à 800 kb/s. Sans cela, un iPhone produit ~8 Mo pour 8
    // secondes : un envoi très long, et souvent perdu, sur les connexions
    // mobiles depuis lesquelles la diaspora se connectera. À ce débit, la vidéo
    // pèse moins d'un mégaoctet et reste largement assez nette pour qu'un agent
    // reconnaisse un visage et un geste, seul usage qu'on en fait.
    let enregistreur;
    const reglages = { videoBitsPerSecond: 800000 };
    try {
      enregistreur = new MediaRecorder(flux, type ? { mimeType: type, ...reglages } : reglages);
    } catch (_) {
      couperCamera();
      return ecranVerifIntro("Votre navigateur ne permet pas d'enregistrer une vidéo. Essayez depuis un autre navigateur.");
    }

    const morceaux = [];
    enregistreur.ondataavailable = (e) => { if (e.data.size) morceaux.push(e.data); };
    enregistreur.onstop = () => {
      const blob = new Blob(morceaux, { type: enregistreur.mimeType || "video/webm" });
      couperCamera();
      ecranVerifEnvoi(dem, blob);
    };

    $("#b-lancer").disabled = true;
    $("#b-lancer").textContent = "Enregistrement en cours…";
    $("#pastille").style.display = "block";
    enregistreur.start();

    let reste = 8;
    const tic = setInterval(() => {
      reste -= 1;
      const el = $("#reste");
      if (el) el.textContent = reste;
      if (reste <= 0) {
        clearInterval(tic);
        if (enregistreur.state !== "inactive") enregistreur.stop();
      }
    }, 1000);
  };
}

function ecranVerifEnvoi(dem, blob) {
  const url = URL.createObjectURL(blob);
  rendre(`
    <div class="carte anime">
      <span class="etiquette">VÉRIFICATION</span>
      <h2>Cette vidéo vous convient-elle ?</h2>
      <p class="chapo">Vérifiez qu'on vous voit bien, et que le geste demandé apparaît clairement.</p>
      <div style="border-radius:14px;overflow:hidden;background:#000;margin-bottom:18px">
        <video src="${url}" controls playsinline style="width:100%;display:block"></video>
      </div>
      <div id="zone-msg"></div>
      <button class="bouton or" id="b-envoyer">Envoyer pour vérification</button>
      <button class="lien" id="b-refaire">Recommencer</button>
    </div>`);

  $("#b-refaire").onclick = () => { URL.revokeObjectURL(url); ecranVerifCamera(); };

  $("#b-envoyer").onclick = async () => {
    const b = $("#b-envoyer");
    b.disabled = true; b.textContent = "Envoi en cours…";
    try {
      // Safari annonce « video/mp4;codecs=avc1.4d002a ». Le stockage compare le
      // type à l'identique et refuse tout ce qui porte un suffixe de codec :
      // on ne garde donc que le type de base. Sans cela, l'envoi échoue sur
      // iPhone alors que l'enregistrement s'est parfaitement déroulé.
      const type = (blob.type || "video/webm").split(";")[0].trim();

      // La vidéo va directement au stockage privé, sans transiter par nos fonctions.
      const dep = await fetch(dem.url_depot, {
        method: "PUT",
        headers: { "Content-Type": type },
        body: blob,
      });
      if (!dep.ok) throw new Error("dépôt " + dep.status + " · " + type);
      const r = await appelVerif("soumettre", { id: dem.id });
      if (!r.ok) throw new Error(r.error);
      URL.revokeObjectURL(url);
      etat.membre.statut_verif = "en_attente";
      ecranDemandeEnregistree();
    } catch (e) {
      b.disabled = false; b.textContent = "Envoyer pour vérification";
      // Le détail sert au diagnostic pendant la phase de recette : sans lui,
      // un échec d'envoi est indiscernable d'une coupure de réseau.
      $("#zone-msg").innerHTML = erreur("L'envoi n'a pas abouti. Vérifiez votre connexion et réessayez.")
        + `<p class="aide" style="margin:-12px 0 18px">Détail technique : ${ech(String(e && e.message || e))}</p>`;
    }
  };
}

/* ═══════════ Demande enregistrée ═══════════
   Écran à part entière, et non un simple bandeau au-dessus du profil : c'est le
   moment où la personne a confié son visage et attend une réponse. */
function ecranDemandeEnregistree() {
  rendre(`
    <div class="carte anime" style="text-align:center">
      <div class="medaille" style="margin-bottom:16px">${ICONE.ok}</div>
      <h2>Merci</h2>
      <p class="chapo" style="margin-bottom:20px">Votre demande d'adhésion est bien enregistrée.</p>
      <div class="jauge"><span class="point"></span>En cours de vérification</div>
      <p class="chapo" style="margin:22px 0 0">
        Notre équipe examine actuellement votre dossier. Vous recevrez un e-mail dès qu'une décision sera prise.<br>
        <span style="color:var(--encre)">Délai habituel : 24 à 48 heures ouvrées.</span>
      </p>
    </div>
    <div class="carte anime-2">
      <button class="bouton" id="b-profil">Revenir à mon profil</button>
    </div>`);
  const m = vue.querySelector(".medaille svg");
  if (m) { m.style.width = "30px"; m.style.height = "30px"; m.style.stroke = "var(--or-fonce)"; m.style.strokeWidth = "2.4"; m.style.fill = "none"; }
  $("#b-profil").onclick = () => ecranMembre(false);
}

/* ═══════════ Espace membre ═══════════ */
function ecranMembre(bienvenue, info) {
  clearInterval(ticCode);
  const m = etat.membre;
  const verif = {
    non_soumis: ['attente', "Vérification à faire"],
    en_attente: ['attente', "Vérification en cours"],
    valide:     ['valide',  "Compte vérifié"],
    refuse:     ['attente', "À recommencer"],
  }[m.statut_verif] || ['attente', "Vérification à faire"];

  // Le bloc « prochaine étape » dépend de là où en est le membre : un profil déjà
  // vérifié n'a rien à refaire, et une vidéo en attente ne doit pas être renvoyée.
  const bloc = {
    valide: {
      titre: "Votre profil est vérifié",
      texte: "Notre équipe a confirmé votre identité. Le badge est visible par les autres membres.",
      bouton: null,
    },
    en_attente: {
      titre: "Votre vidéo est entre nos mains",
      texte: "Notre équipe l'examine. Vous recevrez la réponse par e-mail. Délai habituel : 24 à 48 heures ouvrées. Tant que la décision n'est pas prise, votre demande reste visible ici, sans blocage silencieux.",
      bouton: null,
    },
    refuse: {
      titre: "La vérification n'a pas abouti",
      texte: "Vous pouvez recommencer autant de fois que nécessaire, il n'y a aucune limite.",
      bouton: "Refaire ma vidéo",
    },
  }[m.statut_verif] || {
    titre: "Faire vérifier votre profil",
    texte: "La vérification par vidéo garantit que chaque membre du Club est une personne réelle. Elle est examinée par notre équipe, jamais par un automate, et la vidéo est supprimée dans les 24 heures suivant la décision.",
    bouton: "Commencer la vérification",
  };

  rendre(`
    ${bienvenue ? '<div class="message succes" role="status">Bienvenue au Club. Votre compte est créé.</div>' : ""}
    ${info ? `<div class="message succes" role="status">${ech(info)}</div>` : ""}
    <div class="carte anime">
      <div class="profil-tete">
        <div class="medaille">${ech(m.pseudo.slice(0, 1).toUpperCase())}</div>
        <div class="pseudo">${ech(m.pseudo)}</div>
        <div style="margin-top:10px">
          <span class="badge ${verif[0]}">
            ${verif[0] === "valide" ? ICONE.ok : ICONE.horloge}
            ${verif[1]}
          </span>
        </div>
      </div>
      <div class="ligne"><span class="cle">Pays de résidence</span><span class="val">${ech(m.pays)}</span></div>
      <div class="ligne"><span class="cle">Membre depuis</span><span class="val">${new Date(m.created_at).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</span></div>
    </div>

    <div class="carte anime-2">
      <span class="etiquette">${m.statut_verif === "valide" ? "CONFIANCE" : "PROCHAINE ÉTAPE"}</span>
      <h2>${bloc.titre}</h2>
      <p class="chapo" style="margin-bottom:${bloc.bouton ? "20px" : "0"}">${bloc.texte}</p>
      ${m.motif_refus ? `<div class="message info" style="margin-bottom:18px">Motif indiqué par notre équipe : ${ech(m.motif_refus)}</div>` : ""}
      ${bloc.bouton ? `<button class="bouton or" id="b-verif">${bloc.bouton}</button>` : ""}
    </div>

    <div class="carte anime-2">
      <button class="lien" id="b-sortir" style="margin:0">Me déconnecter</button>
    </div>`);

  // Surtout pas « onclick = ecranVerifIntro » : le navigateur passerait l'événement
  // du clic en premier argument, qui finirait affiché en bandeau rouge sous la
  // forme « [object PointerEvent] ». Toute fonction d'écran qui accepte un message
  // doit être appelée à travers une lambda.
  if ($("#b-verif")) $("#b-verif").onclick = () => ecranVerifIntro();

  // Deux cas où l'écran seul ne suffit pas à comprendre, et où l'on va chercher
  // le détail de la dernière demande : un refus sans son motif, et une demande
  // expirée faute d'avoir été traitée en 30 jours. Le drapeau évite de boucler.
  if (!etat.verifLue && (m.statut_verif === "refuse" || m.statut_verif === "non_soumis")) {
    etat.verifLue = true;
    appelVerif("etat").then((r) => {
      if (!r.ok || !r.derniere) return;
      if (r.derniere.motif && m.statut_verif === "refuse") {
        etat.membre.motif_refus = r.derniere.motif;
        return ecranMembre(false, info);
      }
      if (r.derniere.statut === "expire") {
        ecranMembre(false, "Votre précédente demande a expiré sans avoir été examinée, et la vidéo a été supprimée. Vous pouvez en soumettre une nouvelle.");
      }
    });
  }

  $("#b-sortir").onclick = async () => {
    await appel("deconnexion", { jeton: etat.jeton });
    localStorage.removeItem("elevia_jeton");
    etat.jeton = ""; etat.membre = null; etat.form = {};
    ecranAccueil();
  };
}

/* ═══════════ Démarrage ═══════════ */
(async function () {
  if (etat.jeton) {
    const r = await appel("moi", { jeton: etat.jeton });
    if (r.ok) { etat.membre = r.membre; return ecranMembre(false); }
    localStorage.removeItem("elevia_jeton");
  }
  ecranAccueil();
})();
</script>
</body>
</html>
