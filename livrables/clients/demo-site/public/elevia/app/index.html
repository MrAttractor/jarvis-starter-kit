<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Privé Élévia</title>
<meta name="robots" content="noindex">
<meta name="description" content="Club privé international. L'adhésion se mérite, la discrétion se cultive.">
<!--
  CLUB PRIVÉ ÉLÉVIA — prototype fonctionnel, Module 1 du CDC.
  Identité, inscription, connexion par code à 6 chiffres, profil.
  Stack maison : HTML/CSS/JS natif + edge function elevia-auth (service role).
  Aucune donnée de membre n'est lisible avec la clé publique : tout passe par la fonction.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#181614; --creme:#FBF9F5; --sable:#F0EAE0; --blanc:#FFFFFF;
  --or:#B99A63; --or-clair:#D4BC8E; --or-fonce:#96794A;
  --muted:#6B6459; --gris:#8F887C; --bord:#EAE4D8;
  --succes:#2F9E63; --alerte:#B3403A;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --ombre:0 8px 30px rgba(24,22,20,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--encre);background:var(--creme);
  line-height:1.6;overflow-x:hidden;min-height:100vh;
}
img{max-width:100%}
.enveloppe{max-width:560px;margin:0 auto;padding:28px 20px 56px;width:100%}

/* ── En-tête de marque ── */
.marque{text-align:center;margin-bottom:34px}
.marque .nom{font-family:var(--serif);font-size:30px;letter-spacing:.14em;line-height:1}
.marque .sous{font-size:9.5px;letter-spacing:.3em;color:var(--or);margin-top:8px;font-weight:500}
.filet{width:44px;height:1px;background:var(--or);margin:16px auto 0;opacity:.6}

/* ── Cartes ── */
.carte{
  background:var(--blanc);border:1px solid var(--bord);border-radius:16px;
  padding:32px 26px;box-shadow:var(--ombre);
}
.carte + .carte{margin-top:16px}
h1{font-family:var(--serif);font-size:25px;line-height:1.25;font-weight:500;margin-bottom:10px}
h2{font-family:var(--serif);font-size:19px;font-weight:500;margin-bottom:8px}
.chapo{color:var(--muted);font-size:14.5px;margin-bottom:26px}
.etiquette{
  display:inline-block;font-size:9.5px;letter-spacing:.22em;color:var(--or);
  font-weight:700;margin-bottom:12px;
}

/* ── Progression ── */
.pas{display:flex;gap:6px;margin-bottom:26px}
.pas i{flex:1;height:2px;background:var(--sable);border-radius:2px;transition:background .3s}
.pas i.fait{background:var(--or)}

/* ── Champs ── */
.champ{margin-bottom:20px}
label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:7px}
input,select{
  width:100%;padding:14px 15px;border:1px solid var(--bord);border-radius:10px;
  font-size:16px;font-family:inherit;color:var(--encre);background:var(--creme);
  min-height:48px;
}
input:focus,select:focus{outline:none;border-color:var(--or);background:var(--blanc)}
select{appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6459' stroke-width='2'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center;background-size:16px;padding-right:42px}
.aide{font-size:12px;color:var(--gris);margin-top:6px;line-height:1.5}
.aide.ok{color:var(--succes)}
.aide.non{color:var(--alerte)}

/* ── Genre : deux choix ── */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo button{
  padding:14px;border:1px solid var(--bord);border-radius:10px;background:var(--creme);
  font-family:inherit;font-size:14.5px;color:var(--muted);cursor:pointer;min-height:48px;
  transition:border-color .15s,color .15s,background .15s;
}
.duo button.actif{border-color:var(--or);background:var(--blanc);color:var(--encre);font-weight:500;
  box-shadow:0 0 0 3px rgba(185,154,99,.12)}

/* ── Cases à cocher ── */
.coche{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;cursor:pointer}
.coche input{width:19px;height:19px;min-height:0;flex:0 0 auto;margin-top:2px;accent-color:var(--or)}
.coche span{font-size:13px;color:var(--muted);line-height:1.55}
.coche a{color:var(--or-fonce)}

/* ── Boutons ── */
.bouton{
  width:100%;padding:16px;border:none;border-radius:10px;background:var(--encre);color:var(--creme);
  font-family:inherit;font-size:15px;font-weight:500;letter-spacing:.03em;cursor:pointer;
  min-height:52px;transition:background .15s,opacity .15s;
}
.bouton:hover:not(:disabled){background:#2A2622}
.bouton:disabled{opacity:.4;cursor:not-allowed}
.bouton.or{background:var(--or);color:var(--blanc)}
.bouton.or:hover:not(:disabled){background:var(--or-fonce)}
.lien{
  display:block;width:100%;background:none;border:none;padding:14px;margin-top:6px;
  font-family:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;text-decoration:underline;
  min-height:44px;
}

/* ── Code à 6 chiffres ── */
.code{
  width:100%;text-align:center;font-family:var(--serif);font-size:32px;
  letter-spacing:.32em;padding:18px 15px 18px 25px;
}
.code::placeholder{letter-spacing:.2em;font-size:22px;color:#CFC8BC}

/* ── Messages ── */
.message{
  padding:13px 15px;border-radius:10px;font-size:13.5px;line-height:1.55;margin-bottom:20px;
}
.message.erreur{background:#FBEDEC;color:#8C302B;border:1px solid #F0D5D3}
.message.info{background:var(--sable);color:var(--muted)}
.message.succes{background:#EAF6EF;color:#1E7346;border:1px solid #CFE9DA}

/* ── Profil ── */
.profil-tete{text-align:center;padding-bottom:24px;border-bottom:1px solid var(--bord);margin-bottom:24px}
.medaille{
  width:76px;height:76px;border-radius:50%;background:var(--sable);border:1px solid var(--or);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  font-family:var(--serif);font-size:30px;color:var(--or-fonce);
}
.pseudo{font-family:var(--serif);font-size:23px;font-weight:500}
.ligne{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--bord);font-size:14px}
.ligne:last-of-type{border-bottom:none}
.ligne .cle{color:var(--muted)}
.ligne .val{font-weight:500;text-align:right}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
  font-size:11.5px;font-weight:500;
}
.badge.attente{background:var(--sable);color:var(--muted)}
.badge.valide{background:#EAF6EF;color:#1E7346}
.badge svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.4;fill:none}

/* ── Bandeau prototype ── */
.proto{
  background:var(--encre);color:var(--creme);font-size:11.5px;text-align:center;
  padding:9px 16px;line-height:1.5;
}
.proto b{color:var(--or-clair)}

.pied{text-align:center;font-size:11px;color:var(--gris);margin-top:26px;line-height:1.7}
.pied a{color:var(--muted)}

@media(max-width:380px){
  .enveloppe{padding:22px 15px 44px}
  .carte{padding:26px 19px}
  h1{font-size:22px}
}
</style>
</head>
<body>

<div class="proto">
  <b>Prototype fonctionnel</b> — Club Privé Élévia, Module 1. Les comptes créés ici sont réels.
</div>

<main class="enveloppe">
  <div class="marque">
    <div class="nom">ÉLÉVIA</div>
    <div class="sous">CLUB PRIVÉ</div>
    <div class="filet"></div>
  </div>
  <div id="vue"></div>
  <p class="pied">
    Vos données sont hébergées en Europe.<br>
    Une question ? <a href="mailto:hello@agenceattractor.com">hello@agenceattractor.com</a>
  </p>
</main>

<script>
/* ═══════════ Configuration ═══════════ */
const API = "https://lgdgbrivnhgeupqhkckd.supabase.co/functions/v1/elevia-auth";
const CLE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZGdicml2bmhnZXVwcWhrY2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDI1OTEsImV4cCI6MjA5NTU3ODU5MX0.kMmpwsQAUJQ6VkEpj4OOloijP1HoZbYYzbjWW2hg7Gk";

/* Liste provisoire. Le CDC (Module 1) prévoit que la Cliente arrête la liste
   définitive des pays de résidence : monde entier ou sélection de pays cibles. */
const PAYS = ["Belgique","France","Suisse","Luxembourg","Canada","États-Unis","Royaume-Uni",
  "Allemagne","Espagne","Italie","Pays-Bas","Portugal","Côte d'Ivoire","Sénégal","Cameroun",
  "Bénin","Togo","Mali","Burkina Faso","Guinée","Gabon","Congo","RD Congo","Maroc","Algérie",
  "Tunisie","Émirats arabes unis","Qatar","Afrique du Sud","Nigeria","Ghana","Kenya","Autre"];

const $ = (s) => document.querySelector(s);
const vue = $("#vue");
const etat = { pas: 1, form: {}, email: "", membre: null, jeton: localStorage.getItem("elevia_jeton") || "" };

const ech = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

async function appel(action, corps = {}) {
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: CLE, Authorization: "Bearer " + CLE },
      body: JSON.stringify({ action, ...corps }),
    });
    return await r.json();
  } catch (_) {
    return { ok: false, error: "La connexion a échoué. Vérifiez votre réseau et réessayez." };
  }
}

function rendre(html) { vue.innerHTML = html; window.scrollTo({ top: 0, behavior: "smooth" }); }
const erreur = (m) => m ? `<div class="message erreur">${ech(m)}</div>` : "";
const barre = (n) => `<div class="pas">${[1,2,3].map(i=>`<i class="${i<=n?"fait":""}"></i>`).join("")}</div>`;

/* ═══════════ Accueil ═══════════ */
function ecranAccueil() {
  rendre(`
    <div class="carte">
      <span class="etiquette">SUR INVITATION</span>
      <h1>Un cercle où chaque rencontre a été méritée</h1>
      <p class="chapo">Élévia réunit des personnes exigeantes, à travers le monde. Chaque profil est vérifié par notre équipe. Votre identité réelle n'est jamais rendue publique.</p>
      <button class="bouton or" id="b-adherer">Demander mon adhésion</button>
      <button class="lien" id="b-connexion">J'ai déjà un compte</button>
    </div>`);
  $("#b-adherer").onclick = () => { etat.pas = 1; ecranPseudo(); };
  $("#b-connexion").onclick = () => ecranConnexion();
}

/* ═══════════ Étape 1 — pseudo ═══════════ */
function ecranPseudo(msg) {
  rendre(`
    <div class="carte">
      ${barre(1)}
      <span class="etiquette">ÉTAPE 1 SUR 3</span>
      <h2>Sous quel nom souhaitez-vous être connu ?</h2>
      <p class="chapo">C'est le seul nom que les autres membres verront. Votre identité réelle reste privée.</p>
      ${erreur(msg)}
      <div class="champ">
        <label for="i-pseudo">Votre pseudonyme</label>
        <input id="i-pseudo" type="text" maxlength="24" autocomplete="off" placeholder="Alexandra" value="${ech(etat.form.pseudo || "")}">
        <p class="aide" id="a-pseudo">Entre 3 et 24 caractères.</p>
      </div>
      <button class="bouton" id="b-suite" disabled>Continuer</button>
      <button class="lien" id="b-retour">Retour</button>
    </div>`);

  const champ = $("#i-pseudo"), aide = $("#a-pseudo"), suite = $("#b-suite");
  let minuteur = null, libre = false;

  const verifier = async () => {
    const v = champ.value.trim();
    libre = false; suite.disabled = true;
    if (v.length < 3) { aide.className = "aide"; aide.textContent = "Entre 3 et 24 caractères."; return; }
    aide.className = "aide"; aide.textContent = "Vérification…";
    try {
      const r = await fetch("https://lgdgbrivnhgeupqhkckd.supabase.co/rest/v1/rpc/el_pseudo_libre", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: CLE, Authorization: "Bearer " + CLE },
        body: JSON.stringify({ p: v }),
      });
      const dispo = await r.json();
      if (champ.value.trim() !== v) return;            // une frappe plus récente a pris la main
      libre = dispo === true;
      aide.className = "aide " + (libre ? "ok" : "non");
      aide.textContent = libre ? "Ce nom est disponible." : "Ce nom est déjà porté par un membre.";
      suite.disabled = !libre;
    } catch (_) {
      aide.className = "aide"; aide.textContent = "Vérification impossible pour le moment.";
    }
  };

  champ.oninput = () => { clearTimeout(minuteur); minuteur = setTimeout(verifier, 350); };
  champ.onkeydown = (e) => { if (e.key === "Enter" && libre) suite.click(); };
  if (champ.value.trim().length >= 3) verifier();
  champ.focus();

  suite.onclick = () => { etat.form.pseudo = champ.value.trim(); ecranProfil(); };
  $("#b-retour").onclick = ecranAccueil;
}

/* ═══════════ Étape 2 — profil ═══════════ */
function ecranProfil(msg) {
  const f = etat.form;
  rendre(`
    <div class="carte">
      ${barre(2)}
      <span class="etiquette">ÉTAPE 2 SUR 3</span>
      <h2>Quelques mots sur vous</h2>
      <p class="chapo">Ces informations nous permettent de vous présenter les bons profils.</p>
      ${erreur(msg)}
      <div class="champ">
        <label>Vous êtes</label>
        <div class="duo">
          <button type="button" data-g="femme" class="${f.genre === "femme" ? "actif" : ""}">Une femme</button>
          <button type="button" data-g="homme" class="${f.genre === "homme" ? "actif" : ""}">Un homme</button>
        </div>
      </div>
      <div class="champ">
        <label for="i-pays">Pays de résidence</label>
        <select id="i-pays">
          <option value="">Choisissez…</option>
          ${PAYS.map((p) => `<option ${f.pays === p ? "selected" : ""}>${p}</option>`).join("")}
        </select>
      </div>
      <div class="champ">
        <label for="i-naissance">Date de naissance</label>
        <input id="i-naissance" type="date" value="${ech(f.date_naissance || "")}" max="${majoriteMax()}">
        <p class="aide">L'adhésion est réservée aux personnes majeures.</p>
      </div>
      <button class="bouton" id="b-suite">Continuer</button>
      <button class="lien" id="b-retour">Retour</button>
    </div>`);

  document.querySelectorAll(".duo button").forEach((b) => {
    b.onclick = () => {
      etat.form.genre = b.dataset.g;
      document.querySelectorAll(".duo button").forEach((x) => x.classList.toggle("actif", x === b));
    };
  });

  $("#b-suite").onclick = () => {
    const pays = $("#i-pays").value, naiss = $("#i-naissance").value;
    if (!etat.form.genre) return ecranProfil("Merci d'indiquer si vous êtes une femme ou un homme.");
    if (!pays) return ecranProfil("Merci d'indiquer votre pays de résidence.");
    if (!naiss) return ecranProfil("Merci d'indiquer votre date de naissance.");
    if (naiss > majoriteMax()) {
      etat.form.date_naissance = "";
      return ecranProfil("L'adhésion au Club est réservée aux personnes majeures.");
    }
    etat.form.pays = pays; etat.form.date_naissance = naiss;
    ecranEngagement();
  };
  $("#b-retour").onclick = () => ecranPseudo();
}

function majoriteMax() {
  const d = new Date();
  d.setFullYear(d.getFullYear() - 18);
  return d.toISOString().slice(0, 10);
}

/* ═══════════ Étape 3 — e-mail et engagements ═══════════ */
function ecranEngagement(msg) {
  rendre(`
    <div class="carte">
      ${barre(3)}
      <span class="etiquette">ÉTAPE 3 SUR 3</span>
      <h2>Votre adresse e-mail</h2>
      <p class="chapo">Elle reste privée. Elle sert uniquement à vous connecter, sans mot de passe à retenir.</p>
      ${erreur(msg)}
      <div class="champ">
        <label for="i-email">Adresse e-mail</label>
        <input id="i-email" type="email" autocomplete="email" placeholder="vous@exemple.com" value="${ech(etat.form.email || "")}">
      </div>
      <label class="coche">
        <input type="checkbox" id="i-cgu">
        <span>J'accepte les <a href="#" onclick="return false">conditions d'utilisation</a> et la <a href="#" onclick="return false">politique de confidentialité</a>.</span>
      </label>
      <label class="coche">
        <input type="checkbox" id="i-optin">
        <span>Je souhaite recevoir les suggestions de profils compatibles par e-mail. (facultatif)</span>
      </label>
      <button class="bouton or" id="b-valider" style="margin-top:12px">Rejoindre le Club</button>
      <button class="lien" id="b-retour">Retour</button>
    </div>`);

  $("#b-valider").onclick = async () => {
    const email = $("#i-email").value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return ecranEngagement("Cette adresse e-mail ne semble pas valide.");
    if (!$("#i-cgu").checked) {
      etat.form.email = email;
      return ecranEngagement("L'acceptation des conditions est nécessaire pour rejoindre le Club.");
    }
    etat.form.email = email;
    const b = $("#b-valider"); b.disabled = true; b.textContent = "Un instant…";
    const r = await appel("inscription", { ...etat.form, cgu: true, optin: $("#i-optin").checked });
    if (!r.ok) { b.disabled = false; b.textContent = "Rejoindre le Club"; return ecranEngagement(r.error); }
    etat.email = email;
    ecranCode(r.email_envoye ? null : "Votre compte est créé, mais l'envoi du code a échoué. Utilisez « recevoir un nouveau code ».");
  };
  $("#b-retour").onclick = () => ecranProfil();
}

/* ═══════════ Code à 6 chiffres ═══════════ */
function ecranCode(msg) {
  rendre(`
    <div class="carte">
      <span class="etiquette">CONFIRMATION</span>
      <h2>Votre code vient de partir</h2>
      <p class="chapo">Nous l'avons envoyé à <strong>${ech(etat.email)}</strong>. Il est valable dix minutes.</p>
      ${erreur(msg)}
      <div class="champ">
        <label for="i-code">Code à 6 chiffres</label>
        <input id="i-code" class="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
      </div>
      <button class="bouton" id="b-entrer" disabled>Entrer</button>
      <button class="lien" id="b-renvoi">Recevoir un nouveau code</button>
    </div>`);

  const champ = $("#i-code"), entrer = $("#b-entrer");
  champ.focus();
  champ.oninput = () => {
    champ.value = champ.value.replace(/\D/g, "").slice(0, 6);
    entrer.disabled = champ.value.length !== 6;
    if (champ.value.length === 6) entrer.click();
  };

  entrer.onclick = async () => {
    entrer.disabled = true; entrer.textContent = "Vérification…";
    const r = await appel("verifier", { email: etat.email, code: champ.value });
    if (!r.ok) { entrer.textContent = "Entrer"; return ecranCode(r.error); }
    etat.jeton = r.jeton; etat.membre = r.membre;
    localStorage.setItem("elevia_jeton", r.jeton);
    ecranMembre(true);
  };

  $("#b-renvoi").onclick = async () => {
    await appel("connexion", { email: etat.email });
    ecranCode("Un nouveau code vient de vous être envoyé.");
  };
}

/* ═══════════ Connexion ═══════════ */
function ecranConnexion(msg) {
  rendre(`
    <div class="carte">
      <span class="etiquette">MEMBRES</span>
      <h2>Content de vous revoir</h2>
      <p class="chapo">Entrez votre adresse e-mail, nous vous envoyons un code de connexion.</p>
      ${erreur(msg)}
      <div class="champ">
        <label for="i-email">Adresse e-mail</label>
        <input id="i-email" type="email" autocomplete="email" placeholder="vous@exemple.com">
      </div>
      <button class="bouton" id="b-code">Recevoir mon code</button>
      <button class="lien" id="b-retour">Retour</button>
    </div>`);

  $("#i-email").focus();
  $("#b-code").onclick = async () => {
    const email = $("#i-email").value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return ecranConnexion("Cette adresse e-mail ne semble pas valide.");
    const b = $("#b-code"); b.disabled = true; b.textContent = "Envoi…";
    await appel("connexion", { email });
    etat.email = email;
    // Réponse volontairement identique que le compte existe ou non.
    ecranCode(null);
  };
  $("#b-retour").onclick = ecranAccueil;
}

/* ═══════════ Espace membre ═══════════ */
function ecranMembre(bienvenue) {
  const m = etat.membre;
  const verif = {
    non_soumis: ['attente', "Vérification à faire"],
    en_attente: ['attente', "Vérification en cours"],
    valide:     ['valide',  "Profil vérifié"],
    refuse:     ['attente', "À recommencer"],
  }[m.statut_verif] || ['attente', "Vérification à faire"];

  rendre(`
    ${bienvenue ? '<div class="message succes">Bienvenue au Club. Votre compte est créé.</div>' : ""}
    <div class="carte">
      <div class="profil-tete">
        <div class="medaille">${ech(m.pseudo.slice(0, 1).toUpperCase())}</div>
        <div class="pseudo">${ech(m.pseudo)}</div>
        <div style="margin-top:10px">
          <span class="badge ${verif[0]}">
            ${verif[0] === "valide"
              ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
              : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>'}
            ${verif[1]}
          </span>
        </div>
      </div>
      <div class="ligne"><span class="cle">Pays de résidence</span><span class="val">${ech(m.pays)}</span></div>
      <div class="ligne"><span class="cle">Membre depuis</span><span class="val">${new Date(m.created_at).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</span></div>
    </div>

    <div class="carte">
      <span class="etiquette">PROCHAINE ÉTAPE</span>
      <h2>Faire vérifier votre profil</h2>
      <p class="chapo" style="margin-bottom:20px">La vérification par vidéo garantit que chaque membre du Club est une personne réelle. Elle est examinée par notre équipe, jamais par un automate, et la vidéo est supprimée dans les 24 heures suivant la décision.</p>
      <button class="bouton" disabled>Bientôt disponible</button>
      <p class="aide" style="text-align:center;margin-top:10px">Ce module arrive à l'étape suivante du prototype.</p>
    </div>

    <div class="carte">
      <button class="lien" id="b-sortir" style="margin:0">Me déconnecter</button>
    </div>`);

  $("#b-sortir").onclick = async () => {
    await appel("deconnexion", { jeton: etat.jeton });
    localStorage.removeItem("elevia_jeton");
    etat.jeton = ""; etat.membre = null; etat.form = {};
    ecranAccueil();
  };
}

/* ═══════════ Démarrage ═══════════ */
(async function () {
  if (etat.jeton) {
    const r = await appel("moi", { jeton: etat.jeton });
    if (r.ok) { etat.membre = r.membre; return ecranMembre(false); }
    localStorage.removeItem("elevia_jeton");
  }
  ecranAccueil();
})();
</script>
</body>
</html>
