function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = useState(false);
  const dragRef = useRef(null);
  const offsetRef = useRef({ x: 16, y: 16 });

  useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd">
          <b>{title}</b>
          <button className="twk-x" onClick={() => setOpen(false)}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) {
  return <div className="twk-sect">{label}</div>;
}

function TweakRadio({ label, value, options, onChange }) {
  const idx = Math.max(0, options.indexOf(value));
  const n = options.length;
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div className="twk-seg">
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {options.map(o => (
          <button key={o} type="button" onClick={() => onChange(o)}>{o}</button>
        ))}
      </div>
    </div>
  );
}

const todayStats = (orders) => {
  const enc = orders.filter(o => o.status !== 'Retard').reduce((s, o) => s + o.paid, 0);
  const due = orders.reduce((s, o) => s + (o.total - o.paid), 0);
  const dueCount = orders.filter(o => o.total - o.paid > 0).length;
  const late = orders.filter(o => o.status === 'Retard').length;
  return { enc, due, dueCount, late, count: orders.length };
};

const Sparkline = ({ data, w = 150, h = 46 }) => {
  const max = Math.max(...data), min = Math.min(...data);
  const nx = (i) => (i / (data.length - 1)) * w;
  const ny = (v) => h - ((v - min) / (max - min || 1)) * (h - 6) - 3;
  const pts = data.map((v, i) => [nx(i), ny(v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${w} ${h} L0 ${h} Z`;
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ overflow: 'visible' }}>
      <defs>
        <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#fff" stopOpacity=".5" />
          <stop offset="1" stopColor="#fff" stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill="url(#spark)" />
      <path d={line} fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="3.6" fill="#fff" />
    </svg>
  );
};

  <div className="col" style={{ flex: 1, alignItems: 'center', justifyContent: 'center', padding: '24px 22px', gap: 22, textAlign: 'center' }}>
    <div className="anim-up" style={{ width: 80, height: 80, borderRadius: 50, background: 'linear-gradient(135deg,#1F8A4C,#27A85E)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <Icon n="check" s={40} w={2.6} c="#fff" />
    </div>
    <div className="col anim-up" style={{ gap: 10, animationDelay: '80ms' }}>
      <div style={{ fontSize: 22, fontWeight: 800 }}>Commande envoyée !</div>
      <div className="t-sm mut" style={{ lineHeight: 1.55 }}>Merci {nom}. Beracca vous contacte sous<br />30 min via WhatsApp pour confirmer.</div>
    </div>
    <div className="card col g8 anim-up" style={{ padding: '14px 16px', width: '100%', textAlign: 'left', animationDelay: '140ms' }}>
      <div className="row between center t-sm"><span className="mut">Montant</span><F v={total} size={15} /></div>
      <div className="row between center t-sm"><span className="mut">Statut</span><span className="badge grn"><span className="dot" />En traitement</span></div>
    </div>
    <button className="btn soft block anim-up" style={{ animationDelay: '200ms' }} onClick={onRestart}>
      <Icon n="plus" s={17} w={2.3} c="var(--accent-d)" /> Nouvelle commande
    </button>
  </div>
);

const buildClientOrder = (cart, info) => {
  const lines = CLIENT_PRODUCTS.filter(p => (cart[p.id] || 0) > 0).map(p => [p.name, cart[p.id], p.price * cart[p.id]]);
  const total = calcTotal(cart);
  const kgMap = { soutra: 49.5, eco: 54, family: 55.5, pro: 28.5 };
  const kg = Math.round(CLIENT_PRODUCTS.reduce((s, p) => s + (cart[p.id] || 0) * (kgMap[p.id] || 1), 0) * 10) / 10;
  const now = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  return { id: 1000 + Math.floor(Math.random() * 900), client: info.nom, kg, total, paid: 0, pay: info.pay, status: 'Reçue', time: now, zone: info.zone, lines };
};

function ClientViewStage({ onClientOrder }) {
  const [screen, setScreen] = useState('catalog');
  const [cart, setCart] = useState({});
  const [doneInfo, setDoneInfo] = useState(null);
  const total = calcTotal(cart);
  return (
    <Stage>
      <Phone>
        <div key={screen} className="col anim-slide" style={{ position: 'absolute', inset: 0, top: 0 }}>
          {screen === 'catalog' && <ClientCatalog cart={cart} setCart={setCart} onNext={() => setScreen('cart')} />}
          {screen === 'cart' && <ClientCart cart={cart} setCart={setCart} onNext={() => setScreen('form')} onBack={() => setScreen('catalog')} />}
          {screen === 'form' && <ClientForm total={total} onBack={() => setScreen('cart')} onSubmit={info => {
            setDoneInfo(info);
            setScreen('done');
            if (onClientOrder) onClientOrder(buildClientOrder(cart, info));
          }} />}
          {screen === 'done' && <ClientDone nom={(doneInfo && doneInfo.nom) || ''} total={total} onRestart={() => { setCart({}); setDoneInfo(null); setScreen('catalog'); }} />}
        </div>
      </Phone>
    </Stage>
  );
}

/* ============================================================
   APP ROOT
   ============================================================ */
const TWEAK_DEFAULTS = { "accent": "Orange" };

const TABS = [
  { id: 'home', icon: 'home', label: 'Accueil' },
  { id: 'caisse', icon: 'wallet', label: 'Caisse' },
];

function App({ onClientOrder: _unused, injectOrder }) {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]);
  const [orders, setOrders] = useState(ORDERS_SEED.map(o => ({ ...o })));
  const [toast, setToast] = useState(null);
  const [notifCount, setNotifCount] = useState(0);

  useEffect(() => {
    document.documentElement.classList.toggle('hf-accent-green', t.accent === 'Vert');
  }, [t.accent]);

  useEffect(() => {
    if (!injectOrder) return;
    setOrders(prev => [injectOrder, ...prev]);
    setNotifCount(c => c + 1);
    flash('🛎️ Nouvelle commande de ' + injectOrder.client + ' !');
  }, [injectOrder]);

  const top = stack[stack.length - 1] || null;
  const go = (scr) => {
    if (scr.name === 'back') { setStack(s => s.slice(0, -1)); return; }
    if (scr.name === 'home') { setStack([]); setTab('home'); return; }
    setStack(s => [...s, scr]);
  };
  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };

  const createOrder = (data) => {
    const id = Math.max(...orders.map(o => o.id)) + 1;
    setOrders(prev => [{ id, ...data }, ...prev]);
    setStack([]); setTab('orders');
    flash('Commande #' + id + ' enregistrée ✓');
  };
  const advance = (id) => setOrders(prev => prev.map(o => {
    if (o.id !== id) return o;
    const cur = o.status === 'Payée' ? 'Livrée' : o.status;
    const ni = STATUS_FLOW.indexOf(cur) + 1;
    return ni < STATUS_FLOW.length ? { ...o, status: STATUS_FLOW[ni] } : o;
  }));
  const payRest = (id) => { setOrders(prev => prev.map(o => o.id === id ? { ...o, paid: o.total, pay: o.pay === 'Partiel' ? 'Espèces' : o.pay } : o)); flash('Paiement encaissé ✓'); };

  const orderById = (id) => orders.find(o => o.id === id);
  const clientById = (id) => CLIENTS.find(c => c.id === id);

  const renderTab = () => {
    if (tab === 'home') return <HomeScreen orders={orders} go={go} notifCount={notifCount} clearNotifs={() => setNotifCount(0)} setTab={(x) => { setTab(x); setStack([]); }} />;
    if (tab === 'orders') return <OrdersScreen orders={orders} go={go} />;
    if (tab === 'clients') return <ClientsScreen orders={orders} go={go} />;
    if (tab === 'caisse') return <CaisseScreen orders={orders} />;
  };

  const renderTop = () => {
    if (!top) return null;
    if (top.name === 'order') return <OrderScreen go={go} onCreate={createOrder} />;
    if (top.name === 'order-detail') return <OrderDetail order={orderById(top.id)} go={go} onAdvance={advance} onPay={payRest} />;
    if (top.name === 'client-detail') return <ClientDetail client={clientById(top.id)} orders={orders} go={go} />;
    return null;
  };

  const showNav = !top || top.name === 'order-detail' || top.name === 'client-detail';
  const fullOverlay = top && top.name === 'order';

  return (
    <Stage>
      <Phone>
        <div className="col" style={{ position: 'absolute', inset: 0, top: 0, display: 'flex' }}>
          <div className="col grow" style={{ minHeight: 0, position: 'relative' }}>
            {!fullOverlay && (
              <div key={tab} className="col grow" style={{ minHeight: 0 }}>{renderTab()}</div>
            )}
            {top && (
              <div key={stack.length + top.name} className="col anim-slide" style={{ position: 'absolute', inset: 0, background: 'var(--paper)', zIndex: 10, display: 'flex' }}>
                {renderTop()}
              </div>
            )}
          </div>
          {showNav && !fullOverlay && top === null && (
            <div className="hf-nav" style={{ alignItems: 'flex-end', paddingBottom: 20 }}>
              <div className={'it ' + (tab === 'home' ? 'on' : '')} onClick={() => { setTab('home'); setStack([]); }}>
                <Icon n="home" s={23} w={tab === 'home' ? 2.3 : 1.9} />
                Accueil
              </div>
              <div style={{ flex: '0 0 auto', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, padding: '0 6px' }}>
                <button onClick={() => go({ name: 'order' })} style={{
                  width: 56, height: 56, borderRadius: 18, background: 'var(--accent)', border: 'none', cursor: 'pointer',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  boxShadow: '0 6px 22px rgba(204,92,8,.42)', transform: 'translateY(-14px)', flexShrink: 0
                }}>
                  <Icon n="plus" s={26} w={2.5} c="#fff" />
                </button>
                <span style={{ fontSize: 10, fontWeight: 700, color: 'var(--muted)', marginTop: -10, letterSpacing: .2 }}>Saisir</span>
              </div>
              <div className={'it ' + (tab === 'caisse' ? 'on' : '')} onClick={() => { setTab('caisse'); setStack([]); }}>
                <Icon n="wallet" s={23} w={tab === 'caisse' ? 2.3 : 1.9} />
                Caisse
              </div>
            </div>
          )}
        </div>
        {toast && (
          <div className="anim-up" style={{ position: 'absolute', left: 18, right: 18, bottom: 104, zIndex: 60,
            background: '#221F1A', color: '#fff', padding: '13px 16px', borderRadius: 14, fontWeight: 700,
            fontSize: 14, textAlign: 'center', boxShadow: 'var(--shadow-lg)' }}>{toast}</div>
        )}
      </Phone>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Apparence" />
        <TweakRadio label="Couleur d'accent" value={t.accent} options={['Orange', 'Vert']}
          onChange={(v) => setTweak('accent', v)} />
      </TweaksPanel>
    </Stage>
  );
}

function Root() {
  const [view, setView] = useState('client');
  const [injectOrder, setInjectOrder] = useState(null);

  const handleClientOrder = (order) => {
    setInjectOrder(order);
    setTimeout(() => setInjectOrder(null), 100);
  };

  return (
    <>
      {view === 'manager' ? <App injectOrder={injectOrder} /> : <ClientViewStage onClientOrder={handleClientOrder} />}
      <div style={{ position: 'fixed', top: 14, left: '50%', transform: 'translateX(-50%)', zIndex: 9999,
        display: 'flex', alignItems: 'center', gap: 3,
        background: 'rgba(34,31,26,.92)', backdropFilter: 'blur(16px)',
        borderRadius: 100, padding: '4px 5px', boxShadow: '0 4px 24px rgba(0,0,0,.45)' }}>
        <span style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: .8, color: 'rgba(255,255,255,.32)',
          padding: '0 8px 0 6px', textTransform: 'uppercase' }}>Vue</span>
        {[['client', 'Client'], ['manager', 'Beracca']].map(([v, label]) => (
          <button key={v} onClick={() => setView(v)} style={{
            padding: '8px 17px', borderRadius: 100, border: 'none', cursor: 'pointer',
            fontWeight: 700, fontSize: 12, letterSpacing: .1,
            background: view === v ? '#EE7C1F' : 'transparent',
            color: view === v ? '#fff' : 'rgba(255,255,255,.42)'
          }}>{label}</button>
        ))}
      </div>
    </>
  );
}

document.getElementById('boot').remove();
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
