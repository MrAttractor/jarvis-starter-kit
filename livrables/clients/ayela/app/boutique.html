<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ayêla — Ma boutique</title>
<meta name="theme-color" content="#150e08">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#DA6A1E; --brand-2:#C29433; --ink:#2A1D12; --ink2:#5f5040; --muted:#8a7a66;
  --cream:#F7EFE2; --card:#FFFFFF; --line:#EBE0CF; --line2:#DccBb0; --espresso:#150e08;
  --ok:#1f7a44; --okbg:#e7f4ea; --danger:#b8402f; --dangerbg:#fbe6e2;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100%;line-height:1.5;overflow-x:hidden}
img{max-width:100%;display:block}
.app{max-width:500px;margin:0 auto;min-height:100vh;padding-bottom:96px}

/* header */
.hd{position:relative;background:
  radial-gradient(600px 240px at 85% -30%,rgba(218,106,30,.35),transparent 60%),
  linear-gradient(150deg,#241811,#150e08);color:#fff;padding:26px 22px 30px;overflow:hidden}
.hd .top{display:flex;align-items:center;gap:13px}
.hd .logo{height:50px;width:50px;border-radius:13px;background:#fff;padding:5px;flex:none;object-fit:contain}
.hd .co{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-2)}
.hd h1{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.05;margin-top:2px}
.hd .zone{font-size:12.5px;color:#cdbca6;margin-top:2px}
.hd .rule{height:1px;background:linear-gradient(90deg,transparent,rgba(194,148,51,.5),transparent);margin:18px 0 0}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;margin-top:18px;background:rgba(255,255,255,.08);border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.summary div{background:rgba(21,14,8,.35);padding:11px 8px;text-align:center}
.summary .lb{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#b7a48b}
.summary .v{font-family:var(--serif);font-size:22px;font-weight:600;color:#fff;margin-top:2px}
.summary .v.g{color:var(--brand-2)}

.wrap{padding:18px 16px 8px}
.lead{font-size:13.5px;color:var(--ink2);margin:2px 4px 16px;text-align:center}

/* product card */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(42,29,18,.03)}
.card .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:13px}
.card .nm{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.05}
.card .fmt{font-size:11.5px;color:var(--muted);margin-top:2px}
.card .pr{font-size:12.5px;color:var(--brand-2);font-weight:600;white-space:nowrap}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.chip{text-align:center;min-width:56px}
.chip .lb{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip .v{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--ink);line-height:1}
.chip.rest .v{color:var(--brand)} .chip.rest.low .v{color:var(--danger)}
.sell{display:flex;flex-direction:column;align-items:center;gap:5px}
.sell .lb{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qty{display:flex;align-items:center;background:var(--cream);border:1px solid var(--line2);border-radius:13px;overflow:hidden}
.qty button{width:42px;height:44px;border:none;background:transparent;color:var(--ink);font-size:21px;cursor:pointer}
.qty button:active{background:rgba(218,106,30,.12)}
.qty input{width:52px;height:44px;border:none;background:transparent;text-align:center;font-size:17px;font-weight:600;font-family:var(--sans);color:var(--ink)}
.qty input:focus{outline:none}
.card .ca{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);text-align:right}
.card .ca b{color:var(--ink);font-weight:600}

/* reappro */
.reappro{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:15px;font-family:var(--sans);font-size:14.5px;font-weight:600;cursor:pointer;margin-top:6px;background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.reappro.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* sticky save */
.sticky{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,var(--cream) 72%,rgba(247,239,226,0));display:flex;justify-content:center}
.sticky .in{max-width:500px;width:100%}
.save{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:none;border-radius:16px;font-family:var(--sans);font-size:16px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--brand),#c85f16);box-shadow:0 12px 26px rgba(218,106,30,.32)}
.save:disabled{opacity:.55;box-shadow:none}

.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px;line-height:1.8;padding:0 20px}
.msg{text-align:center;padding:70px 26px;color:var(--muted)}
.msg .m{width:60px;height:60px;border-radius:16px;margin:0 auto 16px;background:#fff;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.msg h2{font-family:var(--serif);font-size:26px;color:var(--ink);margin-bottom:8px;font-weight:600}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--espresso);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="msg"><img class="m" src="assets/logo.jpg" alt="Ayêla"><h2>Ayêla</h2><p>Chargement de ta boutique…</p></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://lgdgbrivnhgeupqhkckd.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZGdicml2bmhnZXVwcWhrY2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDI1OTEsImV4cCI6MjA5NTU3ODU5MX0.kMmpwsQAUJQ6VkEpj4OOloijP1HoZbYYzbjWW2hg7Gk';
const {createClient}=supabase;
const sb=createClient(SUPABASE_URL,SUPABASE_ANON);
let TOKEN=new URLSearchParams(location.search).get('p');
if(!TOKEN){ const m=location.pathname.match(/\/b\/([^\/?#]+)/); if(m) TOKEN=decodeURIComponent(m[1]); }
let DATA=null, dirty={};

function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function fmtF(n){return (n||0).toLocaleString('fr')+' F';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function venduOf(l){return dirty[l.id]!=null?dirty[l.id]:(l.vendu||0);}

async function load(){
  if(!TOKEN){ document.getElementById('app').innerHTML='<div class="msg"><img class="m" src="assets/logo.jpg"><h2>Lien invalide</h2><p>Demande à Ayêla le lien de ta boutique.</p></div>'; return; }
  const {data,error}=await sb.rpc('ay_boutique_data',{p_token:TOKEN});
  if(error || !data){ document.getElementById('app').innerHTML='<div class="msg"><img class="m" src="assets/logo.jpg"><h2>Boutique introuvable</h2><p>Ce lien n\'est plus valide. Contacte Ayêla.</p></div>'; return; }
  DATA=data; render();
}

function render(){
  const lignes=DATA.lignes||[];
  const tDep=lignes.reduce((s,l)=>s+(l.depose||0),0);
  const tVen=lignes.reduce((s,l)=>s+venduOf(l),0);
  const tRest=tDep-tVen;
  let cards;
  if(!lignes.length){
    cards='<div class="card"><div class="msg" style="padding:26px 10px"><p>Aucun produit n\'a encore été déposé dans ta boutique.<br>Ayêla va le faire bientôt.</p></div></div>';
  } else {
    cards='<div class="lead">Indique ce que tu as <b>vendu</b> pour chaque produit. Le reste se calcule tout seul.</div>'+
      lignes.map(l=>{
        const reste=(l.depose||0)-venduOf(l);
        const pu=l.prix_unitaire||0;
        return `<div class="card">
          <div class="ph">
            <div><div class="nm">${esc(l.produit_nom)}</div><div class="fmt">${esc(l.format||'')}</div></div>
            ${pu?`<div class="pr">${fmtF(pu)}</div>`:''}
          </div>
          <div class="line">
            <div class="chip"><div class="lb">Déposé</div><div class="v">${l.depose||0}</div></div>
            <div class="sell"><div class="lb">Vendu</div>
              <div class="qty">
                <button onclick="bump('${l.id}',-1)" aria-label="moins">−</button>
                <input id="v-${l.id}" type="number" inputmode="numeric" min="0" autocomplete="off" value="${venduOf(l)}" onchange="setV('${l.id}',this.value)">
                <button onclick="bump('${l.id}',1)" aria-label="plus">+</button>
              </div>
            </div>
            <div class="chip rest ${reste<=0?'low':''}"><div class="lb">Reste</div><div class="v" id="r-${l.id}">${reste}</div></div>
          </div>
          ${pu?`<div class="ca">Vendu : <b id="ca-${l.id}">${fmtF(venduOf(l)*pu)}</b></div>`:''}
        </div>`;
      }).join('');
  }
  document.getElementById('app').innerHTML=`
    <div class="hd">
      <div class="top">
        <img class="logo" src="assets/logo.jpg" alt="Ayêla">
        <div><div class="co">Ayêla · Ma boutique</div><h1>${esc(DATA.nom||'')}</h1><div class="zone">${esc(DATA.zone||'')}${DATA.contact_nom?' · '+esc(DATA.contact_nom):''}</div></div>
      </div>
      ${lignes.length?`<div class="summary">
        <div><div class="lb">Déposé</div><div class="v">${tDep}</div></div>
        <div><div class="lb">Vendu</div><div class="v g">${tVen}</div></div>
        <div><div class="lb">Reste</div><div class="v">${tRest}</div></div>
      </div>`:'<div class="rule"></div>'}
    </div>
    <div class="wrap">
      ${cards}
      <button class="reappro ${DATA.demande_reappro?'on':''}" id="reappro-btn" onclick="toggleReappro()">${DATA.demande_reappro?'✓ Réapprovisionnement demandé':'📦 Demander un réapprovisionnement'}</button>
      <div class="foot"><b>Ayêla SARL</b> · Merci de tenir ta boutique à jour 🧡<br>Tes saisies remontent directement à Ayêla.</div>
    </div>
    ${lignes.length?`<div class="sticky"><div class="in"><button class="save" id="save-btn" onclick="saveAll()">Enregistrer mes ventes</button></div></div>`:''}`;
}

function setV(id,val){ dirty[id]=Math.max(0,parseInt(val||'0',10)); recompute(id); }
function bump(id,d){ const inp=document.getElementById('v-'+id); const nv=Math.max(0,parseInt(inp.value||'0',10)+d); inp.value=nv; dirty[id]=nv; recompute(id); refreshSummary(); }
function recompute(id){
  const l=(DATA.lignes||[]).find(x=>x.id===id); if(!l) return;
  const vendu=venduOf(l), reste=(l.depose||0)-vendu, pu=l.prix_unitaire||0;
  const r=document.getElementById('r-'+id); if(r){r.textContent=reste; r.parentElement.classList.toggle('low',reste<=0);}
  const ca=document.getElementById('ca-'+id); if(ca) ca.textContent=fmtF(vendu*pu);
  refreshSummary();
}
function refreshSummary(){
  const lignes=DATA.lignes||[];
  const tDep=lignes.reduce((s,l)=>s+(l.depose||0),0), tVen=lignes.reduce((s,l)=>s+venduOf(l),0);
  const box=document.querySelectorAll('.summary .v'); if(box.length===3){ box[0].textContent=tDep; box[1].textContent=tVen; box[2].textContent=tDep-tVen; }
}
async function saveAll(){
  const ids=Object.keys(dirty);
  if(!ids.length){ toast('Rien de nouveau à enregistrer'); return; }
  const btn=document.getElementById('save-btn'); btn.disabled=true; btn.textContent='Enregistrement…';
  let okc=0;
  for(const id of ids){
    const {data,error}=await sb.rpc('ay_boutique_vente',{p_token:TOKEN,p_ligne:id,p_vendu:dirty[id]});
    if(!error && data){ okc++; const l=DATA.lignes.find(x=>x.id===id); if(l) l.vendu=dirty[id]; }
  }
  dirty={}; btn.disabled=false; btn.textContent='Enregistrer mes ventes';
  toast(okc+' produit(s) mis à jour ✅');
}
async function toggleReappro(){
  const nv=!DATA.demande_reappro;
  const {error}=await sb.rpc('ay_boutique_reappro',{p_token:TOKEN,p_val:nv});
  if(error){ toast('Oups, réessaie'); return; }
  DATA.demande_reappro=nv;
  const b=document.getElementById('reappro-btn');
  b.classList.toggle('on',nv); b.textContent=nv?'✓ Réapprovisionnement demandé':'📦 Demander un réapprovisionnement';
  toast(nv?'Réappro signalé à Ayêla 🧡':'Demande annulée');
}
load();
</script>
</body>
</html>
