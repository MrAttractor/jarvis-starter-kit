<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ma tournée — J'Envoie Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002B7F; --navy-dark:#001A55; --sky:#0BB5FF; --sky-mid:#0090D4;
    --gold:#F5C200; --green:#25D366; --ink:#0A1230;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Inter',sans-serif;color:#0A1230;
    background:linear-gradient(180deg,#001A55 0%,#002B7F 220px,#EEF3FB 220px,#EEF3FB 100%);
    min-height:100vh;padding:0 0 40px;overflow-x:hidden;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  header{padding:24px 16px 20px;color:#fff}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Sora';font-weight:800;font-size:.95rem;letter-spacing:.3px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
  h1{font-family:'Sora';font-weight:800;font-size:1.5rem;margin-top:14px;line-height:1.15}
  .sub{font-size:.82rem;color:rgba(255,255,255,.72);margin-top:6px}
  .progress-card{
    background:#fff;border-radius:16px;padding:16px 18px;margin-top:-2px;
    box-shadow:0 16px 40px rgba(0,8,35,.20);display:flex;align-items:center;gap:16px;
  }
  .ring{position:relative;width:58px;height:58px;flex:0 0 58px}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;font-size:.82rem;color:var(--navy)}
  .progress-txt .big{font-family:'Sora';font-weight:700;font-size:1.05rem}
  .progress-txt .small{font-size:.78rem;color:#5b678a;margin-top:2px}
  .quartier{font-family:'Sora';font-weight:700;font-size:.9rem;color:var(--navy);
    margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
  .quartier::before{content:"📍"}
  .card{
    background:#fff;border-radius:14px;padding:15px 16px;margin-bottom:12px;
    box-shadow:0 8px 22px rgba(0,8,35,.10);border:1px solid #e6ecf7;transition:.25s;
  }
  .card.done{opacity:.55;background:#f3f6fc}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .num{font-family:'Sora';font-weight:700;font-size:.82rem;color:var(--sky-mid);letter-spacing:.3px}
  .lbl-dest{font-size:.68rem;color:#8b94b3;margin-top:6px;text-transform:uppercase;letter-spacing:.5px}
  .prix{font-family:'Sora';font-weight:800;font-size:.9rem;color:#0A1230;background:#FFF6D3;
    padding:3px 9px;border-radius:8px;white-space:nowrap}
  .name{font-family:'Sora';font-weight:700;font-size:1.02rem;margin-top:4px}
  .articles{font-size:.82rem;color:#41496b;margin-top:7px;line-height:1.4}
  .actions{display:flex;gap:9px;margin-top:13px}
  .wa{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    background:var(--green);color:#fff;font-weight:700;font-size:.83rem;font-family:'Sora';
    padding:11px 15px;border-radius:11px;text-decoration:none;min-height:44px}
  .call{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    background:#eef2fb;color:var(--navy);padding:11px 14px;border-radius:11px;text-decoration:none;min-height:44px;font-size:1.05rem}
  .btn-livre{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--navy);color:#fff;font-weight:700;font-size:.88rem;font-family:'Sora';border:none;
    padding:12px;border-radius:11px;cursor:pointer;min-height:44px}
  .btn-livre:active{transform:scale(.98)}
  .badge-done{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:#dff5e6;color:#128a3e;font-weight:700;font-size:.88rem;font-family:'Sora';
    padding:12px;border-radius:11px;min-height:44px}
  .state{text-align:center;padding:60px 20px;color:#5b678a;font-size:.9rem}
  .state.err{color:#c0392b}
  .foot{text-align:center;font-size:.72rem;color:#8b94b3;margin-top:24px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><span class="dot"></span> J'ENVOIE EXPRESS</div>
    <h1 id="h-title">Ma tournée</h1>
    <div class="sub" id="h-sub">Chargement…</div>
  </div>
</header>

<div class="wrap">
  <div class="progress-card" id="progress" style="display:none">
    <div class="ring">
      <svg width="58" height="58"><circle cx="29" cy="29" r="25" stroke="#e6ecf7" stroke-width="7" fill="none"></circle>
        <circle id="ring-fg" cx="29" cy="29" r="25" stroke="#25D366" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="157"></circle></svg>
      <div class="val" id="ring-val">0%</div>
    </div>
    <div class="progress-txt">
      <div class="big" id="prog-big">0 / 0 livrés</div>
      <div class="small">Colis à livrer à domicile pour ce voyage</div>
    </div>
  </div>

  <div id="list"></div>
  <div class="foot">Mets à jour au fur et à mesure : appuie sur « Livré » après chaque remise.</div>
</div>

<script>
const SUPABASE_URL='https://lgdgbrivnhgeupqhkckd.supabase.co'
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZGdicml2bmhnZXVwcWhrY2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDI1OTEsImV4cCI6MjA5NTU3ODU5MX0.kMmpwsQAUJQ6VkEpj4OOloijP1HoZbYYzbjWW2hg7Gk'
const voyage=new URLSearchParams(location.search).get('v')

const ROUTE={ABJ_ORY:'Abidjan → Paris',ORY_ABJ:'Paris → Abidjan'}
const $=id=>document.getElementById(id)

function call(body){
  return fetch(`${SUPABASE_URL}/functions/v1/je-tournee`,{
    method:'POST',
    headers:{apikey:ANON,Authorization:`Bearer ${ANON}`,'content-type':'application/json'},
    body:JSON.stringify(body)
  }).then(r=>r.json())
}

function waLink(num){
  if(!num) return null
  let d=(''+num).replace(/[^0-9]/g,'')
  if(d.startsWith('00')) d=d.slice(2)
  else if(d.startsWith('0')) d='225'+d.slice(1) // numéro local CI
  return 'https://wa.me/'+d
}
function telLink(num){ return num?('tel:'+(''+num).replace(/[^0-9+]/g,'')):null }
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}

function fmtDate(d){
  if(!d) return ''
  try{return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}catch(e){return d}
}

function setProgress(done,total){
  $('progress').style.display='flex'
  const pct=total?Math.round(done/total*100):0
  $('prog-big').textContent=`${done} / ${total} livrés`
  $('ring-val').textContent=pct+'%'
  $('ring-fg').style.strokeDashoffset=157-(157*pct/100)
}

function render(data){
  const colis=data.colis||[]
  const total=colis.length
  const done=colis.filter(c=>c.statut==='livre').length
  const dArr=data.voyage.date_arrivee||data.voyage.date_depart
  $('h-sub').textContent=`Livraisons à Abidjan${dArr?' · arrivée '+fmtDate(dArr):''}`
  setProgress(done,total)

  const list=$('list')
  if(!total){ list.innerHTML='<div class="state">Aucun colis à livrer à domicile pour ce voyage.</div>'; return }

  // regroupement par quartier
  const groups={}
  colis.forEach(c=>{const q=c.quartier_abidjan||'Quartier non précisé';(groups[q]=groups[q]||[]).push(c)})

  let html=''
  Object.keys(groups).forEach(q=>{
    html+=`<div class="quartier">${esc(q)}</div>`
    groups[q].forEach(c=>{
      const exped=(c.je_clients&&c.je_clients.nom)||c.nom_expediteur||''
      // Destinataire à Abidjan : son numéro est en tête de contact_reception,
      // avant « | Collecte » (info dépôt France, inutile au livreur, qu'on masque).
      const recept=(c.contact_reception||'').split('|')[0].trim()
      const receptTel=(recept.match(/[+0-9][0-9 ]{6,}/)||[])[0]
      const wa=receptTel||(c.je_clients&&c.je_clients.whatsapp)||c.wa_expediteur||''
      const dest=recept||wa||'Numéro non précisé'
      const done=c.statut==='livre'
      const w=waLink(wa), t=telLink(wa)
      html+=`<div class="card ${done?'done':''}" id="c-${c.id}">
        <div class="card-top">
          <div>
            <div class="num">${esc(c.numero||'—')}</div>
            <div class="lbl-dest">Destinataire</div>
            <div class="name">${esc(dest)}</div>
          </div>
          ${c.prix_livraison?`<div class="prix">${c.prix_livraison}€</div>`:''}
        </div>
        ${exped?`<div class="articles"><span style="color:#8b94b3">Envoyé par </span>${esc(exped)}</div>`:''}
        ${c.articles?`<div class="articles"><span style="color:#8b94b3">Colis : </span>${esc(c.articles)}</div>`:''}
        <div class="actions">
          ${w?`<a class="wa" href="${w}" target="_blank" rel="noopener">WhatsApp</a>`:''}
          ${t?`<a class="call" href="${t}">📞</a>`:''}
          ${done
            ?`<span class="badge-done">✓ Livré</span>`
            :`<button class="btn-livre" onclick="marquer('${c.id}',this)">✓ Marquer livré</button>`}
        </div>
      </div>`
    })
  })
  list.innerHTML=html
}

let STATE=null
async function marquer(id,btn){
  btn.disabled=true; btn.textContent='…'
  const r=await call({voyage,action:'livre',colis:id})
  if(!r.ok){ btn.disabled=false; btn.textContent='✓ Marquer livré'; alert('Erreur, réessaie.'); return }
  const c=STATE.colis.find(x=>x.id===id); if(c) c.statut='livre'
  render(STATE)
}

async function init(){
  if(!voyage){ document.getElementById('list').innerHTML='<div class="state err">Lien invalide (voyage manquant).</div>'; $('h-sub').textContent=''; return }
  const r=await call({voyage,action:'list'})
  if(!r.ok){ document.getElementById('list').innerHTML='<div class="state err">'+esc(r.error||'Tournée introuvable')+'</div>'; $('h-sub').textContent=''; return }
  STATE=r
  render(r)
}
init()
</script>
</body>
</html>
