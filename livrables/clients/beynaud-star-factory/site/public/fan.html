<meta name="theme-color" content="#070707" id="meta-theme"/>
<!-- Le theme se pose sur <html> avant le premier pixel. Lu plus tard, dans le
     script principal, l'ecran clignoterait en noir avant de passer en clair.
     Sombre par defaut : c'est l'identite de latiss.net, le clair est un
     choix que le fan fait et qu'on retient. -->
<script>(function(){try{if(localStorage.getItem("bey_theme")==="clair")document.documentElement.setAttribute("data-theme","clair");}catch(e){}})();</script>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="icon" href="apple-touch-icon.png"/>

<meta name="application-name" content="latiss.net"/>
<!-- La photo de Serge est demandee des les premiers octets de la page. Avant,
     elle n'etait creee que par le script, tout en bas : le telephone attendait
     d'avoir lu 80 Ko de HTML avant meme de la reclamer, et l'ecran restait noir
     avec le seul bouton rouge. R-82. -->
<link rel="preload" as="image" href="serge-hero.webp" type="image/webp" fetchpriority="high"/>
<link rel="preconnect" href="https://www.youtube-nocookie.com"/>
<link rel="preconnect" href="https://i.ytimg.com"/>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!-- Les polices ne bloquent plus le premier affichage : elles partaient chez
     Google avant que quoi que ce soit ne soit peint, soit un aller-retour
     complet sur un domaine tiers avant la premiere image. Le "media=print"
     detourne la feuille du rendu, le onload la remet en service des qu'elle
     est la. display=swap etait deja pose, le texte ne clignote pas davantage. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800&display=swap"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null;"/>
<noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/></noscript>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  color-scheme:dark;
  --noir:#070707;--n2:#0f0f0f;--n3:#171717;--n4:#1f1f1f;--n5:#2a2a2a;
  --rouge:#CC0000;--rouge-vif:#E8000B;--rouge-glow:rgba(204,0,0,.4);
  /* ===== LE ROUGE QUI SE LIT EN PETIT =====
     Mesure du 18/09 : #CC0000 a 12 px sur une carte sombre donne 3,05:1, et
     meme #E8000B ne monte qu'a 3,79:1. Un rouge sature ne peut PAS atteindre
     4,5:1 sur du noir, quelle que soit la nuance : il faut l'eclaircir.
     #FF4D4D donne 5,5:1 sur les cartes et 6,2:1 sur le fond le plus sombre.
     C'est le meme rouge, eclairci pour le fond sur lequel il se pose ; le
     rouge de la charte reste celui des aplats et des grands titres. */
  --rouge-texte:#FF4D4D;
  --or:#D4A017;--or-plein:#D4A017;--or-dim:rgba(212,160,23,.18);
  --blanc:#fff;--doux:rgba(255,255,255,.87);--dim:rgba(255,255,255,.45);
  --tres-dim:rgba(255,255,255,.3);--faint:rgba(255,255,255,.07);
  --champ:rgba(0,0,0,.35);--piste:rgba(255,255,255,.16);--piste-douce:rgba(255,255,255,.08);
  --media:#000;--sq-hi:#262626;--amb-fond:#160800;--av1:#3a3a3a;--av2:#5a5a5a;
  --voile:rgba(7,7,7,0);--ombre:rgba(0,0,0,.7);
  --vert:#22C55E;--erreur:#ff6b6b;
  --bebas:'Bebas Neue',sans-serif;--inter:'Inter',sans-serif;--manus:'Caveat',cursive;
}
/* ===== MODE CLAIR =====
   Seuls les jetons changent : aucune regle de mise en page n'est dupliquee.
   Les valeurs ne sont pas choisies a l'oeil, elles sont calculees (R-24) :
   chaque texte reste au-dessus de 4,5:1 sur son fond. L'or de la charte
   descend a #7A5906 pour le texte, parce que le #D4A017 d'origine ne fait
   que 2,1:1 sur du blanc ; l'aplat or, lui, ne bouge pas (--or-plein).
   Le bandeau photo, l'ecran d'entree et l'ecran d'inscription restent
   sombres dans les deux themes : ce sont des images, et un texte pose sur
   une photo eclaircie n'a plus de contraste garanti. */
:root[data-theme="clair"]{
  color-scheme:light;
  --noir:#F6F5F3;--n2:#fff;--n3:#fff;--n4:#F0EEE9;--n5:#E4E1DA;
  --rouge:#B80000;--rouge-vif:#A00008;--rouge-glow:rgba(184,0,0,.22);
  /* Sur fond clair, le rouge sombre est celui qui se lit. */
  --rouge-texte:#B80000;
  --or:#7A5906;--or-dim:rgba(212,160,23,.22);
  --blanc:#141414;--doux:rgba(20,20,20,.86);--dim:rgba(20,20,20,.66);
  --tres-dim:rgba(20,20,20,.60);--faint:rgba(20,20,20,.10);
  --champ:#F0EEE9;--piste:rgba(20,20,20,.16);--piste-douce:rgba(20,20,20,.12);
  --media:#E9E6E1;--sq-hi:#E6E3DD;--amb-fond:#FFF8E8;--av1:#D8D5CF;--av2:#C4C0B8;
  --voile:rgba(246,245,243,0);--ombre:rgba(20,20,20,.16);
  --vert:#15803D;--erreur:#C81E1E;
}
/* ===== LES TROIS BLOCS PHOTO =====
   L'ecran d'entree, le bandeau et l'ecran d'inscription portent une photo de
   Serge et restent sombres dans les deux themes : un texte pose sur une photo
   eclaircie n'a plus de contraste garanti, et la photo est l'identite.
   On y redeclare donc le jeu sombre au complet, au lieu d'epingler une
   couleur a la fois. La premiere version epinglait a la main, et elle en a
   oublie trois : « Retrouver mon espace », « Revenir a l'apercu » et le
   prenom en rouge du bandeau devenaient sombres sur du sombre. Avec cette
   regle, tout ce qui sera ecrit dans ces blocs sera juste d'office. */
:root[data-theme="clair"] #splash,
:root[data-theme="clair"] .m-hero,
:root[data-theme="clair"] .join-hero{
  --noir:#070707;--n2:#0f0f0f;--n3:#171717;--n4:#1f1f1f;--n5:#2a2a2a;
  --rouge:#CC0000;--rouge-vif:#E8000B;--rouge-glow:rgba(204,0,0,.4);
  --or:#D4A017;--or-plein:#D4A017;--or-dim:rgba(212,160,23,.18);
  --blanc:#fff;--doux:rgba(255,255,255,.87);--dim:rgba(255,255,255,.45);
  --tres-dim:rgba(255,255,255,.3);--faint:rgba(255,255,255,.07);
  --champ:rgba(0,0,0,.35);--vert:#22C55E;--erreur:#ff6b6b;
}
html,body{background:var(--noir);color:var(--blanc);font-family:var(--inter);overflow-x:hidden;min-height:100%;}
button,input{font-family:var(--inter);outline:none;}
button{cursor:pointer;border:none;}
svg{display:block;}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;position:relative;}
.hidden{display:none!important;}

/* ===== ECRAN D'ENTREE : le clip =====
   Repris de rejoindre.html, qui n'est plus qu'une redirection. Le clip vit
   ici parce que c'est cette page que partagent les Ambassadeurs : quand il
   etait sur une page a part, tous les liens de parrainage le sautaient. */
#splash{position:fixed;inset:0;z-index:80;background:var(--noir);overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 22px calc(38px + env(safe-area-inset-bottom,0px));
  transition:opacity .5s ease,visibility .5s ease;}
#splash.out{opacity:0;visibility:hidden;}
body.splash-on{overflow:hidden;}
/* Une vignette de 24 pixels de cote, floutee, ecrite dans la feuille de style :
   elle ne coute aucune requete et se peint donc en meme temps que le bouton.
   Le fan voit la silhouette de Serge tout de suite, la vraie photo prend sa
   place ensuite. C'est ce qui supprime l'ecran noir, pas le gain de vitesse. */
.clip-layer{position:absolute;inset:0;z-index:0;overflow:hidden;
  background:var(--noir) url('data:image/webp;base64,UklGRowAAABXRUJQVlA4IIAAAADwBACdASoYABgAPrVInEsnJKMht+gA4BaJaADI1DJQ0QeIWkh5phHNaz2FrylzEgAA/vaIuUc1c4GFVxmRYikYbbN8WMbtoLHae2ux1Vt79aL1hIq5P4JMUTPk7Q6XrwUJyEpebrb5tXnljgc9rfUU15MqkDmo0u+NOo+ZmgAAAA==') center 18%/cover no-repeat;}
.clip-layer img{opacity:0;transition:opacity .45s ease;}
.clip-layer img.vue{opacity:1;}
.clip-layer video,.clip-layer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;}
.clip-layer video{opacity:0;transition:opacity 1s ease;}
.clip-layer.joue video{opacity:1;}
/* YouTube en fond : on agrandit le 16/9 pour couvrir sans bande noire. Le
   lecteur reste invisible tant qu'il ne joue pas reellement (classe .joue
   posee par le script). Sans ca, un iPhone qui refuse la lecture automatique
   affiche un rectangle noir par dessus la photo. */
.clip-layer iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;border:0;pointer-events:none;
  opacity:0;transition:opacity 1s ease;}
.clip-layer.joue iframe{opacity:1;}
/* Repli anime : quand la video ne peut pas jouer, la photo respire au lieu
   d'etre figee. */
.clip-layer img{animation:respire 20s ease-in-out infinite alternate;}
.clip-layer.joue img{animation:none;}
@keyframes respire{from{transform:scale(1)}to{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.clip-layer img{animation:none;}}
.clip-ov{position:absolute;inset:0;z-index:1;
  background:linear-gradient(0deg,rgba(7,7,7,.92) 0%,rgba(7,7,7,.55) 14%,rgba(7,7,7,0) 34%);}
.splash-c{position:relative;z-index:2;max-width:560px;margin:0 auto;width:100%;animation:rise .8s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.btn-clip{width:100%;min-height:56px;background:var(--rouge);color:#fff;padding:17px 20px;border-radius:12px;
  font-size:14px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  box-shadow:0 10px 34px var(--rouge-glow);display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .2s,background .2s;}
.btn-clip:active{background:var(--rouge-vif);transform:scale(.985);}
.btn-clip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;flex-shrink:0;}

/* JOIN */
.join-hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 22px 34px;overflow:hidden;}
.join-bg{position:absolute;inset:0;background:url('serge-hero.jpg') center 15%/cover no-repeat;filter:brightness(.44);}
.join-ov{position:absolute;inset:0;background:linear-gradient(0deg,var(--noir) 4%,rgba(7,7,7,.6) 46%,rgba(150,0,0,.15) 78%,rgba(7,7,7,.85) 100%);}
/* Meme raison que le bandeau : une photo plein ecran derriere. */
.join-c{position:relative;z-index:2;color:var(--blanc);}
.eyebrow{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(204,0,0,.5);border-radius:2px;padding:5px 11px;font-size:10px;font-weight:800;color:var(--rouge-texte);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:16px;}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--rouge);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.join-title{font-family:var(--bebas);font-size:66px;line-height:.86;letter-spacing:1px;margin-bottom:10px;}
.join-title .r{color:var(--rouge);}
/* La signature de la marque. Elle remplace les capitales partout ou le nom
   se pose en tant que nom, jamais dans un texte a lire ou a recopier. */
.sig{font-family:var(--manus);font-weight:700;letter-spacing:0;
  text-transform:none;font-size:1.2em;line-height:1;}
.join-sub{font-size:14px;color:rgba(255,255,255,.66);line-height:1.6;margin-bottom:22px;max-width:410px;}
.ref-note{display:flex;align-items:center;gap:8px;background:var(--or-dim);border:1px solid rgba(212,160,23,.3);border-radius:10px;padding:10px 13px;font-size:12px;color:#e8c778;margin-bottom:18px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
.field input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:14px 15px;font-size:15px;color:#fff;}
.field input:focus{border-color:var(--rouge);background:rgba(255,255,255,.09);}
.field input::placeholder{color:rgba(255,255,255,.3);}
.btn-join{width:100%;background:var(--rouge);color:#fff;padding:16px;border-radius:12px;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-top:6px;box-shadow:0 8px 30px var(--rouge-glow);display:flex;align-items:center;justify-content:center;gap:9px;}
.btn-join:active{background:var(--rouge-vif);}
.btn-join:disabled{opacity:.55;}
.join-alt{text-align:center;margin-top:16px;font-size:12px;color:var(--dim);}
.join-alt a{color:var(--or);font-weight:600;cursor:pointer;}
.err{color:#ff6b6b;font-size:12px;margin-top:8px;text-align:center;min-height:16px;}
.legal{font-size:10px;color:rgba(255,255,255,.28);text-align:center;margin-top:14px;line-height:1.5;}

/* MEMBER */
.m-hero{position:relative;padding:26px 20px 22px;overflow:hidden;}
/* ===== LE BANDEAU QUI DEFILE =====
   Le bandeau etait une photo fixe. Il devient le defilement, DERRIERE le nom du
   fan : aucune hauteur ajoutee, et l'ecran devient vivant sans devenir plus
   charge. C'etait la seule facon de tenir les deux demandes de Mac Arthur du
   15/09, « un hero qui defile » et « une interface moins fouillis », qui se
   contredisent des qu'on ajoute un troisieme bloc d'image avant le fil.

   Les vues glissent de gauche a droite par translation de la piste, et non par
   fondu : c'est le geste demande.

   Le poids est la seule vraie contrainte. La premiere vue est la photo DEJA
   prechargee dans le <head> (R-82, l'ecran noir du 14/09) : elle ne coute donc
   rien de plus. Les deux suivantes sont posees par le script APRES le
   chargement de la page, sinon trois images se disputeraient le premier
   affichage sur un reseau ivoirien, et on retomberait exactement dans le
   defaut qu'on a corrige. */
.m-hero-bg{position:absolute;inset:0;overflow:hidden;filter:brightness(.34);}
.hb-piste{display:flex;height:100%;width:100%;
  transition:transform .9s cubic-bezier(.4,0,.2,1);will-change:transform;}
.hb-i{flex:0 0 100%;height:100%;background-position:center 12%;
  background-size:cover;background-repeat:no-repeat;}
/* Les puces disent seulement ou on en est. Elles ne sont pas cliquables, donc
   pas de zone de tap a 44 px a caser dans un bandeau qu'on veut epure : c'est
   un fond decoratif, il ne porte aucune information qu'on puisse manquer. */
.hb-pts{position:absolute;right:20px;bottom:14px;z-index:3;display:flex;gap:6px;}
.hb-pt{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);
  transition:background .3s,width .3s;}
.hb-pt.on{width:18px;border-radius:3px;background:#fff;}
/* Mouvement reduit : on ne fait plus defiler, et la premiere vue reste. */
@media (prefers-reduced-motion:reduce){
  .hb-piste{transition:none;}
  .hb-pts{display:none;}
}
.m-hero-ov{position:absolute;inset:0;background:linear-gradient(0deg,var(--noir),rgba(7,7,7,.45));}
/* Le bandeau porte la photo de Serge dans les deux themes. La couleur du
   texte doit etre posee ici : body porte var(--blanc), et body est en
   dehors du bloc, donc en dehors de la redeclaration des jetons. */
.m-hero-c{position:relative;z-index:2;color:var(--blanc);}
.m-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
/* La bascule clair / sombre. Posee sur la photo du bandeau, donc trait blanc
   dans les deux themes. 44 px de cote (UX_SYSTEM section 9) : c'est la seule
   commande de cet ecran, elle ne se rate pas. L'icone montre ce qu'on va
   obtenir, pas ce qu'on quitte : soleil en mode sombre, lune en mode clair. */
.bascule{width:44px;height:44px;flex-shrink:0;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.20);border-radius:12px;
  display:flex;align-items:center;justify-content:center;transition:background .2s;}
.bascule:active{background:rgba(255,255,255,.24);}
.bascule svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}
.bascule .ico-lune{display:none;}
:root[data-theme="clair"] .bascule .ico-lune{display:block;}
:root[data-theme="clair"] .bascule .ico-soleil{display:none;}
/* Les deux commandes du bandeau, groupees a droite. */
.m-act{display:flex;align-items:center;gap:8px;flex-shrink:0;}
/* ===== LA CLOCHE, EN HAUT =====
   L'activation vivait TOUT EN BAS de l'espace, sous la totalite du fil : pour
   la trouver il fallait avoir fait defiler chaque publication, donc elle ne se
   trouvait pas. Elle monte dans le bandeau, au meme gabarit que la bascule,
   44 px (UX_SYSTEM section 9).
   La cloche porte l'etat, le panneau porte les mots. Un appui ouvre le
   panneau, et c'est le panneau qui declenche la demande du navigateur : on ne
   demande jamais la permission sans l'avoir expliquee, parce qu'un refus ne se
   redemande pas, il est perdu pour de bon. */
.cloche-h{position:relative;width:44px;height:44px;flex-shrink:0;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;}
.cloche-h:active{background:rgba(255,255,255,.24);}
.cloche-h svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}
/* Active : le fond passe au rouge de la marque. Une epaisseur de trait qui
   change ne se lit pas a 20 px, une surface pleine se lit de loin. */
.cloche-h.on{background:var(--rouge);border-color:transparent;}
/* Bloquee par le navigateur : la cloche s'eteint et se barre. Elle reste la,
   parce qu'elle est le seul endroit qui explique comment debloquer. */
.cloche-h.non svg{stroke:rgba(255,255,255,.45);}
.cloche-h .barre{display:none;}
.cloche-h.non .barre{display:block;}
/* La pastille ne dit qu'une chose : il reste un geste a faire. Elle s'eteint
   des que c'est actif, et ne revient jamais reclamer. Le cerne sombre la
   detache de la photo du bandeau, qui peut etre claire a cet endroit. */
.cloche-pt{position:absolute;top:7px;right:7px;width:9px;height:9px;
  border-radius:50%;background:var(--rouge-vif);
  box-shadow:0 0 0 2px rgba(7,7,7,.55);}
.brand{display:flex;align-items:center;gap:8px;}
.brand-name{font-family:var(--manus);font-size:20px;font-weight:700;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.78);}
/* 44px minimum sur toute zone tactile (UX_SYSTEM). Ce bouton faisait 14px
   de haut : on visait a cote une fois sur deux. */
.logout{font-size:11px;color:rgba(255,255,255,.35);background:none;min-height:44px;padding:0 4px;display:flex;align-items:center;}
.grade-badge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 13px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;}
.grade-badge.membre{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.12);}
.grade-badge.ambassadeur{background:var(--or-dim);color:var(--or);border:1px solid rgba(212,160,23,.4);}
/* Le rappel, juste au-dessus du prenom. La cloche est en haut a droite, ou
   rien n'oblige a regarder : cette ligne est la seule chose qui la designe.
   Elle se lit avant le prenom, donc avant tout le reste de l'ecran.
   Elle ne vit que tant qu'il reste le geste a faire, et disparait pour
   toujours des que les notifications sont actives : un rappel qui survit a
   son objet devient du decor, et on n'en lit plus aucun.
   Cliquable, et pas seulement du texte : designer un bouton sans reagir au
   doigt qui se pose dessus, c'est fabriquer un defaut. 44 px de haut
   (UX_SYSTEM section 9), pris en partie sur la marge du badge de grade
   au-dessus, pour ne pas rallonger le bandeau qu'on vient de raccourcir. */
.rappel-cloche{display:inline-flex;align-items:center;gap:7px;min-height:44px;
  padding:0 2px;margin:-6px 0 2px;background:none;text-align:left;
  font-size:12.5px;line-height:1.4;color:rgba(255,255,255,.72);}
.rappel-cloche svg{width:15px;height:15px;flex-shrink:0;stroke:var(--rouge-vif);
  fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.rappel-cloche u{text-decoration-color:rgba(255,255,255,.35);text-underline-offset:3px;}
.rappel-cloche:active{color:#fff;}
.m-hello{font-family:var(--bebas);font-size:40px;line-height:.95;letter-spacing:1px;}
.m-hello .r{color:var(--rouge);}
.m-hello-sub{font-size:13px;color:rgba(255,255,255,.5);margin-top:6px;}
/* La place pour la barre du bas, plus l'encoche du telephone. Sans ca, le
   dernier post se cache derriere la barre et personne ne le lit. */
.scroll{padding:4px 20px calc(78px + env(safe-area-inset-bottom,0px));}

/* ═══════════ LES TROIS ONGLETS ═══════════
   La bascule se fait EN MEMOIRE : ni le chemin ni la query string ne bougent.
   Ce n'est pas un detail d'implementation, c'est une contrainte. ambLink()
   fabrique le lien de parrainage a partir de location.pathname, et les
   Ambassadeurs en ont deja partage sur WhatsApp : un routage par chemin les
   casserait tous. Trouvaille n°5 du contre-audit du 18/09. */
/* Le fond passe par un JETON, pas par une couleur ecrite en dur. La premiere
   version portait rgba(13,13,13,.97) : en mode clair, le texte devenait sombre
   et le fond restait noir, soit du sombre sur du sombre, contraste 1:1. Les
   libelles des trois onglets etaient purement invisibles. Trouve par
   recette-theme.js le 19/09, pas a l'oeil. */
.barre-ong{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--n2);backdrop-filter:blur(14px);
  border-top:1px solid var(--faint);padding-bottom:env(safe-area-inset-bottom,0px);}
.ong{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;background:none;color:var(--dim);
  font-size:10.5px;font-weight:700;letter-spacing:.4px;position:relative;}
.ong svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.ong.on{color:var(--blanc);}
/* L'onglet du centre porte un bouton plein. Sans lui il se lit comme « le
   deuxieme des trois » alors qu'il est l'accueil. */
.ong.centre .ong-rond{width:46px;height:46px;border-radius:15px;background:var(--n4);
  border:1px solid var(--faint);display:flex;align-items:center;justify-content:center;
  margin-top:-10px;transition:background .2s,border-color .2s;}
/* L'icone du centre devient blanche quand le fond passe au rouge, dans les deux
   themes : sinon en clair elle reste sombre sur du rouge. */
.ong.centre.on .ong-rond svg{stroke:#fff;}
.ong.centre.on .ong-rond{background:var(--rouge);border-color:transparent;
  box-shadow:0 6px 20px var(--rouge-glow);}
.ong-pt{position:absolute;top:11px;right:calc(50% - 17px);width:7px;height:7px;
  border-radius:50%;background:var(--rouge-vif);}

/* ═══════════ LA RANGEE DE REELS ═══════════
   Elle se construit sur les contenus DEJA en base dont l'adresse contient
   « /shorts/ », que le lecteur sait deja reconnaitre comme verticaux. Aucun
   nouveau type de contenu, aucune migration, aucun champ de plus pour Serge :
   c'est ce qui garde la marche arriere a une demi-journee (trouvaille n°7).

   Et les vignettes viennent de YouTube, hors de notre fonction Cloudflare. Huit
   reels ajouteraient 200 a 280 Ko a l'ecran d'ouverture, ce qui reprendrait d'une
   main le gain des photos (trouvaille n°6). On en charge donc TROIS tout de
   suite, et les suivantes au defilement. */
.reels{display:flex;gap:10px;overflow-x:auto;padding:2px 0 16px;margin:0 -20px;
  padding-left:20px;padding-right:20px;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.reels::-webkit-scrollbar{display:none;}
.reel{flex:0 0 108px;height:192px;border-radius:14px;scroll-snap-align:start;
  position:relative;overflow:hidden;background:var(--n4);
  border:1px solid var(--faint);display:flex;align-items:flex-end;padding:10px;}
/* `cover` fait le travail : quelle que soit la forme de l'image d'origine, elle
   remplit la carte et c'est le debord qui est coupe, jamais l'inverse. C'est ce
   qui rend les vignettes UNIFORMES : sans lui, une image 4/3 se pose dans un
   cadre vertical en laissant du vide en haut et en bas, et une carte sur deux
   parait cassee. */
.reel-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center;display:block;}
.reel::after{content:'';position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(7,7,7,.94) 0%,rgba(7,7,7,.55) 38%,transparent 72%);}
/* Deux lignes, pas trois : a la troisieme le titre mangeait l'image. */
.reel-t{position:relative;z-index:2;font-size:11px;font-weight:700;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.reels-titre{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--dim);padding:2px 0 10px;}

/* Le Live au repos : il porte la date et les rediffusions, donc il n'est jamais
   vide. Un onglet eteint pendant deux mois et demi ne dit pas « pas de live »,
   il dit « c'est casse ». */
.compte{display:flex;gap:9px;margin:14px 0 4px;}
.compte div{flex:1;background:var(--n4);border-radius:12px;padding:11px 6px;text-align:center;}
.compte b{display:block;font-family:var(--bebas);font-size:27px;line-height:1;font-weight:400;}
.compte span{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);}
.card{background:var(--n3);border:1px solid var(--faint);border-radius:18px;padding:18px;margin-bottom:14px;}
.sec-title{font-family:var(--bebas);font-size:24px;letter-spacing:1px;margin:22px 0 12px;}

/* ===== AMBASSADEUR, REPLIABLE =====
   « La partie Ambassadeur prend trop de place » (Mac Arthur, 15/09). Depliee
   elle fait pres de 600 px avant le premier post, alors qu'on ne partage pas
   son lien a chaque visite : on vient lire le fil. Repliee par defaut, elle
   garde ses chiffres en tete, donc elle reste utile sans rien couter.

   Le repli est retenu d'une visite a l'autre, comme l'onglet du pilotage.
   Attention en y touchant : la refonte du 13/09 avait SUPPRIME des conteneurs
   repliables et deux fonctions visaient encore les noeuds disparus, ce qui a
   vide un ecran entier (R-83). Ici le corps reste dans le document, seulement
   masque : tout ce que le script y ecrit continue de le trouver. */
.amb-tete{width:100%;display:flex;align-items:center;gap:10px;background:none;
  padding:0;min-height:44px;text-align:left;color:var(--blanc);}
.amb-tete svg.et{width:20px;height:20px;stroke:var(--or);fill:none;stroke-width:2;flex-shrink:0;}
.amb-tt{flex:1;min-width:0;}
.amb-tt b{display:block;font-size:14px;font-weight:800;}
.amb-res{font-size:11.5px;color:var(--dim);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.amb-res i{font-style:normal;color:var(--or);font-weight:700;}
.amb-chev{width:20px;height:20px;flex-shrink:0;transition:transform .25s;}
.amb-chev svg{width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;}
.amb-card.ouvert .amb-chev{transform:rotate(180deg);}
.amb-corps{display:none;}
.amb-card.ouvert .amb-corps{display:block;animation:deplie .25s ease both;}
@keyframes deplie{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .amb-card.ouvert .amb-corps{animation:none;}
  .amb-chev{transition:none;}
}

/* Ambassadeur */
.amb-card{background:linear-gradient(135deg,var(--amb-fond),var(--n3));border:1px solid rgba(212,160,23,.28);}
/* ===== LE SCORE, EN CHIFFRES PLUTOT QU'EN PHRASES =====
   Le 14/09, cette carte disait QUATRE fois la meme chose : une phrase sur les
   points, une phrase sur ce qui manque, un encart rouge de relance, puis la
   liste nommee. Mac Arthur : « ce bloc fait trop texte ». Le defaut n'etait pas
   un manque de decoration, c'etait de la redondance.
   Trois chiffres dans la grammaire que l'application utilise deja ailleurs (le
   Bebas des grands nombres du pilotage), et les deux compteurs du concours
   deviennent lisibles d'un coup d'oeil : c'etait justement la confusion de
   depart entre « 2 entres » et « 0 point ». */
.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin:16px 0 0;padding:16px 0;
  border-top:1px solid var(--faint);border-bottom:1px solid var(--faint);}
.sc-c{min-width:0;text-align:center;}
.sc-n{font-family:var(--bebas);font-size:34px;line-height:.9;letter-spacing:1px;}
.sc-c.pts .sc-n{color:var(--or);}
.sc-c.j .sc-n{color:var(--dim);}
.sc-l{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--dim);margin-top:8px;}
/* La barre vers le grade existait en CSS depuis l'origine et AUCUN element ne
   la peignait : la carte promettait un grade sans jamais montrer la
   progression. Elle sert enfin. */
/* 24 px sous la barre : a 4 px elle touchait le champ du lien, les deux
   blocs se lisaient comme un seul. */
.gr{margin:16px 0 24px;}

/* Le bouton de relance. Un bouton par personne serait impossible : on n'a pas
   leur numero, et l'exposer violerait la regle « on n'expose jamais le
   WhatsApp des autres membres ». Un seul bouton, un message pret, le fan
   choisit le destinataire dans WhatsApp. Volontairement plus discret que
   « Inviter » : relancer n'est pas le geste principal. */
.fil-b{width:100%;margin-top:16px;min-height:44px;background:var(--n4);
  border:1px solid var(--faint);border-radius:11px;color:var(--blanc);
  font-size:12.5px;font-weight:800;letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:8px;}
.fil-b:active{background:var(--n5);}
.fil-b svg{width:15px;height:15px;fill:currentColor;stroke:none;flex-shrink:0;}

/* Le fond brun de cette carte est plus clair que la page : le texte secondaire
   y tombe a 4,48:1 au lieu des 4,5 exiges, mesure par la recette et non juge a
   l'oeil (R-24). On releve le jeton pour cette carte seulement, ce qui corrige
   d'un coup les quatre textes concernes, dont le paragraphe qui etait deja la,
   au lieu d'en eclaircir un seul et de desaccorder la carte. Le mode clair,
   lui, est deja a 5,79:1 et n'a pas besoin d'etre touche. */
:root:not([data-theme="clair"]) .amb-card{--dim:rgba(255,255,255,.52);}
/* Meme motif pour le compte a rebours du direct. Le jeton --dim est calibre
   sur le fond de la page (#0D0D0D, 4,53:1, tout juste au-dessus du seuil).
   Pose sur une carte plus claire (--n4), il tombe a 4,40:1 et « jours »,
   « heures », « min » passent sous le seuil en mode sombre. Trouve par la
   recette le 19/09, jamais par l’oeil : ces trois mots font 9,5 px.
   Regle generale : un jeton de texte attenue se revalide sur CHAQUE fond ou
   on le pose, il ne se transporte pas. */
:root:not([data-theme="clair"]) .compte div{--dim:rgba(255,255,255,.52);}
.amb-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.amb-h svg{width:20px;height:20px;stroke:var(--or);fill:none;stroke-width:2;}
.amb-title{font-size:15px;font-weight:800;}
.amb-desc{font-size:12px;color:var(--dim);line-height:1.55;margin-bottom:14px;}
.amb-link{display:flex;gap:8px;margin-bottom:14px;}
.amb-link input{flex:1;background:var(--champ);border:1px solid var(--faint);border-radius:10px;padding:11px 12px;font-size:12px;color:var(--or);min-width:0;}
.amb-copy{background:var(--or-plein);color:#000;border-radius:10px;padding:0 16px;min-height:44px;font-size:12px;font-weight:800;white-space:nowrap;}
.amb-share{width:100%;background:#25D366;color:#fff;border-radius:11px;padding:13px;min-height:44px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:14px;}
.amb-prog-lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px;}
.amb-prog-lbl b{color:var(--or);}
.amb-bar{height:8px;background:var(--piste-douce);border-radius:5px;overflow:hidden;}
.amb-fill{height:100%;background:linear-gradient(90deg,var(--or-plein),#f0c14b);border-radius:5px;transition:width .5s;}
.amb-done{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--or);font-weight:700;}

/* ===================== LE FIL =====================
   Une seule colonne de posts, dans la grammaire que les fans connaissent
   deja : media, coeur, bulle, legende, commentaires. L'identite reste
   celle de latiss.net (noir et rouge), on emprunte les gestes, pas
   la marque : un fan qui ne verrait aucune difference se demanderait
   pourquoi il n'est pas reste sur Instagram. */
.post{background:var(--n3);border:1px solid var(--faint);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.post-head{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.post-av{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--rouge);flex-shrink:0;}
.post-av img{width:100%;height:100%;object-fit:cover;object-position:top;}
.post-id{min-width:0;}
.post-name{font-size:13px;font-weight:800;display:flex;align-items:center;gap:5px;}
.post-verif{color:var(--rouge-texte);font-size:12px;}
.post-sub{font-size:10px;color:var(--dim);margin-top:1px;}
.post-time{font-size:10px;color:var(--dim);margin-left:auto;flex-shrink:0;}
.post-media{background:var(--media);line-height:0;}
.post-media img{width:100%;display:block;max-height:78vh;object-fit:cover;cursor:pointer;}
.post-corps{padding:0 14px 12px;}
.post-titre{font-size:15px;font-weight:800;margin-bottom:3px;}
.post-desc{font-size:12px;color:var(--dim);line-height:1.5;}
.post-tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--or);border:1px solid var(--or-dim);border-radius:3px;padding:3px 7px;margin:0 14px 8px;}
/* Chaque bouton d'action fait au moins 44 px de haut (UX_SYSTEM). */
.post-actions{display:flex;align-items:center;gap:2px;padding:2px 8px;}
/* 44 px de HAUT et de LARGE. La hauteur etait tenue, la largeur non : 8 px de
   marge de chaque cote autour d'une icone de 23 px donnaient 39 px. Ce sont les
   trois gestes les plus frequents de l'application, coeur, commentaire, partage,
   et c'est la qu'on visait a cote. Mesure du 18/09. */
.ico-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:none;
  color:var(--blanc);padding:11px 8px;min-height:44px;min-width:44px;
  font-size:13px;font-weight:700;transition:opacity .15s;}
.ico-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;}
.ico-btn.liked{color:var(--rouge-texte);}
.ico-btn.liked svg{fill:var(--rouge-texte);stroke:var(--rouge-texte);}
.ico-btn:active{opacity:.5;}
.post-likes{padding:0 14px 4px;font-size:13px;font-weight:800;}
.post-legende{padding:0 14px 10px;font-size:13.5px;line-height:1.55;color:var(--doux);
  white-space:pre-wrap;overflow-wrap:anywhere;}
.post-legende b{font-weight:800;margin-right:6px;}
.voir-cmt{display:block;width:100%;text-align:left;padding:4px 14px 10px;min-height:44px;
  font-size:13px;color:var(--dim);background:none;}
.cmts{padding:0 14px 4px;}
.cmt{display:flex;gap:9px;padding:7px 0;}
.cmt-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--av1),var(--av2));
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.cmt-b{flex:1;min-width:0;}
.cmt-l1{font-size:12.5px;line-height:1.5;overflow-wrap:anywhere;}
.cmt-l1 b{font-weight:800;margin-right:6px;}
.cmt-time{font-size:10px;color:var(--dim);margin-top:2px;}
.cmt-form{display:flex;gap:8px;align-items:center;padding:8px 14px 12px;border-top:1px solid var(--faint);margin-top:4px;}
/* 16 px obligatoires : en dessous, Safari iOS zoome tout seul a la saisie. */
.cmt-form input{flex:1;background:var(--champ);border:1px solid var(--faint);border-radius:22px;
  padding:11px 15px;font-size:16px;color:var(--blanc);min-width:0;}
.cmt-form button{background:none;color:var(--rouge-texte);font-size:14px;font-weight:800;
  min-height:44px;padding:0 4px;flex-shrink:0;}
.empty{font-size:13px;color:var(--dim);text-align:center;padding:28px 20px;line-height:1.7;}

/* Le concours, fondu dans la carte de parrainage. C'est le meme sujet :
   inviter. Deux cartes separees pour une seule action, c'est deux fois plus
   a lire pour rien. */
.conc-ligne{display:flex;align-items:baseline;gap:8px;margin-top:13px;padding-top:12px;
  border-top:1px solid var(--faint);font-size:13px;flex-wrap:wrap;}
.conc-ligne b{color:var(--or);font-weight:800;}
.conc-ligne .gris{color:var(--dim);font-size:11.5px;}
.conc-relance{margin-top:10px;background:rgba(204,0,0,.10);border:1px solid rgba(204,0,0,.3);
  border-radius:11px;padding:11px 13px;font-size:12px;line-height:1.6;color:var(--doux);}
.conc-relance b{color:var(--rouge-vif);}
/* ===== QUI EST ENTRE GRACE A LUI =====
   La relance annoncait "2 personnes ne comptent pas encore, dis-leur
   d'activer leurs notifications" sans dire a qui le dire. On ne relance pas
   un nombre. Une ligne par filleul, son prenom, et son etat en clair.
   Pas d'emoji comme icone (R-42) : deux SVG maison, un crochet et une
   horloge. Les couleurs passent par les jetons, donc les deux themes
   suivent sans regle dupliquee. */
.fil-l{margin-top:16px;padding-top:16px;border-top:1px solid var(--faint);
  display:flex;flex-direction:column;gap:2px;}
.fil-t{font-size:11.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
  color:var(--dim);margin-bottom:8px;}
.fil-r{display:flex;align-items:center;gap:9px;padding:8px 0;}
.fil-i{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.fil-i svg{width:16px;height:16px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.fil-r.ok .fil-i svg{stroke:var(--vert);}
.fil-r.attente .fil-i svg{stroke:var(--or);}
.fil-n{flex:1;min-width:0;font-size:13px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fil-n span{color:var(--dim);font-weight:500;font-size:11px;margin-left:6px;}
.fil-e{font-size:11px;font-weight:700;flex-shrink:0;}
.fil-r.ok .fil-e{color:var(--vert);}
.fil-r.attente .fil-e{color:var(--or);}
.conc-voir{display:block;width:100%;text-align:left;background:none;color:var(--dim);
  font-size:12px;font-weight:600;min-height:44px;padding:0;}
.conc-l{padding:2px 0 4px;}
.conc-r{display:flex;align-items:center;gap:11px;padding:8px 2px;border-radius:9px;}
.conc-r.mien{background:rgba(212,160,23,.1);}
.conc-n{width:22px;text-align:center;font-size:12px;font-weight:800;color:var(--dim);flex-shrink:0;}
.conc-r.or .conc-n{color:var(--or);}
.conc-nom{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.conc-nom span{color:var(--dim);font-weight:500;font-size:11px;margin-left:6px;}
.conc-p{font-size:13px;font-weight:800;color:var(--or);flex-shrink:0;}
.conc-p span{font-size:10px;color:var(--dim);font-weight:600;margin-left:3px;}

/* Le panneau des notifications, ouvert par la cloche du bandeau et jamais de
   lui-meme. Meme famille visuelle que le filet de securite : ce sont deux
   propositions, pas deux alertes. */
.cloche{position:relative;background:linear-gradient(180deg,rgba(204,0,0,.10),var(--n3));
  border:1px solid rgba(204,0,0,.28);border-radius:16px;padding:16px;margin-bottom:14px;
  display:flex;gap:13px;align-items:flex-start;}
.cloche-i{width:38px;height:38px;border-radius:11px;background:rgba(204,0,0,.16);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cloche-i svg{width:20px;height:20px;stroke:var(--rouge-vif);fill:none;stroke-width:2;}
.cloche-c{flex:1;min-width:0;}
/* Le titre s'arrete avant la croix, sinon il passe dessous sur un ecran de
   375 px, ou le titre tient sur deux lignes. */
.cloche-t{font-size:14px;font-weight:800;margin-bottom:4px;padding-right:32px;}
/* Refermer est un geste a part entiere : 44 px comme le reste, meme si la
   croix qu'on y voit est petite. */
.cloche-x{position:absolute;top:2px;right:2px;width:44px;height:44px;background:none;
  display:flex;align-items:center;justify-content:center;}
.cloche-x svg{width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2.2;stroke-linecap:round;}
.cloche-x:active svg{stroke:var(--blanc);}
.cloche-d{font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:12px;}
.cloche-b{width:100%;min-height:46px;background:var(--rouge);color:#fff;border-radius:11px;
  font-size:13px;font-weight:800;letter-spacing:.6px;box-shadow:0 6px 20px var(--rouge-glow);}
.cloche-b:active{background:var(--rouge-vif);}

   Le cadre etait verrouille en 16/9. Une video verticale s'y affichait au
   tiers de la largeur, entre deux bandes noires : le format fait pour attirer
   etait celui qui s'affichait le plus mal.

const CLE_THEME='bey_theme';

/* Le fil du VISITEUR passe par notre domaine, ou il est mis en cache 30 s au
   bord du reseau. Au lancement, presque tous les arrivants sont dans ce cas, et
   ils recoivent tous la meme reponse : on la recalculait pour chacun d'eux, a

   donc elle lui est propre, et la mettre en cache serait une fuite. Le relais
   refuse d'ailleurs lui-meme tout appel portant un membre_id.

   Repli : si le relais tombe, on repart vers Supabase en direct. Un defaut de
   MON cache ne doit jamais devenir une panne du fil. */
const RELAIS_FIL = 'api/feed';
function passeParLeRelais(body){
  if(!body || body.action !== 'feed') return false;
  const vide = (v) => v === undefined || v === null || v === '';
  // Un fil identifie, par jeton ou par identifiant, ne passe jamais par le
  // cache : sa reponse est propre a une personne.
  return vide(body.membre_id) && vide(body.jeton);
}
async function appelBrut(url, body){
  return fetch(url,{method:'POST',headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},body:JSON.stringify(body)});
}
async function api(body){
  if(passeParLeRelais(body)){
    try{
      const r = await appelBrut(RELAIS_FIL, body);
      if(r.ok) return r.json();

   devant la porte faisait fuir avant meme d'avoir rien prouve. */

  APERCU=true; ME=null;
  document.getElementById('view-join').classList.add('hidden');
  document.getElementById('view-member').classList.remove('hidden');
  
  document.getElementById('amb-card').classList.add('hidden');
  document.getElementById('m-grade').classList.add('hidden');
  const h=document.getElementById('m-hello');

  h.appendChild(el('span','r sig','latiss.net'));

  document.getElementById('cloche').classList.add('hidden');
  document.getElementById('cloche-h').classList.add('hidden');

  /* Pas de barre d'onglets pour un visiteur : Le Club et le Live n'ont rien a
     lui montrer, et trois onglets dont deux vides donnent l'impression d'une
     application cassee au moment precis ou on cherche a le convaincre. */
  document.getElementById('barre-ong').classList.add('hidden');
  // Le concours vit DANS la carte ambassadeur, deja masquee juste au-dessus.
  // Cette ligne visait un id 'conc' qui n'a jamais existe dans la page : elle
  // levait une exception et emportait tout le demarrage avec elle. R-83.
  cacher('conc-voir','conc-liste');
  document.querySelector('.zone-danger').classList.add('hidden');
}

/* ===================== LE CONCOURS =====================
   Un point se gagne quand un filleul ACTIVE LES NOTIFICATIONS, pas quand il
   s'inscrit. Le calcul est au serveur ; ici on peint, et surtout on dit au
   fan ce qui lui MANQUE : un classement qui affiche seulement une position
   n'a jamais fait bouger personne. */
function joursRestants(fin){
  const ms = new Date(fin).getTime() - Date.now();
  return Math.max(0, Math.ceil(ms / 86400000));
}

/* Cette fonction est appelee deux fois au demarrage : une fois avec ce que le
   telephone a garde, une fois apres confirmation du serveur. Elle vidait la
   zone AVANT d'attendre la reponse, donc les deux appels vidaient d'abord puis
   ecrivaient chacun : la ligne apparaissait en double. On vide au moment
   d'ecrire, et un compteur fait qu'une reponse en retard ne repeint jamais
   par-dessus une plus recente. */
let concSeq = 0;
async function chargerConcours(){
  const rang = ++concSeq;
  const ligne = document.getElementById('amb-rang');
  const scoreBox = document.getElementById('amb-score');
  const voir = document.getElementById('conc-voir');
  const liste = document.getElementById('conc-liste');
  if(APERCU || !ME){
    ligne.innerHTML = ''; liste.innerHTML = ''; scoreBox.innerHTML = '';
    voir.classList.add('hidden'); liste.classList.add('hidden');
    return;
  }

  let r = null;
  try{ r = await api({ action:'classement', membre_id: ME.id }); }catch(e){ r = null; }
  if(rang !== concSeq) return; // une demande plus recente est passee devant
  ligne.innerHTML = ''; liste.innerHTML = ''; scoreBox.innerHTML = '';
  voir.classList.add('hidden'); liste.classList.add('hidden');
  if(!r || !r.ok || !r.saison) return;

  const moi = r.moi || {};
  const marques = r.podium.filter(function(p){ return (p.points || 0) > 0; });
  const jours = joursRestants(r.saison.fin);

  /* ── Les trois chiffres ──────────────────────────────────────
     Ils remplacent trois phrases. « entres » et « points » cote a cote
     repondent d'eux-memes a la question que Mac Arthur a posee : pourquoi
     j'ai 2 d'un cote et 0 de l'autre. */
  const sc = el('div','sc');
  const chiffre = function(cls, valeur, libelle){
    const c = el('div','sc-c' + (cls ? ' ' + cls : ''));
    c.appendChild(el('div','sc-n', String(valeur)));
    c.appendChild(el('div','sc-l', libelle));
    return c;
  };
  const entres = moi.inscrits || 0;
  sc.appendChild(chiffre(null, entres, entres > 1 ? 'entrés' : 'entré'));
  sc.appendChild(chiffre('pts', moi.points || 0, (moi.points || 0) > 1 ? 'points' : 'point'));
  if(r.ouvert) sc.appendChild(chiffre('j', jours, jours > 1 ? 'jours' : 'jour'));
  else sc.appendChild(chiffre('j', '—', 'terminé'));
  scoreBox.appendChild(sc);

  /* ── La barre vers le grade ─────────────────────────────────
     Elle lit le compteur TOUT-TEMPS du membre, pas les inscrits de la
     saison : c'est ce compteur-la que le serveur utilise pour accorder le
     grade. Les confondre ferait une troisieme monnaie, et c'est deja la
     confusion entre deux qui a coute une session. */
  const SEUIL_AMBASSADEUR = 5; // doit rester aligne sur AMB_THRESHOLD, bey-public
  const gr = el('div','gr');
  if(ME.grade === 'ambassadeur'){
    const d = el('div','amb-done');
    d.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    d.appendChild(document.createTextNode(MOTS.ambassadeur.deja_ambassadeur));
    gr.appendChild(d);
  } else {
    const total = ME.filleuls || 0;
    const lbl = el('div','amb-prog-lbl');
    lbl.appendChild(el('span', null, MOTS.ambassadeur.vers_le_grade));
    lbl.appendChild(el('b', null, total + '/' + SEUIL_AMBASSADEUR));
    const bar = el('div','amb-bar');
    const fill = el('div','amb-fill');
    fill.style.width = Math.min(100, Math.round(total / SEUIL_AMBASSADEUR * 100)) + '%';
    bar.appendChild(fill);
    gr.appendChild(lbl); gr.appendChild(bar);
  }
  scoreBox.appendChild(gr);

  /* Le resume de la tete repliee. C'est lui qui fait que replier ne coute
     rien : les deux chiffres qui comptent restent lisibles ferme. */
  const res = document.getElementById('amb-res');
  if(res){
    res.innerHTML = '';
    if(entres > 0){
      res.appendChild(el('i', null, String(entres)));
      res.appendChild(document.createTextNode(entres > 1 ? ' entrés · ' : ' entré · '));
      res.appendChild(el('i', null, String(moi.points || 0)));
      res.appendChild(document.createTextNode((moi.points || 0) > 1 ? ' points' : ' point'));
      if(ME.grade !== 'ambassadeur')
        res.appendChild(document.createTextNode(' · ' + (ME.filleuls || 0) + '/' + SEUIL_AMBASSADEUR));
    } else {
      res.textContent = ME.grade === 'ambassadeur'
        ? MOTS.ambassadeur.deja_ambassadeur
        : MOTS.ambassadeur.resume_seuil.replace('{n}', SEUIL_AMBASSADEUR);
    }
  }

  /* ── Une seule ligne de contexte, et seulement si elle apprend quelque
     chose. L'encart rouge de relance a ete supprime : il disait ce que la
     liste nommee juste en dessous dit mieux, et c'est ce doublon qui faisait
     « trop texte ». */
  if(marques.length && moi.points > 0 && r.ouvert && moi.manque > 0){
    const l = el('div','conc-ligne');
    l.appendChild(el('b', null, moi.rang + (moi.rang === 1 ? 'er' : 'e')));
    l.appendChild(el('span','gris', '· encore ' + moi.manque + ' point' + (moi.manque > 1 ? 's' : '') + ' pour passer devant'));
    ligne.appendChild(l);
  } else if(marques.length && !moi.points){
    const l = el('div','conc-ligne');
    l.appendChild(el('span','gris', MOTS.ambassadeur.tete_classement.replace('{prenom}', marques[0].prenom).replace('{points}', marques[0].points)));
    ligne.appendChild(l);
  }

  /* Et maintenant QUI. La phrase ci-dessus disait "dis-leur" sans nommer
     personne : Mac Arthur a cherche les prenoms de ses deux filleules le
     14/09 et ne les a trouves nulle part. Le classement, lui, ne montre que
     les gens a points > 0, donc personne tant que rien n'est confirme.
     La liste vient du serveur avec le MEME filtre de saison que le compteur
     juste au-dessus, sinon on afficherait trois noms sous une phrase qui en
     annonce deux. */
  const fs = Array.isArray(moi.filleuls) ? moi.filleuls : [];
  if(fs.length){
    const box = el('div','fil-l');
    const t = el('div','fil-t', fs.length > 1 ? MOTS.ambassadeur.entres_titre_plusieurs : MOTS.ambassadeur.entres_titre_un);
    box.appendChild(t);
    fs.forEach(function(p){
      const r = el('div','fil-r ' + (p.confirme ? 'ok' : 'attente'));
      const ic = el('div','fil-i');
      ic.innerHTML = p.confirme
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3.5 2"/></svg>';
      r.appendChild(ic);
      const nom = el('div','fil-n');
      nom.appendChild(document.createTextNode(p.prenom || 'Fan'));
      if(p.lieu) nom.appendChild(el('span', null, p.lieu));
      r.appendChild(nom);
      r.appendChild(el('div','fil-e', p.confirme ? 'compte' : 'à relancer'));
      box.appendChild(r);
    });
    ligne.appendChild(box);

    // Et le geste, pas seulement le constat.
    if(moi.en_attente > 0){
      const b = el('button','fil-b');
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18c-1.5 0-3-.4-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3C4 15.4 3.6 13.7 3.6 12 3.6 7.4 7.4 3.6 12 3.6S20.4 7.4 20.4 12 16.6 20.4 12 20.4z"/><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.6.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-1.7-.9-2.9-1.6-4-3.5-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.5C10 8.5 9.5 7.2 9.3 6.7c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.9.9-1.1 2-1 2.3.4 2.3 1.7 3.9 3.7 5.5 2.6 2.1 4.3 2 5.3 1.9.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/></svg>';
      b.appendChild(document.createTextNode(moi.en_attente > 1 ? MOTS.ambassadeur.relancer_plusieurs : MOTS.ambassadeur.relancer_un));
      b.addEventListener('click', relancerInvites);
      ligne.appendChild(b);
    }
  }

  // Le classement complet reste plie : on ne l'ouvre que si on le demande.
  if(!marques.length) return;
  voir.classList.remove('hidden');
  voir.textContent = MOTS.ambassadeur.voir_classement;
  liste.innerHTML = '';
  marques.forEach(function(p, k){
    const w = el('div','conc-r' + (k < 3 ? ' or' : '') + ((moi.rang === p.rang && moi.prenom === p.prenom) ? ' mien' : ''));
    w.appendChild(el('div','conc-n', String(p.rang)));
    const nom = el('div','conc-nom');
    nom.appendChild(document.createTextNode(p.prenom || 'Fan'));
    if(p.lieu) nom.appendChild(el('span', null, p.lieu));
    w.appendChild(nom);
    const pt = el('div','conc-p');
    pt.appendChild(document.createTextNode(String(p.points)));
    pt.appendChild(el('span', null, p.points > 1 ? 'pts' : 'pt'));
    w.appendChild(pt);
    liste.appendChild(w);
  });
}

/* ===================== GARDER SON ACCES =====================
   Le compte vit dans le stockage du navigateur. Or une application ajoutee a
   l'ecran d'accueil d'un iPhone a SON PROPRE stockage, separe de Safari,
   lui-meme separe du navigateur integre de WhatsApp. Trois mondes qui ne se
   voient pas, et les fans recevront le lien par WhatsApp.

   Le jeton personnel resout ca. Il n'est JAMAIS affiche ni copiable : on le
   glisse dans l'adresse le temps de l'ajout a l'ecran d'accueil, puis on
   l'efface. Sans quoi le fan le confondrait avec son lien de parrainage,
   qui lui est fait pour etre partage : ce serait donner son compte. */
const CLE_JETON = 'bey_jeton';

function lireJetonUrl(){
  const v = new URLSearchParams(location.search).get('m');
  return v ? String(v).replace(/[^a-zA-Z0-9]/g, '').slice(0, 64) : '';
}
/* On retire le jeton de la barre d'adresse aussitot lu : il ne doit trainer ni
   dans l'historique partage, ni dans une capture d'ecran. */
function nettoyerUrl(){
  const u = new URL(location.href);
  if(!u.searchParams.has('m')) return;
  u.searchParams.delete('m');
  history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
}
function monJeton(){
  if(ME && ME.jeton) return ME.jeton;
  try{ return localStorage.getItem(CLE_JETON) || ''; }catch(e){ return ''; }
}
function monLienAcces(){
  const j = monJeton();
  return j ? (location.origin + location.pathname + '?m=' + encodeURIComponent(j)) : '';
}

/* Sur iPhone, "ajouter a l'ecran d'accueil" fait DEUX choses d'un coup :
   ca autorise les notifications, et ca garde la session. Deux cartes pour un
   seul geste, c'etait une de trop. */
function garderAcces(){
  const j = monJeton();
  if(!j) return;
  // Le jeton n'entre dans l'adresse qu'ici : sur iPhone, "Sur l'ecran
  // d'accueil" enregistre l'adresse affichee a cet instant.
  history.replaceState(null, '', location.pathname + '?m=' + encodeURIComponent(j));

  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const box = document.getElementById('garde-pas');
  box.innerHTML = '';
  box.classList.remove('hidden');
  const t = el('div');
  t.appendChild(el('b', null, 'Sans fermer cette page :'));
  box.appendChild(t);
  const ol = document.createElement('ol');
  const pas = iOS
    ? MOTS.cloche.ecran_iphone
    : MOTS.cloche.ecran_android;
  for(const p of pas) ol.appendChild(el('li', null, p));
  box.appendChild(ol);

  // Deux minutes suffisent. Ensuite le jeton quitte l'adresse.
  setTimeout(nettoyerUrl, 120000);
}

/* ===================== LES NOTIFICATIONS =====================
   Regle tenue ici : on ne demande JAMAIS la permission a l'ouverture. Un
   navigateur qui recoit la demande trop tot se voit refuser, et cette
   permission ne se redemande pas : elle est perdue pour de bon. On la
   demande donc sur un geste volontaire, depuis une carte qui explique. */
const VAPID_PUBLIQUE = 'BPy567zKA03UA9iH1BgX-Rp8HWDJt-61qbQ5Axpy7SHi4H_Tks605sSCO-FD7D-LOjuI_ZSsPor5WSR9HVkPMM0';

function pushDisponible(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}

/* navigator.serviceWorker.ready ne rejette JAMAIS : sans service worker
   enregistre, elle reste suspendue pour toujours. Un await dessus arrete
   silencieusement tout le reste de la fonction. On borne l'attente. */
function swPret(delai){
  if(!('serviceWorker' in navigator)) return Promise.resolve(null);
  return Promise.race([
    navigator.serviceWorker.ready,
    new Promise(function(r){ setTimeout(function(){ r(null); }, delai || 4000); })
  ]);
}

/* La cloche du bandeau porte l'ETAT, le panneau porte les MOTS. etatCloche()
   ne fait que preparer les deux : elle n'ouvre jamais le panneau d'elle-meme,
   c'est l'appui sur la cloche qui l'ouvre. Seul le cas "rien a proposer"
   touche a la visibilite du panneau, pour le refermer s'il etait reste
   ouvert. */
function ouvrirCloche(){
  const carte = document.getElementById('cloche');
  carte.classList.remove('hidden');
  document.getElementById('cloche-h').setAttribute('aria-expanded','true');
  // Le panneau est en haut du defilement, sous le bandeau. Si le fan est
  // descendu dans le fil, la cloche a disparu avec le bandeau ; mais il peut
  // aussi l'avoir ouvert a mi-hauteur depuis un retour en haut partiel.
  carte.scrollIntoView({ block:'nearest', behavior:'smooth' });
}
function fermerCloche(){
  document.getElementById('cloche').classList.add('hidden');
  document.getElementById('cloche-h').setAttribute('aria-expanded','false');
  // Ce qui a ete dit une fois ne doit pas ressurgir a la reouverture : ni le
  // message d'erreur de la tentative precedente, ni les pas d'installation.
  document.getElementById('cloche-n').textContent = '';
  document.getElementById('garde-pas').classList.add('hidden');
}

async function etatCloche(){
  const bell = document.getElementById('cloche-h');
  const pastille = document.getElementById('cloche-pt');
  const rappel = document.getElementById('rappel-cloche');
  const carte = document.getElementById('cloche');
  /* La pastille et la ligne de rappel disent la meme chose, il reste un geste
     a faire. Elles s'allument et s'eteignent donc ensemble, par construction :
     deux endroits a tenir separement, c'est un endroit qu'on oubliera. */
  const resteUnGeste = (oui) => {
    pastille.classList.toggle('hidden', !oui);
    rappel.classList.toggle('hidden', !oui);
  };
  const btn = document.getElementById('cloche-b');
  const note = document.getElementById('cloche-n');
  const titre = document.getElementById('cloche-t');
  const desc = document.getElementById('cloche-d');

  // Rien a proposer : la cloche s'efface, et le panneau avec elle. Une cloche
  // qui ne mene a rien est pire qu'une cloche absente.
  if(APERCU || !ME){
    bell.classList.add('hidden');
    carte.classList.add('hidden');
    resteUnGeste(false);
    return;
  }

  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const installee = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
    || window.navigator.standalone === true;

  // Sur iPhone, ajouter a l'ecran d'accueil regle les DEUX sujets d'un coup :
  // les notifications deviennent possibles, et la session ne se perd plus au
  // changement de navigateur. Une seule porte, un seul geste.
  if(iOS && !installee){
    bell.classList.remove('hidden');
    bell.classList.remove('on','non');
    resteUnGeste(true);
    bell.setAttribute('aria-label', MOTS.cloche.etiquette_proposer);
    titre.textContent = MOTS.cloche.ecran_titre;
    desc.textContent = MOTS.cloche.ecran_desc;
    btn.classList.remove('hidden');
    btn.classList.remove('calme');
    btn.textContent = MOTS.cloche.ecran_bouton;
    btn.onclick = null;
    note.textContent = '';
    return;
  }

  if(!pushDisponible()){
    bell.classList.add('hidden');
    carte.classList.add('hidden');
    resteUnGeste(false);
    return;
  }

  if(Notification.permission === 'denied'){
    // La cloche reste, barree : elle est le seul endroit qui explique comment
    // debloquer, et le fan qui a refuse est justement celui qui la cherchera.
    bell.classList.remove('hidden');
    bell.classList.remove('on');
    bell.classList.add('non');
    resteUnGeste(false);
    bell.setAttribute('aria-label', MOTS.cloche.etiquette_bloquee);
    titre.textContent = MOTS.cloche.bloquee_titre;
    desc.textContent = MOTS.cloche.bloquee_desc;
    btn.classList.add('hidden');
    note.textContent = '';
    return;
  }

  // On peint l'etat par defaut tout de suite. Interroger le navigateur d'abord
  // revenait a ne rien afficher tant qu'il ne repondait pas, et a ne jamais
  // rien afficher s'il ne repondait pas du tout.
  bell.classList.remove('hidden');
  bell.classList.remove('on','non');
  resteUnGeste(true);
  bell.setAttribute('aria-label', MOTS.cloche.etiquette_proposer);
  btn.classList.remove('hidden');
  btn.classList.remove('calme');
  titre.textContent = MOTS.cloche.proposer_titre;
  desc.textContent = MOTS.cloche.proposer_desc;
  btn.textContent = MOTS.cloche.proposer_bouton;
  note.textContent = '';

  let abo = null;
  try{
    const reg = await swPret(4000);
    if(reg) abo = await reg.pushManager.getSubscription();
  }catch(e){ abo = null; }

  if(abo){
    // Actif : la cloche se remplit et la pastille s'eteint. Couper passe par
    // le panneau, jamais par un appui direct sur la cloche : se desabonner
    // d'un coup de pouce malheureux ne se remarque qu'a la publication
    // suivante, celle qu'on vient de rater.
    bell.classList.add('on');
    resteUnGeste(false);
    bell.setAttribute('aria-label', MOTS.cloche.etiquette_active);
    titre.textContent = MOTS.cloche.active_titre;
    desc.textContent = MOTS.cloche.active_desc;
    btn.textContent = MOTS.cloche.active_bouton;
    btn.classList.add('calme');
    note.textContent = '';
  }
}

async function basculerCloche(){
  if(!ME || !pushDisponible()) return;
  const btn = document.getElementById('cloche-b');
  const note = document.getElementById('cloche-n');
  btn.disabled = true;
  const avant = btn.textContent;
  btn.textContent = '…';
  // Le panneau ne se referme que sur un geste abouti. Sur un echec il reste
  // ouvert : c'est lui qui porte la raison, et la refermer l'emporterait.
  let abouti = false;
  try{
    const reg = await swPret(6000);
    if(!reg){
      // Le service worker n'est pas la : sans lui, aucune notification n'est
      // possible. On le dit plutot que de laisser le bouton tourner dans le vide.
      note.textContent = MOTS.cloche.indisponible;
      btn.disabled = false; btn.textContent = avant;
      return;
    }
    const dejaLa = await reg.pushManager.getSubscription();

    if(dejaLa){
      const url = dejaLa.endpoint;
      await dejaLa.unsubscribe();
      await api({ action:'push_desabonner', endpoint:url });
      toast(MOTS.cloche.coupe);
      abouti = true;
    } else {
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){
        note.textContent = perm === 'denied'
          ? MOTS.cloche.refuse
          : MOTS.cloche.plus_tard;
        btn.disabled = false; btn.textContent = avant;
        await etatCloche();
        return;
      }
      const abo = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: b64uVersOctets(VAPID_PUBLIQUE),
      });
      // On envoie l'abonnement brut : le serveur a besoin des deux cles que
      // le navigateur vient de fabriquer, elles ne sont valables que pour lui.
      const res = await api({ action:'push_abonner', membre_id:ME.id, abonnement: abo.toJSON() });
      if(!res || !res.ok){
        await abo.unsubscribe();
        note.textContent = MOTS.cloche.pas_enregistre;
        btn.disabled = false; btn.textContent = avant;
        return;
      }
      toast(MOTS.cloche.active);
      abouti = true;
      // Activer ses notifications fait gagner un point A SON PARRAIN : le
      // classement change a cette seconde, autant le montrer tout de suite.
      chargerConcours();
    }
  }catch(e){
    note.textContent = MOTS.cloche.navigateur_refuse;
  }
  btn.disabled = false;
  await etatCloche();
  if(abouti) fermerCloche();
}

/* La cle publique se transmet en octets, pas en texte. */
function b64uVersOctets(s){
  const p = (s + '='.repeat((4 - (s.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(p);
  const out = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function chargerFil(m){
  let res=null;
  // Sans membre_id, le serveur repond en mode apercu et coupe lui-meme le fil.
  /* On envoie le JETON, plus le grade. Le grade etait pris au mot par le
     serveur : il suffisait d'ecrire « ambassadeur » pour lire tout le contenu
     reserve. Corrige le 18/09, le serveur lit maintenant le grade dans la ligne
     du membre et ignore ce que la page affirme. On transmet donc de quoi
     s'identifier, et rien de plus. */
  const q = m && m.jeton ? {action:'feed', jeton:m.jeton}
          : m && m.id    ? {action:'feed', membre_id:m.id}
          :                {action:'feed'};
  try{ res=await api(q); }catch(e){ res=null; }
  if(!res||!res.ok){
    const box=document.getElementById('fil');
    box.innerHTML='';
    // R-59 : une alerte porte son action. Ici, le bouton refait l'appel.
    const w=el('div','empty', MOTS.erreur.fil_injoignable);
    const b=el('button','voir-cmt', MOTS.erreur.reessayer);
    b.style.textAlign='center';
    b.addEventListener('click',function(){ filEnChargement(); chargerFil(m); });
    box.appendChild(w); box.appendChild(b);
    return;
  }
  // Le serveur trie, fusionne et coupe : l'ecran ne fait plus que peindre.
  renderLive(res.lives||[]);
  FIL=res.fil||[];
  RESTANTS=res.restants||0;
  renderFil();
}

async function renderMember(m){
  peindreCoquille(m);

  await chargerFil(m);
}

/* ===================== LE FIL =====================
   Tout est construit en DOM et jamais en chaine (R-19) : ce fil affiche des
   commentaires ecrits par des fans et des legendes saisies depuis le tableau
   de bord. Une apostrophe dans une legende suffisait a casser l'ancien rendu,
   qui glissait les valeurs dans des attributs onclick. */
let FIL = [];
let APERCU = false;
let RESTANTS = 0;
const NS = 'http://www.w3.org/2000/svg';

function el(tag, cls, txt){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt != null) n.textContent = txt;
  return n;
}
function ico(d){
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d);
  s.appendChild(p);
  return s;
}
const D_COEUR = 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z';
const D_BULLE = 'M21 11.5a8.4 8.4 0 0 1-8.9 8.4 9.2 9.2 0 0 1-4.1-1L3 20.5l1.6-4.4A8.4 8.4 0 0 1 3 11.5a8.4 8.4 0 0 1 8.9-8.4 8.4 8.4 0 0 1 9.1 8.4z';
const D_AVION = 'M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z';
