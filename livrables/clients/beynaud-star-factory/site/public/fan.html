/* Le corps change selon le type, le reste est commun. */
function corpsDuPost(p){
  const frag = document.createDocumentFragment();

  if(p.grade_requis === 'ambassadeur'){
    frag.appendChild(el('div', 'post-tag', MOTS.fil.reserve_tag));
  }

  if(p.type === 'photo'){
    const media = el('div', 'post-media');
    const img = el('img');
    img.src = urlPhoto(p.url); img.alt = p.legende || '';
    img.loading = 'lazy';
    img.addEventListener('click', () => ouvrirVisuel(urlPhoto(p.url), p.legende));
    media.appendChild(img);
    frag.appendChild(media);
  }

  if(p.type === 'contenu'){
    const media = el('div', 'post-media');
    /* Verrouille : le serveur a deliberement retire l'adresse de la video,
       parce que ce contenu demande un billet que ce membre n'a pas. On montre
       donc l'OFFRE et pas le contenu. Sans ce cas, le lecteur affichait
       « momentanement indisponible », ce qui est faux et ne vend rien.
       Le verrou n'est pas ici : il est cote serveur. Cet ecran ne fait que
       dire proprement ce qui a deja ete decide ailleurs. */
    if(p.verrouille) media.appendChild(blocVerrouille(p));
    else media.appendChild(blocVideo(p.youtube_url, p.cover_url));
    frag.appendChild(media);
  }

  if(p.type === 'sondage'){
    frag.appendChild(blocSondage(p));
  }

  return frag;
}

/* Legende : le nom en gras puis le texte, comme dans le fil que les fans
   connaissent. Le mot de Serge n'a pas de media, c'est sa legende qui porte
   tout le post. */
function legendeDuPost(p){
  let texte = '';
  if(p.type === 'message') texte = p.contenu || '';
  else if(p.type === 'photo') texte = p.legende || '';
  else if(p.type === 'contenu') texte = [p.titre, p.description].filter(Boolean).join(' — ');
  else if(p.type === 'sondage') texte = '';
  if(!texte) return null;
  const d = el('div', 'post-legende');
  d.appendChild(el('b', null, 'sergebeynaud'));
  d.appendChild(document.createTextNode(texte));
  return d;
}

function ligneCommentaire(c){
  const w = el('div', 'cmt');
  w.appendChild(el('div', 'cmt-av', String(c.prenom || '?').charAt(0).toUpperCase()));
  const b = el('div', 'cmt-b');
  const l1 = el('div', 'cmt-l1');
  l1.appendChild(el('b', null, c.prenom || 'Fan'));
  l1.appendChild(document.createTextNode(c.contenu || ''));
  b.appendChild(l1);
  b.appendChild(el('div', 'cmt-time', timeAgo(c.created_at)));
  w.appendChild(b);
  return w;
}

function construirePost(p){
  const art = el('article', 'post');
  art.id = 'post-' + cle(p);
  art.appendChild(enTete(p));
  art.appendChild(corpsDuPost(p));
  art.appendChild(barreActions(p));

  const likes = el('div', 'post-likes');
  likes.id = 'likes-' + cle(p);
  majTexteLikes(likes, p.likes || 0);
  art.appendChild(likes);

  const lg = legendeDuPost(p);
  if(lg) art.appendChild(lg);

  // En apercu les textes sont retires par le serveur, mais le compte reste :
  // c'est la preuve sociale, et c'est elle qui donne envie d'entrer.
  const n = (p.nb_comments != null) ? p.nb_comments : (p.comments || []).length;
  const voir = el('button', 'voir-cmt');
  voir.id = 'voir-' + cle(p);
  voir.textContent = n ? MOTS.fil.voir_commentaires.replace('{n}', n).replace('{s}', n > 1 ? 's' : '') : MOTS.fil.premier_commentaire;
  voir.addEventListener('click', () => ouvrirCommentaires(p, true));
  art.appendChild(voir);

  const zone = el('div', 'cmts hidden');
  zone.id = 'cmts-' + cle(p);
  for(const c of (p.comments || [])) zone.appendChild(ligneCommentaire(c));
  art.appendChild(zone);

  const form = el('div', 'cmt-form hidden');
  form.id = 'form-' + cle(p);
  const inp = document.createElement('input');
  inp.type = 'text'; inp.maxLength = 500; inp.placeholder = MOTS.fil.commentaire_exemple;
  inp.id = 'saisie-' + cle(p);
  inp.addEventListener('keydown', (e) => { if(e.key === 'Enter') envoyerCommentaire(p); });
  const env = el('button', null, 'Publier');
  env.addEventListener('click', () => envoyerCommentaire(p));
  form.appendChild(inp); form.appendChild(env);
  art.appendChild(form);

  return art;
}

function majTexteLikes(node, n){
  node.textContent = n > 0 ? (n + ' j’aime') : '';
}

/* ===================== LECTEUR FERME =====================
   Une video du fil ne charge rien tant qu'on ne la lance pas : on pose une
   vignette, et le lecteur n'arrive qu'au clic. Il arrive sans sa barre
   (controls:0), donc sans les quatre chemins qui menent hors de la
   latiss.net, et nos propres commandes prennent le relais. */
const D_PLAY = 'M8 5v14l11-7z';
const D_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';

/* Sur une chaine saisie a la main, on ne garde que l'identifiant : le reste
   (parametres de suivi, playlist, horodatage) est reconstruit par nous. */
function idYoutube(u){
  if(!u) return '';
  const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : '';
}
function urlFermee(id){
  return 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) +
    '?enablejsapi=1&autoplay=1&controls=0&rel=0&modestbranding=1&playsinline=1' +
    '&iv_load_policy=3&fs=0&disablekb=1&cc_load_policy=0&color=white' +
    '&origin=' + encodeURIComponent(location.origin);
}
function mmss(t){
  t = Math.max(0, Math.floor(t || 0));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}

/* Construit le bloc video complet : vignette, puis lecteur et commandes. */
/* La carte d'un contenu qui demande un billet.
   Elle porte l'affiche quand il y en a une, un cadenas, et le nom de ce qui
   attend derriere. Pas de faux bouton d'achat tant que le paiement n'est pas
   branche : promettre un achat qui ne se fait pas coute plus cher que de dire
   qu'il arrive. */
function blocVerrouille(p){
  const cadre = el('div', 'verrou');
  if(p.cover_url){
    cadre.style.backgroundImage = 'url("' + p.cover_url + '")';
    cadre.classList.add('avec-affiche');
  }
  const centre = el('div', 'verrou-c');
  const ico = document.createElementNS('http://www.w3.org/2000/svg','svg');
  ico.setAttribute('viewBox','0 0 24 24'); ico.setAttribute('class','verrou-i');
  const corps = document.createElementNS('http://www.w3.org/2000/svg','rect');
  corps.setAttribute('x','4'); corps.setAttribute('y','10.5'); corps.setAttribute('width','16');
  corps.setAttribute('height','10'); corps.setAttribute('rx','2.2');
  const anse = document.createElementNS('http://www.w3.org/2000/svg','path');
  anse.setAttribute('d','M8 10.5V7.5a4 4 0 0 1 8 0v3');
  ico.appendChild(corps); ico.appendChild(anse);
  centre.appendChild(ico);
  centre.appendChild(el('div','verrou-t', MOTS.fil.verrou_titre));
  centre.appendChild(el('div','verrou-d', MOTS.fil.verrou_desc));

  /* Le champ de code. Il n'est propose qu'aux membres : un visiteur qui n'a pas
     encore de compte n'a rien a quoi rattacher un billet, et lui montrer un
     champ qui echouera est une deception evitable. */
  if(ME && ME.jeton){
    const ligne = el('div','verrou-form');
    const champ = document.createElement('input');
    champ.type = 'text'; champ.className = 'verrou-in';
    champ.placeholder = 'ABCD-EFGH'; champ.maxLength = 9;
    champ.setAttribute('autocapitalize','characters');
    champ.setAttribute('autocomplete','off');
    champ.setAttribute('aria-label', MOTS.fil.code_etiquette);
    const bouton = el('button','verrou-b', MOTS.fil.verrou_bouton);
    const note = el('div','verrou-n');
    const envoyer = async () => {
      const code = champ.value.trim();
      if(!code){ note.textContent = MOTS.fil.code_manquant; return; }
      bouton.disabled = true; const avant = bouton.textContent; bouton.textContent = '…';
      const res = await api({ action:'utiliser_code', jeton: ME.jeton, code });
      if(res && res.ok){
        toast(res.message || MOTS.fil.code_ouvert);
        // On recharge le fil : le serveur renverra desormais l'adresse de la
        // video, qu'il avait retiree. On ne deverrouille rien ici, on redemande.
        chargerFil(ME);
        return;
      }
      bouton.disabled = false; bouton.textContent = avant;
      note.textContent = (res && res.error) || MOTS.fil.code_refuse;
    };
    bouton.addEventListener('click', envoyer);
    champ.addEventListener('keydown', (e) => { if(e.key === 'Enter') envoyer(); });
    ligne.appendChild(champ); ligne.appendChild(bouton);
    centre.appendChild(ligne); centre.appendChild(note);
  }

  cadre.appendChild(centre);
  return cadre;
}

/* Les photos passent par notre domaine, plus par Supabase.
   Supabase enregistre « no-cache » en dur et ignore les en-tetes de cache :
   chaque ouverture de l'app repayait donc un aller-retour par photo, et chaque
   photo vue sortait du quota Supabase. Derriere Cloudflare, la photo est mise
   en cache un an et la bande passante est gratuite.
   On derive l'adresse du nom de fichier, sans rien changer en base : les lignes
   deja enregistrees marchent telles quelles, et une adresse qu'on ne reconnait
   pas est renvoyee intacte plutot que cassee. */
function urlPhoto(u){
  const m = /\/bey-photos\/([0-9a-f-]{36}\.(?:jpg|jpeg|png|webp))(?:$|\?)/i.exec(String(u || ''));
  return m ? 'img/' + m[1] : u;
}

function blocVideo(url, coverUrl){
  const id = idYoutube(url);
  const wrap = el('div');
  /* Le format se lit dans l'adresse elle-meme : YouTube ne sert « /shorts/ »
     que pour de la video verticale, et c'est l'adresse que donne son bouton
     Partager sur un Short. Aucune colonne de plus en base, aucun champ de plus
     pour Serge, donc rien de plus a penser au moment de publier.
     La limite, et elle est reelle : le meme Short ouvert depuis un ordinateur
     donne une adresse « watch?v= », qui ne dit pas le format. Colle depuis un
     telephone, le cadre est juste ; colle depuis un ordinateur, on retombe en
     16/9. Le jour ou ca gene, c'est un bouton Vertical dans l'espace de Serge. */
  const vertical = /\/shorts\//i.test(String(url || ''));
  const cadre = el('div', vertical ? 'video vert' : 'video');
  wrap.appendChild(cadre);

  /* ── Une video deposee en fichier ──────────────────────────────
     Le champ de Serge accepte n'importe quelle adresse, le serveur ne valide
     rien : seul ce lecteur refusait ce qui n'etait pas YouTube. Un fichier
     .mp4 depose dans le dossier du site est donc lisible sans rien construire
     d'autre, et Cloudflare Pages le sert gratuitement, sans limite de bande
     passante. C'est la voie pour ESSAYER, pas la voie definitive : un fichier
     pose la reste telechargeable par son adresse, donc il n'y a aucune
     exclusivite. Le depot direct verrouille reste la phase 2.
     L'orientation ne se devine pas dans l'adresse d'un fichier, contrairement
     a un lien /shorts/. On la demande au navigateur des qu'il connait les
     dimensions, et c'est plus fiable que n'importe quelle convention de nom. */
  if(/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(String(url || ''))){
    const v = document.createElement('video');
    v.src = url;
    v.controls = true;
    v.playsInline = true;
    v.preload = 'metadata';
    if(coverUrl) v.poster = coverUrl;
    v.setAttribute('controlsList', 'nodownload');
    v.addEventListener('loadedmetadata', function(){
      if(v.videoHeight > v.videoWidth) cadre.classList.add('vert');
    });
    cadre.appendChild(v);
    return wrap;
  }

  if(!id){
    // Lien inexploitable : on le dit calmement plutot que d'afficher un carre noir.
    cadre.appendChild(el('div', 'empty', MOTS.erreur.video_indisponible));
    return wrap;
  }

  const vign = el('div', 'vignette');
  // La vignette de YouTube evite d'avoir a stocker une image de plus.
  vign.style.backgroundImage = 'url("' + (coverUrl || ('https://i.ytimg.com/vi/' + id + '/hqdefault.jpg')) + '")';
  const rond = el('div', 'play-rond');
  rond.appendChild(ico(D_PLAY));
  vign.appendChild(rond);
  vign.setAttribute('role', 'button');
  vign.setAttribute('aria-label', MOTS.fil.lancer_video);
  cadre.appendChild(vign);

  const barre = el('div', 'v-barre hidden');
  const bPP = el('button', 'v-btn');
  bPP.appendChild(ico(D_PAUSE));
  bPP.setAttribute('aria-label', 'Pause');
  const piste = el('div', 'v-piste');
  const lu = el('div', 'v-lu');
  piste.appendChild(lu);
  const temps = el('div', 'v-temps', '0:00');
  barre.appendChild(bPP); barre.appendChild(piste); barre.appendChild(temps);
  wrap.appendChild(barre);

  let lecteur = null, tic = null;

  function poserIcone(joue){
    bPP.innerHTML = '';
    bPP.appendChild(ico(joue ? D_PAUSE : D_PLAY));
    bPP.setAttribute('aria-label', joue ? 'Pause' : 'Lecture');
  }
  function suivre(){
    clearInterval(tic);
    tic = setInterval(function(){
      if(!lecteur || !lecteur.getDuration) return;
      const d = lecteur.getDuration() || 0, t = lecteur.getCurrentTime() || 0;
      lu.style.width = (d ? (t / d * 100) : 0) + '%';
      temps.textContent = mmss(t) + (d ? ' / ' + mmss(d) : '');
    }, 500);
  }

  function lancer(){
    vign.remove();
    barre.classList.remove('hidden');
    const hote = el('div');
    hote.id = 'yt-' + id + '-' + Math.random().toString(36).slice(2, 7);
    cadre.appendChild(hote);
    demarrerApiYoutube(function(){
      /* global YT */
      lecteur = new YT.Player(hote.id, {
        videoId: id,
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1,
          iv_load_policy: 3, fs: 0, disablekb: 1, cc_load_policy: 0, color: 'white',
        },
        events: {
          onReady: function(e){ e.target.playVideo(); suivre(); },
          onStateChange: function(e){ poserIcone(e.data === 1); if(e.data === 0){ clearInterval(tic); poserIcone(false); } },
        },
      });
    });
  }

  vign.addEventListener('click', lancer);
  bPP.addEventListener('click', function(){
    if(!lecteur) return;
    const s2 = lecteur.getPlayerState ? lecteur.getPlayerState() : -1;
    if(s2 === 1) lecteur.pauseVideo(); else lecteur.playVideo();
  });
  piste.addEventListener('click', function(ev){
    if(!lecteur || !lecteur.getDuration) return;
    const r = piste.getBoundingClientRect();
    const d = lecteur.getDuration() || 0;
    if(d) lecteur.seekTo(d * Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)), true);
  });

  return wrap;
}

/* L'API de YouTube ne se charge qu'une fois pour toute la page, et plusieurs
   videos peuvent la reclamer en meme temps : on met les demandes en file. */
let apiPrete = false, fileApi = [];
function demarrerApiYoutube(cb){
  if(apiPrete || (window.YT && window.YT.Player)){ apiPrete = true; cb(); return; }
  fileApi.push(cb);
  if(fileApi.length > 1) return;
  const precedent = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = function(){
    if(typeof precedent === 'function') { try{ precedent(); }catch(e){} }
    apiPrete = true;
    const f = fileApi; fileApi = [];
    for(const g of f) g();
  };
  if(!document.getElementById('yt-api')){
    const t = document.createElement('script');
    t.id = 'yt-api'; t.src = 'https://www.youtube.com/iframe_api'; t.async = true;
    document.head.appendChild(t);
  }
}

/* La rangee de reels, batie sur ce qui EXISTE deja.
   Aucun nouveau type de contenu : on reconnait un format vertical a son
   adresse, exactement comme le lecteur le fait depuis le 17/09. Trois vignettes
   chargees tout de suite, les suivantes au defilement : elles viennent de
   YouTube et echappent a notre fonction Cloudflare, donc chacune coute. */
function renderReels(liste){
  const box = document.getElementById('reels');
  if(!box) return;
  box.innerHTML = '';
  const reels = liste.filter(p =>
    p.type === 'contenu' && !p.verrouille && /\/shorts\//i.test(String(p.youtube_url || '')));
  if(!reels.length){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');

  reels.slice(0, 12).forEach(function(p, i){
    const c = el('div', 'reel');
    const id = idYoutube(p.youtube_url);

    if(p.cover_url || id){
      const img = document.createElement('img');
      img.className = 'reel-img';
      img.alt = '';
      img.decoding = 'async';
      /* Les trois premieres arrivent tout de suite, les suivantes quand on
         defile jusqu'a elles. C'est le navigateur qui s'en charge, pas nous :
         moins de code a tenir, et il le fait mieux dans un defilement
         horizontal. */
      img.loading = i < 3 ? 'eager' : 'lazy';

      if(p.cover_url){
        img.src = p.cover_url;
      } else {
        /* `hqdefault` renvoie une image 4/3 avec des bandes noires INCRUSTEES :
           recadree dans une carte verticale, une vignette sur deux parait vide.
           `maxresdefault` est en 16/9 sans bande, mais elle n'existe pas pour
           toutes les videos. On la tente, et on retombe sur `mqdefault`, qui est
           elle aussi sans bande et TOUJOURS presente. */
        img.src = 'https://i.ytimg.com/vi/' + id + '/maxresdefault.jpg';
        img.addEventListener('error', function repli(){
          img.removeEventListener('error', repli);
          img.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
        });
      }
      c.appendChild(img);
    }

    c.appendChild(el('div', 'reel-t', p.titre || ''));
    c.setAttribute('role', 'button');
    c.setAttribute('aria-label', 'Voir ' + (p.titre || 'la vidéo'));
    c.addEventListener('click', () => {
      const cible = document.getElementById('post-' + cle(p));
      if(cible) cible.scrollIntoView({ block: 'center', behavior: 'smooth' });
    });
    box.appendChild(c);
  });
}

/* ═══════════ LA BASCULE D'ONGLET ═══════════
   EN MEMOIRE, et c'est une contrainte, pas un choix de commodite. ambLink()
   fabrique le lien de parrainage a partir de location.pathname, et les
   Ambassadeurs en ont deja partage sur WhatsApp. Un routage par chemin les
   casserait tous, sans que rien ne s'affiche en erreur : le filleul arriverait
   sur une page de membre au lieu de l'inscription, et le parrainage ne serait
   jamais credite. Trouvaille n°5 du contre-audit du 18/09.

   Le bouton Retour d'Android est gere ici aussi. Sans lui, Retour depuis Le Club
   FERME l'application au lieu de revenir au fil : c'est le premier defaut qu'un
   vrai telephone remonte, et la zone d'ombre du contre-audit le signalait. On
   empile donc une entree d'historique SANS changer l'adresse. */
let ONGLET = 'latiss';

function allerOnglet(nom, viaHistorique){
  if(!['latiss','club','live'].includes(nom)) nom = 'latiss';
  ONGLET = nom;
  ['latiss','club','live'].forEach(function(o){
    const panneau = document.getElementById('p-' + o);
    if(panneau) panneau.classList.toggle('hidden', o !== nom);
  });
  document.querySelectorAll('.ong').forEach(function(b){
    const actif = b.dataset.ong === nom;
    b.classList.toggle('on', actif);
    /* La classe ne dit rien a un lecteur d’ecran : sans aria-current, une
       personne qui navigue a la voix entend trois onglets identiques et ne
       sait jamais lequel elle regarde. */
    if(actif) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
  // Meme adresse, nouvelle entree d'historique : le Retour revient a l'onglet
  // precedent au lieu de quitter l'application.
  if(!viaHistorique) history.pushState({ onglet: nom }, '', location.href);
}

window.addEventListener('popstate', function(e){
  allerOnglet((e.state && e.state.onglet) || 'latiss', true);
});

/* ══════════ LE BANDEAU QUI DEFILE ══════════
   Les deux vues suivantes ne sont demandees qu'apres le chargement de la page :
   trois images qui se disputent le premier affichage, c'est l'ecran noir du
   14/09 qui revient (R-82). */
function monterBandeau(){
  const piste = document.getElementById('hb-piste');
  const pts = document.getElementById('hb-pts');
  if(!piste || !pts) return;
  const vues = Array.prototype.slice.call(piste.querySelectorAll('.hb-i'));
  if(vues.length < 2) return;

  pts.innerHTML = '';
  vues.forEach(function(_, i){ pts.appendChild(el('span','hb-pt' + (i ? '' : ' on'))); });
  const puces = Array.prototype.slice.call(pts.querySelectorAll('.hb-pt'));

  // Les vues 2 et 3, une fois la page posee.
  const charger = function(){
    vues.forEach(function(v){
      const src = v.getAttribute('data-src');
      if(src){
        v.style.backgroundImage = "url('" + src + "')";
        // Une source carree ne se cadre pas comme une source large : sans ca,
        // le visage de Serge sort du cadre sur la photo en 800x800.
        const pos = v.getAttribute('data-pos');
        if(pos) v.style.backgroundPosition = pos;
        v.removeAttribute('data-src');
      }
    });
  };
  if(document.readyState === 'complete') setTimeout(charger, 400);
  else window.addEventListener('load', function(){ setTimeout(charger, 400); });

  const calme = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(calme) return; // la premiere vue reste, et les puces sont masquees en CSS

  let i = 0;
  setInterval(function(){
    // Rien ne defile pendant que l'ecran d'entree est encore la, ni quand
    // l'onglet est en arriere-plan : ca ne servirait qu'a chauffer le telephone.
    if(document.hidden) return;
    if(!document.getElementById('splash').classList.contains('out')) return;
    i = (i + 1) % vues.length;
    piste.style.transform = 'translateX(-' + (i * 100) + '%)';
    puces.forEach(function(p, k){ p.classList.toggle('on', k === i); });
  }, 5000);
}

/* =====================================================================
   LE CLIP D'ENTREE  —  c'est la seule chose a changer
   ---------------------------------------------------------------------
   source : 'mp4'     -> le mieux. Demarre tout de suite, aucun logo.
            'youtube' -> ca marche, mais plus lent et logo YouTube visible.
            'image'   -> repli, tant qu'il n'y a pas de clip.
   ===================================================================== */
const CLIP = {
  source : 'youtube',

  // si source vaut 'mp4' : nom du fichier pose a cote de cette page,
  // ou adresse complete d'un .mp4
  mp4    : 'clip-entree.mp4',

  // si source vaut 'youtube' : l'adresse complete ou seulement l'identifiant
  // Mariam - Attraper pour Laisser (chaine officielle Serge Beynaud, 2 min 14)
  youtube: 'dJgduuEnnR8',

  // seconde de depart, pour tomber sur un plan fort et sauter l'intro.
  // Changer ce seul chiffre suffit.
  // 30 s : arrete par Mac Arthur le 19/09/2026. Le depart etait a 68 s, et la
  // capture de ce jour-la y montrait un gros plan de danseuse de dos sur la
  // page officielle de l'artiste. Avant cela il etait a 25 s, ecarte parce que
  // l'ecran d'entree passait 22 secondes sans jamais montrer Serge Beynaud.
  // Changer ce seul chiffre suffit.
  start  : 30,

  // duree de la boucle, en secondes. On repart au depart avant la fin du clip.
  // Motif : quand une video YouTube se termine, le lecteur affiche son ecran de
  // fin, avec le bouton rejouer et les suggestions, et tout l'habillage qu'on
  // cherche a cacher reapparait d'un coup. En bouclant court, la fin n'est
  // jamais atteinte et le plan reste toujours fort.
  duree  : 22,

  // image de repli. Elle reste DERRIERE la video : si la lecture automatique
  // est refusee (iPhone, economie de donnees), le fan voit cette image et
  // jamais un ecran noir.
  image  : 'serge-hero.jpg'
};

function ytId(v){
  if(!v) return '';
  const m=String(v).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : String(v).trim();
}
/* L'image de repli est desormais posee dans le HTML, pas creee ici : elle
   partait sinon avec tout le reste du script et le fan regardait un ecran noir
   pendant ce temps. On se contente de la retrouver, et on ne la fabrique que si
   quelqu'un a change CLIP.image sans toucher au balisage. */
function poserImage(layer){
  let img = layer.querySelector('img');
  if(img){
    if(CLIP.image && img.getAttribute('src') !== CLIP.image){
      // Le <source> webp du balisage primerait sur le nouveau src : on le retire,
      // sinon changer CLIP.image ne changerait rien a l'ecran.
      const src = layer.querySelector('source'); if(src) src.remove();
      img.classList.remove('vue'); img.src = CLIP.image;
    }
    if(img.complete && img.naturalWidth) img.classList.add('vue');
    return img;
  }
  img=document.createElement('img');
  img.alt=''; img.addEventListener('load',function(){img.classList.add('vue');});
  img.src=CLIP.image;
  layer.appendChild(img);
  return img;
}

/* Le lecteur YouTube traine plus d'un megaoctet derriere lui. Lance en meme
   temps que la photo, il lui prend la bande passante et rallonge d'autant le
   moment ou l'ecran cesse d'etre noir. On le laisse donc passer apres, avec un
   filet de 1,5 s pour le cas ou l'image ne dirait jamais rien. */
function apresImage(img, suite){
  let parti=false;
  const go=function(){ if(parti) return; parti=true; suite(); };
  setTimeout(go, 1500);
  if(!img || (img.complete && img.naturalWidth)) return go();
  img.addEventListener('load', go);
  img.addEventListener('error', go);
}

/* YouTube en fond, avec une regle stricte : on ne montre le lecteur QUE s'il
   joue vraiment. iOS Safari refuse de lancer seule une video dans une iframe
   YouTube, mais l'iframe se charge quand meme. Se fier au chargement revient
   donc a poser un rectangle noir par dessus l'image de secours. On passe par
   le lecteur officiel, qui previent quand la lecture demarre pour de bon. */
function monterYouTube(layer,id){
  const holder=document.createElement('div');
  holder.id='yt-player';
  layer.appendChild(holder);

  /* Les sous-titres se rallument tout seuls : le parametre d'URL ne suffit pas
     des que le spectateur les a actives dans son compte YouTube, et le lecteur
     recharge le module en cours de lecture. On le decharge donc a chaque
     changement d'etat, pas une seule fois au demarrage. */
  function couperSousTitres(p){
    try{p.unloadModule('captions');}catch(e){}
    try{p.unloadModule('cc');}catch(e){}
    try{p.setOption('captions','track',{});}catch(e){}
  }
  function demarrer(){
    /* global YT */
    new YT.Player('yt-player',{
      videoId:id,
      host:'https://www.youtube-nocookie.com',
      // Ni loop ni playlist : ils etaient inutiles, le code boucle lui-meme un
      // peu plus bas, et surtout "playlist" fait croire au lecteur mobile qu'il
      // en joue une. Il rallume alors son habillage avec pause, piste
      // precedente et piste suivante, en plein milieu du clip. C'est ce qui
      // ramenait les sorties vers YouTube que la refonte du 13/09 avait fermees.
      playerVars:{autoplay:1,mute:1,controls:0,
        start:CLIP.start||0,playsinline:1,rel:0,modestbranding:1,
        disablekb:1,iv_load_policy:3,fs:0,cc_load_policy:0,annotations:3},
      events:{
        onReady:function(e){e.target.mute();couperSousTitres(e.target);e.target.playVideo();},
        onApiChange:function(e){couperSousTitres(e.target);},
        onStateChange:function(e){
          couperSousTitres(e.target);
          // 1 = en lecture. C'est le seul moment ou l'on devoile le clip.
          if(e.data===1){ layer.classList.add('joue'); surveillerBoucle(e.target); }
          // 0 = terminee. Filet de secours si la boucle a laisse passer la fin :
          // on repart aussitot, plutot que de laisser paraitre l'ecran de fin.
          if(e.data===0){ try{ e.target.seekTo(CLIP.start||0, true); e.target.playVideo(); }catch(_){} }
        },
        onError:function(){layer.classList.remove('joue');}
      }
    });
  }
  /* On ne se fie pas au parametre loop de YouTube : avec un depart decale il
     repart a zero et non sur le bon plan, et il laisse parfois l'ecran de fin
     apparaitre une fraction de seconde. On boucle nous-memes. */
  let veille = null;
  function surveillerBoucle(p){
    clearInterval(veille);
    const debut = CLIP.start || 0;
    const fin = debut + (CLIP.duree || 22);
    veille = setInterval(function(){
      try{
        const t = p.getCurrentTime();
        if(t >= fin || t < debut - 1) p.seekTo(debut, true);
      }catch(e){}
    }, 400);
  }

  if(window.YT&&window.YT.Player){demarrer();return;}
  window.onYouTubeIframeAPIReady=demarrer;
  const tag=document.createElement('script');
  tag.src='https://www.youtube.com/iframe_api'; tag.async=true;
  document.head.appendChild(tag);
}

function monterClip(){
  const layer=document.getElementById('clip-layer');
  if(CLIP.source==='mp4'&&CLIP.mp4){
    // Meme regle que pour YouTube : l'image est posee dessous, et la video
    // n'est devoilee que lorsqu'elle joue pour de bon.
    poserImage(layer);
    const v=document.createElement('video');
    v.src=CLIP.mp4; v.poster=CLIP.image;
    v.muted=true; v.loop=true; v.autoplay=true; v.playsInline=true;
    v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline',''); v.setAttribute('muted','');
    v.preload='auto';
    v.addEventListener('playing',function(){layer.classList.add('joue');});
    v.addEventListener('error',function(){layer.classList.remove('joue');});
    layer.appendChild(v);
    const pr=v.play(); if(pr&&pr.catch) pr.catch(function(){});
    return;
  }
  if(CLIP.source==='youtube'&&ytId(CLIP.youtube)){
    // L'image est posee AVANT le lecteur : elle reste visible dessous, et le
    // lecteur ne demarre qu'une fois qu'elle est a l'ecran.
    const img = poserImage(layer);
    apresImage(img, function(){ monterYouTube(layer, ytId(CLIP.youtube)); });
    return;
  }
  poserImage(layer);
}

const splashEl=document.getElementById('splash');
function fermerSplash(){
  splashEl.classList.add('out');
  document.body.classList.remove('splash-on');
  window.scrollTo(0,0);
}
document.getElementById('enter-btn').addEventListener('click',fermerSplash);

document.getElementById('cloche-b').addEventListener('click',function(){
  // Le meme bouton, deux roles : sur un iPhone pas encore installe il explique
  // comment ajouter a l'ecran d'accueil, ailleurs il active les notifications.
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const installee = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
    || window.navigator.standalone === true;
  if(iOS && !installee) garderAcces(); else basculerCloche();
});

(async function(){
  if(refParam()) document.getElementById('ref-note').classList.remove('hidden');

  // Un lien d'acces personnel prime sur tout : c'est justement le cas ou le
  // navigateur n'a aucune session, parce que ce n'est pas le meme navigateur.
  /* Le bandeau ne depend d'aucun compte : il se monte UNE fois, avant que le
     demarrage se separe en branches. Pose sur chaque branche, il en manquait
     deja une, celle du lien d'acces personnel, c'est-a-dire justement celle
     qu'emprunte quelqu'un qui ouvre l'application sur un nouvel appareil.
     Meme famille que R-84 : la branche qu'on ne teste pas est celle qui casse. */
  essayer('bandeau', monterBandeau);

  const jetonUrl = lireJetonUrl();
  if(jetonUrl){
    nettoyerUrl();
    let r = null;
    try{ r = await api({action:'me', jeton: jetonUrl}); }catch(e){ r = null; }
    if(r && r.ok){
      saveMembre(r.membre);
      peindreCoquille(r.membre);
      filEnChargement();
      fermerSplash();
      await chargerFil(r.membre);
      return;
    }
    // Jeton perime ou invalide : on ne dit rien, on deroule le parcours normal.
  }

  const m=getMembre();

  // Pas de session : c'est un visiteur. Le clip s'ouvre, et l'apercu se
  // prepare DERRIERE lui : quand il appuie sur le bouton, le fil est deja la.
  if(!(m&&m.id)){
    // Le clip part EN PREMIER, et la peinture de l'apercu est isolee : ni l'un
    // ni le fil ne doivent dependre d'elle. Le 14/09 elle a echoue sur un
    // identifiant inexistant, et le visiteur est tombe sur un vide noir alors
    // que le clip et les trois publications n'avaient aucune raison de manquer.
    monterClip();
    filEnChargement();
    essayer('apercu', peindreApercu);
    chargerFil(null);
    return;
  }

  // Session connue : on l'installe chez lui tout de suite, sans attendre le
  // serveur. C'est ce qui supprime la seconde de formulaire d'inscription
  // qu'un membre de retour voyait s'afficher avant son espace.
  essayer('coquille', function(){ peindreCoquille(m); });
  filEnChargement();
  const fil=chargerFil(m);

  // Puis on confirme aupres du serveur : son prenom, son grade et son nombre
  // de filleuls ont pu changer depuis sa derniere visite.
  let res=null;
  try{ res=await api({action:'me',id:m.id}); }catch(e){ res=null; }
  if(res&&res.ok){
    const avant=m.grade;
    saveMembre(res.membre);
    peindreCoquille(res.membre);
    // Passe Ambassadeur entre-temps : le fil avait ete demande avec l'ancien
    // grade, il lui manquerait les contenus qui lui sont desormais ouverts.
    if(res.membre.grade!==avant){ filEnChargement(); chargerFil(res.membre); return; }
  } else if(res&&res.error==='introuvable'){
    // Son compte n'existe plus. Une simple panne de reseau, elle, ne doit
    // jamais le deconnecter : on ne sort que sur un refus explicite.
    localStorage.removeItem(LS);
    revenirAuFormulaire();
    fermerSplash();
    return;
  }
  await fil;
})();
