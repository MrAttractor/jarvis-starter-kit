<style>
  html, body { margin: 0; height: 100%; background: #1a120c; font-family: "Inter", sans-serif; }
  * { -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { display: none; }
  #root { min-height: 100vh; }

  @keyframes fadeUp { from { transform: translateY(9px); } to { transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(40px); } to { transform: translateY(0); } }

  image-slot { display: block; }

  /* optional dark theme — remaps key surfaces (orange unchanged) */
  .theme-dark .bg-sable { background: #14110F !important; }
  .theme-dark .bg-white { background: #1F1B18 !important; }
  .theme-dark .text-charbon { color: #F5F0E8 !important; }
  .theme-dark .text-g700 { color: #cdbfae !important; }
  .theme-dark .text-g400 { color: #8d8071 !important; }
  .theme-dark .border-g200 { border-color: #2e2823 !important; }
  .theme-dark .bg-\[\#EEE7DC\] { background: #2e2823 !important; }
  .theme-dark .lg\:bg-\[\#1a120c\] { background: #0c0907 !important; }
</style>
